<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- deploy test 2026-02-22 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fitness Tracker v3.2</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <style>
        :root {
            /* Palette Générale */
            --bg-main-1: #020617; --bg-main-2: #0f172a; --bg-main-3: #130b2a; --bg-main-4: #1e293b;
            --text-main: #e2e8f0; --text-secondary: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.2); --border-hover: rgba(165, 180, 252, 0.5);

            /* Couleurs d'accent et lueurs */
            --glow-app-title: #facc15;
            --glow-exo-title: #22d3ee;
            --glow-orange: #f97316;
            --glow-magenta: #ec4899;
            --glow-teal: #2dd4bf;
            --glow-yellow: #facc15;
            --glow-violet: #8b5cf6;
            --glow-red: #ef4444;
            --glow-green: #22c55e;

            /* --- STYLES SPÉCIFIQUES --- */
            --bg-card-start: #1e293b; --bg-card-end: #0f172a;
            --card-border-top: rgba(203, 213, 225, 0.2); --card-border-bottom: rgba(2, 6, 23, 0.4);
            --bg-secondary: rgba(15, 23, 42, 0.7);

            /* Boutons */
            --btn-backup-start: var(--glow-exo-title); --btn-backup-end: var(--glow-violet);
            --btn-import-start: var(--glow-violet); --btn-import-end: var(--glow-magenta);
            --btn-merge-start: var(--glow-teal); --btn-merge-end: var(--glow-exo-title);
            --btn-add-start: #22c55e; --btn-add-end: #16a34a;

            /* Icônes */
            --icon-color: #a5b4fc;
            --icon-delete-color: var(--glow-magenta);
            --icon-timer-color: var(--glow-violet);
            --icon-history-color: var(--glow-teal);
            --icon-stats-color: var(--glow-teal);
            --icon-backup-color: var(--glow-green);
            --icon-import-color: var(--glow-violet);
            --icon-drive-save-color: #4285F4;
            --icon-drive-load-color: #34A853;
        }

        html:not(.dark) {
            --bg-main-1: #f1f5f9; --bg-main-2: #e2e8f0; --bg-main-3: #f0f3ff; --bg-main-4: #e5eaf9;
            --text-main: #1e293b; --text-secondary: #475569;
            --border-color: rgba(71, 85, 105, 0.2); --border-hover: rgba(99, 102, 241, 0.6);
            --glow-app-title: #ca8a04;
            --glow-exo-title: #0891b2;
            --glow-orange: #ea580c;
            --glow-magenta: #be185d;
            --glow-teal: #0d9488;
            --glow-yellow: #ca8a04;
            --glow-violet: #7c3aed;
            --glow-red: #dc2626;
            --glow-green: #16a34a;
            --bg-card-start: #ffffff; --bg-card-end: #eef2ff;
            --card-border-top: rgba(255, 255, 255, 0.9); --card-border-bottom: rgba(203, 213, 225, 0.8);
            --bg-secondary: rgba(248, 250, 252, 0.7);
            --btn-add-start: #22c55e; --btn-add-end: #15803d;
            --icon-color: #4f46e5;
            --icon-backup-color: var(--glow-green);
            --icon-import-color: var(--glow-violet);
            --icon-drive-save-color: #1a73e8;
            --icon-drive-load-color: #188038;
        }

        /* === v2.0 Animated Gradient Borders === */
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes border-rotate { to { --angle: 360deg; } }
        @keyframes progress-shimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fab-pulse { 0%, 100% { box-shadow: 0 4px 20px rgba(34,197,94,0.4); } 50% { box-shadow: 0 4px 30px rgba(34,197,94,0.6), 0 0 50px rgba(34,197,94,0.2); } }
        @keyframes slideOutLeft { to { transform: translateX(-30px); opacity: 0; } }
        @keyframes slideInRight { from { transform: translateX(30px); opacity: 0; } }
        #exercise-list.slide-out-left { animation: slideOutLeft 0.2s ease forwards; }
        #exercise-list.slide-in-right { animation: slideInRight 0.2s ease forwards; }

        /* Animated gradient border on exercise cards */
        .exercise-card { position: relative; border: none !important; }
        .exercise-card::after {
            content: ''; position: absolute; inset: -1px; border-radius: inherit; z-index: -1;
            background: conic-gradient(from var(--angle), var(--glow-violet), var(--glow-teal), var(--glow-magenta), var(--glow-violet));
            /* animation removed for perf */
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            padding: 1px; opacity: 0.6;
        }
        .exercise-card:hover::after { opacity: 1; }

        /* Glassmorphism noise texture */
        .exercise-card::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E") repeat;
            opacity: 0.03; pointer-events: none; z-index: 0;
        }

        /* Glassmorphism card background */
        .exercise-card {
            background: linear-gradient(135deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
        }
        .modal-container > div:not(.modal-backdrop) {
            background: linear-gradient(135deg, rgba(30,41,59,0.85), rgba(15,23,42,0.95));
            backdrop-filter: blur(12px) saturate(1.3);
            -webkit-backdrop-filter: blur(12px) saturate(1.3);
        }
        html:not(.dark) .exercise-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(238,242,255,0.98));
        }
        html:not(.dark) .modal-container > div:not(.modal-backdrop) {
            background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(238,242,255,0.95));
        }

        /* Exercise number badge */
        .exercise-number {
            width: 32px !important; height: 32px !important; border-radius: 50% !important;
            background: linear-gradient(135deg, var(--glow-violet), var(--glow-teal)) !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            font-weight: 700 !important; font-size: 14px !important; color: #fff !important;
            box-shadow: 0 0 12px rgba(139,92,246,0.4) !important;
            -webkit-background-clip: unset !important; background-clip: unset !important;
            -webkit-text-fill-color: unset !important; text-shadow: none !important;
            animation: none !important; filter: none !important;
        }

        /* Underline-style inputs for performance */
        .editable-perf {
            background: transparent !important; border: none !important;
            border-bottom: 2px solid var(--border-color) !important;
            border-radius: 0 !important;
            transition: border-color 0.3s, box-shadow 0.3s !important;
            padding: 4px 2px !important; text-align: center;
        }
        .editable-perf:focus {
            border-bottom-color: var(--glow-violet) !important;
            box-shadow: 0 2px 8px rgba(139,92,246,0.3) !important;
            outline: none !important;
        }

        /* Program pills */
        #program-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        #program-pills::-webkit-scrollbar { display: none; }
        .program-pill {
            white-space: nowrap; padding: 8px 20px; border-radius: 9999px;
            background: rgba(30,41,59,0.6); border: 1px solid var(--border-color);
            color: var(--text-secondary); font-size: 14px; font-weight: 500;
            transition: all 0.3s; cursor: pointer; scroll-snap-align: start;
            flex-shrink: 0;
        }
        .program-pill:hover { border-color: var(--border-hover); }
        .program-pill.active {
            background: linear-gradient(135deg, var(--glow-violet), var(--glow-teal));
            color: #fff; border-color: transparent;
            box-shadow: 0 0 16px rgba(139,92,246,0.4);
        }
        html:not(.dark) .program-pill { background: rgba(241,245,249,0.8); }
        html:not(.dark) .program-pill.active { background: linear-gradient(135deg, var(--glow-violet), var(--glow-teal)); color: #fff; }

        /* Enhanced session progress bar */
        #session-progress-fill {
            background: linear-gradient(90deg, var(--glow-violet), var(--glow-teal), var(--glow-magenta)) !important;
            box-shadow: 0 0 10px rgba(139,92,246,0.5);
            border-radius: 9999px !important;
        }

        /* Enhanced FAB */
        #add-exercise-btn {
            background: linear-gradient(135deg, var(--glow-green), #059669) !important;
            box-shadow: 0 4px 20px rgba(34,197,94,0.4), 0 0 40px rgba(34,197,94,0.1) !important;
        }

        /* Enhanced modal backdrop */
        .modal-container {
            backdrop-filter: blur(8px) saturate(0.8);
            -webkit-backdrop-filter: blur(8px) saturate(0.8);
            background: rgba(2,6,23,0.7);
        }
        .modal-container > div:not(.modal-backdrop) {
            border: 1px solid rgba(148,163,184,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(139,92,246,0.1);
        }
        html:not(.dark) .modal-container { background: rgba(241,245,249,0.7); }

        /* CSS Tooltips */
        [data-tooltip] { position: relative; }
        [data-tooltip]::after {
            content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%) translateY(-4px); padding: 4px 10px;
            background: rgba(15,23,42,0.95); color: #e2e8f0; font-size: 11px;
            border-radius: 6px; white-space: nowrap; opacity: 0;
            pointer-events: none; transition: opacity 0.2s; z-index: 50;
        }
        [data-tooltip]:hover::after, [data-tooltip]:focus::after { opacity: 1; }

        @keyframes background-pan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes title-glow { 0% { text-shadow: 0 0 8px var(--glow-app-title), 0 0 10px #fff; } 70% { text-shadow: 0 0 15px var(--glow-app-title), 0 0 25px #fff; } 100% { text-shadow: 0 0 8px var(--glow-app-title), 0 0 10px #fff; } }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0px var(--glow-red), 0 0 15px rgba(0,0,0,0.5); } 50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.4), 0 0 30px rgba(0,0,0,0.7); } 100% { box-shadow: 0 0 0 0px var(--glow-red), 0 0 15px rgba(0,0,0,0.5); } }
        @keyframes number-glow { 0%, 100% { text-shadow: 0 0 6px var(--program-color, var(--glow-green)), 0 0 10px #fff, 0 0 14px #fff; } 50% { text-shadow: 0 0 12px var(--program-color, var(--glow-green)), 0 0 20px #fff, 0 0 28px #fff; } }
        @keyframes icon-glow-pulse { 0%, 100% { opacity: 1; transform: scale(1); text-shadow: 0 0 8px var(--glow-violet), 0 0 10px #fff, 0 0 15px #fff; } 50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 16px var(--glow-violet), 0 0 20px #fff, 0 0 35px #fff; } 90% { opacity: 1; transform: scale(1); } 95% { opacity: 0; transform: scale(0.9); } }
        
        /* --- Final Animation Polish --- */
        .icon-btn, #add-exercise-btn, .footer-btn, button[data-action="set-pdc"] { transition: transform 0.1s ease; }
        .icon-btn:active, #add-exercise-btn:active, .footer-btn:active, button[data-action="set-pdc"]:active { transform: scale(0.95); }

        .modal-container { transition: opacity 0.2s ease, transform 0.2s ease; opacity: 0; transform: scale(0.98); pointer-events: none; }
        .modal-container.visible { opacity: 1; transform: scale(1); pointer-events: auto; }
        
        #exercise-list { transition: opacity 0.2s ease-in-out; }

        .collapse-icon { transition: transform 0.3s ease; }
        .is-collapsed { transform: rotate(-180deg); }
        
        @keyframes flash-success-triple {
            0%, 100% { background-color: transparent; }
            15%, 45%, 75% { background-color: rgba(34, 197, 94, 0.5); }
            30%, 60%, 90% { background-color: transparent; }
        }
        .input-bg { position: relative; }
        .flash-animation::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: 0.375rem;
            animation: flash-success-triple 1.2s ease-in-out;
            pointer-events: none;
        }

        @keyframes border-glow-green-triple {
             0%, 100% { box-shadow: inset 0 0 0 2px var(--program-color, transparent), 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); }
             15%, 45%, 75% { box-shadow: inset 0 0 10px 3px var(--glow-green), 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); }
             30%, 60%, 90% { box-shadow: inset 0 0 0 2px var(--program-color, transparent), 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); }
        }
        .card-glow-animation {
            animation: border-glow-green-triple 1.5s ease-in-out !important;
        }
        
        .newly-added {
            animation: fade-in-up 0.4s ease-out, border-glow-green-triple 1.5s ease-in-out;
        }
        @keyframes pulse-glow { 0% { box-shadow: 0 4px 10px rgba(0,0,0,0.2), 0 0 8px rgba(45, 212, 191, 0.3), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); } 50% { box-shadow: 0 4px 10px rgba(0,0,0,0.2), 0 0 18px rgba(45, 212, 191, 0.6), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); } 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.2), 0 0 8px rgba(45, 212, 191, 0.3), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); } }
        @keyframes slide-out-left { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-100%); opacity: 0; } }
        .exercise-card.deleting { animation: slide-out-left 0.4s ease-out forwards; }
        
        .program-editor-item:focus-within { background-color: var(--border-hover); }

        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-main-1), var(--bg-main-2), var(--bg-main-3), var(--bg-main-4)); background-size: 400% 400%; color: var(--text-main); -webkit-tap-highlight-color: transparent; }
        header { background-color: var(--bg-secondary); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
        .bg-card { background: linear-gradient(145deg, var(--bg-card-start), var(--bg-card-end)); border: 1px solid var(--card-border-top); box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .exercise-card {
            box-shadow: inset 0 0 0 2px var(--program-color, transparent), 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom);
        }
        .exercise-card:not(.newly-added) {
             animation: fade-in-up 0.5s ease-out forwards;
        }
        .bg-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 25px rgba(0,0,0,0.3), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom); }
        .exercise-card:hover {
            box-shadow: inset 0 0 0 2px var(--program-color, transparent), 0 12px 25px rgba(0,0,0,0.3), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom);
        }
        .has-today-perf, .has-today-perf:hover {
            box-shadow: inset 0 0 0 2px var(--glow-teal), 0 0 12px rgba(45, 212, 191, 0.4), 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 1px var(--card-border-top), inset 0 -1px 1px var(--card-border-bottom);
        }
        .input-bg, select, .filter-btn { background-color: var(--surface); border: 1px solid var(--border-color); transition: border-color 0.3s, background-color 0.3s; }
        select:focus, input:focus { border-color: var(--glow-exo-title); }
        #program-select {
            border: 2px solid var(--program-color, var(--border-color));
            box-shadow: 0 4px 12px -2px var(--program-color, transparent);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 1;
        }
        .filter-btn.active { border-color: var(--glow-exo-title); background-color: rgba(34, 211, 238, 0.2); }
        #app-title-container { display: flex; align-items: center; gap: 0.75rem; }
        #app-title { color: var(--glow-app-title); text-shadow: 0 0 10px var(--glow-app-title), 0 0 15px #fff; font-weight: 700; }
        #app-icon { color: var(--glow-violet); text-shadow: 0 0 10px var(--glow-violet), 0 0 15px #fff; }
        .exercise-title { color: var(--glow-exo-title); }
        .subtitle-color { color: var(--glow-orange); }
        .label-color { color: var(--text-secondary); }
        .exercise-number { font-weight: 700; font-size: 1.75rem; background: linear-gradient(45deg, var(--program-color, var(--glow-green)), #ffffff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 8px var(--program-color, var(--glow-green)), 0 0 12px #fff; }
        .pending-input { border: 1px solid var(--glow-red) !important; background-color: color-mix(in srgb, var(--glow-red) 15%, transparent) !important; }
        #clear-all-perf-btn, button[data-action="clear-performance"] { color: var(--glow-magenta); }
        #manage-programs-btn { color: var(--glow-yellow); }
        #global-stats-btn { color: var(--icon-stats-color); }
        #theme-toggle-btn { color: var(--icon-color); }
        button[data-action="header-backup"] { color: var(--icon-backup-color); transition: color 0.3s, text-shadow 0.3s; }
        button[data-action="header-backup"].is-dirty { color: var(--glow-orange); animation: dirty-pulse 2s ease-in-out infinite; }
        @keyframes dirty-pulse {
            0%, 100% { text-shadow: 0 0 4px var(--glow-orange); }
            50% { text-shadow: 0 0 12px var(--glow-orange), 0 0 20px var(--glow-orange); }
        }
        button[data-action="header-import"] { color: var(--icon-import-color); }
        button[data-action="header-drive-save"] { color: var(--icon-drive-save-color); transition: color 0.3s, text-shadow 0.3s; }
        button[data-action="header-drive-save"].is-dirty { color: var(--glow-orange); animation: dirty-pulse 2s ease-in-out infinite; }
        button[data-action="header-drive-load"] { color: var(--icon-drive-load-color); }
        button[data-action="delete-exercise"], button[data-action="delete-perf-entry"] { color: var(--icon-delete-color); }
        button[data-action="start-timer"] { color: var(--icon-timer-color); }
        button[data-action="view-history"] { color: var(--icon-history-color); }
        button[data-action="duplicate-exercise"] { color: var(--glow-yellow); }
        button[data-action="delete-set"] { color: var(--glow-red); background-color: rgba(15, 23, 42, 0.8); border-radius: 9999px; width: 1.5rem; height: 1.5rem; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; position: absolute; top: -0.4rem; right: -0.4rem; border: 1px solid rgba(239,68,68,0.3); }
        /* Touch targets minimum 44px */
        .icon-btn { min-width: 36px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; }
        /* Session progress bar */
        #session-progress { height: 3px; background: var(--border-color); border-radius: 2px; overflow: hidden; margin-top: 2px; }
        #session-progress-fill { height: 100%; background: linear-gradient(90deg, var(--glow-teal), var(--glow-green)); border-radius: 2px; transition: width 0.4s ease; }
        /* Progression indicators */
        .perf-delta-up { color: var(--glow-green); font-size: 10px; font-weight: 700; }
        .perf-delta-down { color: var(--glow-red); font-size: 10px; font-weight: 700; }
        .perf-delta-same { color: var(--text-secondary); font-size: 10px; }
        /* Mini timer in card */
        .mini-timer { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--glow-red); box-shadow: 0 0 0 2px var(--glow-red), 0 0 15px rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 8px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
        #remap-backup-path-btn { color: var(--glow-exo-title); }
        .footer-btn { color: white; font-weight: bold; padding: 0.75rem 1rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: none; text-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: transform 0.3s, box-shadow 0.3s, background 0.3s; }
        .footer-btn:hover { transform: scale(1.05); }
        #add-exercise-btn { background: linear-gradient(45deg, var(--btn-add-start), var(--btn-add-end)); border: none; box-shadow: 0 0 20px var(--btn-add-start); transition: transform 0.3s, box-shadow 0.3s; }
        #add-exercise-btn:hover { box-shadow: 0 0 30px var(--btn-add-end); }

            <button data-action="header-drive-save"><i class="fa-brands fa-google-drive pointer-events-none" style="color:#4285F4"></i>Sauvegarder sur Drive</button>
            <hr>
            <button data-action="header-import"><i class="fa-solid fa-upload pointer-events-none" style="color:var(--glow-violet)"></i>Importer un fichier</button>
            <button data-action="merge-import"><i class="fa-solid fa-layer-group pointer-events-none" style="color:var(--glow-teal)"></i>Fusionner des fichiers</button>
            <button data-action="header-drive-load"><i class="fa-solid fa-folder-open pointer-events-none" style="color:#34A853"></i>Charger depuis Drive</button>
            <hr>
            <button id="menu-add-exercise"><i class="fa-solid fa-plus pointer-events-none" style="color:var(--glow-green)"></i>Ajouter un exercice</button>
            <button id="global-stats-btn"><i class="fa-solid fa-chart-pie pointer-events-none" style="color:var(--glow-teal)"></i>Statistiques</button>
            <button id="manage-programs-btn"><i class="fa-solid fa-gears pointer-events-none" style="color:var(--glow-yellow)"></i>Programmes et réglages</button>
            <button id="theme-toggle-btn"><i id="theme-icon" class="fa-solid fa-sun pointer-events-none"></i><span id="theme-label">Thème clair</span></button>
            <hr>
            <button id="install-banner"><i class="fa-solid fa-mobile-screen pointer-events-none" style="color:var(--glow-violet)"></i>Installer l'application</button>
            <button id="clear-all-perf-btn" class="danger"><i class="fa-solid fa-eraser pointer-events-none"></i>Effacer la séance du jour…</button>
        </div>

        <main class="main">
            <div id="exercise-list" class="list"></div>
            <section id="detail" class="detail"></section>
        </main>

        <div id="bar" class="bar hidden"></div>
        <div id="action-sheet" class="hidden"></div>

        <div id="toast" class="fixed top-5 right-4 py-2 px-5 rounded-lg shadow-xl opacity-0 transform -translate-y-4 transition-all duration-300 z-50 flex items-center space-x-2" style="pointer-events:none;">
            <i id="toast-icon" class="fas"></i><span id="toast-text"></span>
        </div>

        <div id="program-modal" class="modal-container fixed inset-0 z-40 items-center justify-center hidden"></div>
        <div id="history-modal" class="modal-container fixed inset-0 z-40 items-center justify-center hidden"></div>
        <div id="global-stats-modal" class="modal-container fixed inset-0 z-40 items-center justify-center hidden"></div>
        <!-- Modale Drive -->
        <div id="drive-modal" class="modal-container fixed inset-0 z-40 items-center justify-center hidden"></div>
        <input type="file" id="file-input" class="hidden" accept=".json" multiple>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const app = document.getElementById('app');
        const mainContent = document.querySelector('main');
        const programSelect = document.getElementById('program-select');
        const exerciseList = document.getElementById('exercise-list');
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toast-icon');
        const toastText = document.getElementById('toast-text');
        const manageProgramsBtn = document.getElementById('manage-programs-btn');
        const globalStatsBtn = document.getElementById('global-stats-btn');
        const programModalContainer = document.getElementById('program-modal');
        const historyModalContainer = document.getElementById('history-modal');
        const globalStatsModalContainer = document.getElementById('global-stats-modal');
        const driveModalContainer = document.getElementById('drive-modal');
        const addExerciseBtn = document.getElementById('menu-add-exercise');
        const clearAllPerfBtn = document.getElementById('clear-all-perf-btn');
        const activeBackupNameDisplay = document.getElementById('active-backup-name');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIcon = document.getElementById('theme-icon');
        const fileInput = document.getElementById('file-input');

        let state = {
            currentProgram: null, programOrder: [], programs: {},
            performance: {}, activeFileName: null, isDirty: false, theme: 'dark'
        };
        let audioCtx;
        let backupDirectoryHandle = null;
        let chartInstances = {};
        let originalExerciseName = null;
        const isFileSystemAccessAPISupported = 'showDirectoryPicker' in window;
        let touchStartX = 0, touchStartY = 0;
        let touchEndX = 0, touchEndY = 0;

        // =============================================
        // GOOGLE DRIVE via MCP Gateway
        // =============================================
        // v3.1 : le serveur Drive exige une clé pour l'accès général. Cette page publique n'en a pas et n'utilise
        // que les routes RESTREINTES /api/app/fitness/* (dossier des backups et noms de fichiers imposés côté serveur).
        const DRIVE_BASE = 'https://mcp-drive-server-q3dg.onrender.com';
        let driveConfig = { folderId: '' };   // conservé pour compatibilité (le dossier est désormais fixé par le serveur)

        function loadDriveConfig() {
            const saved = localStorage.getItem('fitnessDriveConfig');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    driveConfig.folderId = parsed.folderId || '';
                } catch(e) {}
            }
        }

        function saveDriveConfig() {
            localStorage.setItem('fitnessDriveConfig', JSON.stringify(driveConfig));
        }

        async function fitnessDrive(action, args = {}) {
            const ctrl = new AbortController();
            const timeout = setTimeout(() => ctrl.abort(), 30000);
            try {
                const res = await fetch(`${DRIVE_BASE}/api/app/fitness/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(args),
                    signal: ctrl.signal
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.error) throw new Error(data.error || `Drive HTTP ${res.status}`);
                return data.result;
            } catch(e) {
                if (e.name === 'AbortError') throw new Error('Timeout Drive (30 s) — serveur en démarrage, réessaie.');
                throw e;
            } finally { clearTimeout(timeout); }
        }
        function setDriveBtnsLoading(loading) {
            document.querySelectorAll('[data-action="header-drive-save"],[data-action="header-drive-load"]').forEach(b => {
                b.disabled = loading;
                if (loading) b.style.opacity = '0.4';
                else b.style.opacity = '';
            });
        }

        async function checkDriveApi() {
            const dot = document.getElementById('drive-api-dot');
            if (!dot) return;
            try {
                // /health se réveille lentement après une veille Render : on laisse 25 s
                const r = await fetch(`${DRIVE_BASE}/health`, { method: 'GET', signal: AbortSignal.timeout(25000) });
                dot.style.background = r.ok ? '#22c55e' : '#ef4444';
                dot.title = r.ok ? 'API Drive ✓' : 'API Drive ✗';
            } catch(_) {
                dot.style.background = '#ef4444';
                dot.title = 'API Drive ✗';
            }
        }

        async function driveUpsertFile(filename, content) {
            await fitnessDrive('save', { name: filename, content });
        }

        const handleDriveSave = async () => {
            setDriveBtnsLoading(true);
            showToast('☁️ Envoi vers Drive...');
            cleanupEmptyPerformances();
            try {
                const backupState = exportState();
                const jsonContent = JSON.stringify(backupState, null, 2);
                const dateString = getLocalToday();
                const dailyFilename = `backup_fitness_${dateString}.json`;
                const lastFilename = 'fitness_last_backup.json';

                await driveUpsertFile(dailyFilename, jsonContent);
                await driveUpsertFile(lastFilename, jsonContent);

                state.isDirty = false;
                state.activeFileName = dailyFilename;
                saveState(true);
                renderHeader(`☁️ ${dailyFilename.replace('backup_fitness_','').replace('.json','')} ✓`);
                showToast(`☁️ Drive : ${dailyFilename} + last_backup ✓`);
            } catch(e) {
                console.error('Erreur Drive save:', e);
                showToast('Erreur sauvegarde Drive: ' + e.message, true);
            } finally { setDriveBtnsLoading(false); }
        };

        const confirmOverwrite = () => !state.isDirty ||
            confirm("Des modifications ne sont pas sauvegardées (séance du jour comprise).\nCharger ce fichier les remplacera définitivement.\n\nContinuer ?");

        const handleDriveLoad = async () => {
            if (!confirmOverwrite()) return;
            setDriveBtnsLoading(true);
            showToast('☁️ Récupération des fichiers...');
            try {
                const files = await fitnessDrive('list');
                renderDriveLoadModal(Array.isArray(files) ? files : []);
            } catch(e) {
                console.error('Erreur Drive list:', e);
                showToast('Erreur lecture Drive: ' + e.message, true);
            } finally { setDriveBtnsLoading(false); }
        };

        function renderDriveLoadModal(files) {
            let filesHTML = '';
            if (files.length === 0) {
                filesHTML = `<p class="text-secondary text-center py-6">Aucun fichier JSON trouvé dans ce dossier.</p>`;
            } else {
                filesHTML = files.map(f => {
                    const date = f.modified ? new Date(f.modified).toLocaleString('fr-FR') : '';
                    return `<div class="drive-file-item" data-file-name="${esc(f.name)}">
                        <i class="fa-solid fa-file-code"></i>
                        <div class="flex-grow min-w-0">
                            <p class="font-semibold truncate">${esc(f.name)}</p>
                            <p class="text-xs text-secondary">${date}</p>
                        </div>
                        <i class="fa-solid fa-download text-secondary"></i>
                    </div>`;
                }).join('');
            }

            driveModalContainer.innerHTML = `
                <div class="modal-backdrop absolute inset-0" data-action="close-drive-modal"></div>
                <div class="bg-card rounded-lg shadow-xl w-full max-w-md m-4 p-6 relative flex flex-col max-h-[80vh] border border-border-hover">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-border-color">
                        <h2 class="text-xl font-bold exercise-title">
                            <i class="fa-brands fa-google-drive mr-2"></i>Charger depuis Drive
                        </h2>
                        <button data-action="close-drive-modal" class="p-1 text-2xl icon-btn">&times;</button>
                    </div>
                    <p class="text-xs text-secondary mb-3">Sélectionnez un fichier à importer (remplace les données actuelles) :</p>
                    <div class="flex-grow overflow-y-auto space-y-2 pr-1" id="drive-file-list">
                        ${filesHTML}
                    </div>
                </div>`;
            driveModalContainer.style.display = 'flex';
            setTimeout(() => driveModalContainer.classList.add('visible'), 10);

            document.getElementById('drive-file-list')?.addEventListener('click', async (e) => {
                const item = e.target.closest('.drive-file-item');
                if (!item) return;
                const fileName = item.dataset.fileName;

                showToast(`Chargement de ${fileName}...`);
                try {
                    const content = await fitnessDrive('read', { name: fileName });
                    const importedState = JSON.parse(content);
                    if (importedState.programs && importedState.performance) {
                        state = normalizeState(importedState); padTodayEntries();
                        state.activeFileName = fileName;
                        state.isDirty = false;
                        saveState(true);
                        refreshAll();
                        renderHeader(`☁️ ${fileName.replace('backup_fitness_','').replace('.json','')}`);
                        driveModalContainer.classList.remove('visible');
                        setTimeout(() => { driveModalContainer.style.display = 'none'; }, 200);
                        showToast(`☁️ ${fileName} chargé avec succès !`);
                    } else {
                        throw new Error('Format de fichier invalide.');
                    }
                } catch(e) {
                    console.error('Erreur Drive load file:', e);
                    showToast(e.message || 'Erreur lors du chargement.', true);
                }
            });
        }

        // =============================================
        // FIN GOOGLE DRIVE
        // =============================================

        const dbRequest = indexedDB.open('FitnessTrackerDB', 1);
        dbRequest.onupgradeneeded = event => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('settings')) {
                db.createObjectStore('settings', { keyPath: 'key' });
            }
        };

        function saveDirectoryHandle(handle) {
            return new Promise((resolve, reject) => {
                const db = dbRequest.result;
                const transaction = db.transaction(['settings'], 'readwrite');
                const store = transaction.objectStore('settings');
                store.put({ key: 'backupDirectory', handle: handle });
                transaction.oncomplete = () => resolve();
                transaction.onerror = event => reject(event.target.error);
            });
        }

        function getDirectoryHandle() {
            return new Promise((resolve, reject) => {
                if (!dbRequest.result || !dbRequest.result.objectStoreNames.contains('settings')) {
                    return resolve(null);
                }
                const transaction = dbRequest.result.transaction(['settings'], 'readonly');
                const store = transaction.objectStore('settings');
                const request = store.get('backupDirectory');
                request.onsuccess = event => resolve(event.target.result ? event.target.result.handle : null);
                request.onerror = event => reject(event.target.error);
            });
        }

        // Android suspend un AudioContext créé hors geste utilisateur : on le crée/réveille au tap
        function ensureAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }
        function playSound() {
            ensureAudio();
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1);
        }

        const applyTheme = () => {
            document.documentElement.classList.toggle('dark', state.theme === 'dark');
            themeIcon.className = (state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon') + ' pointer-events-none';
            const lbl = document.getElementById('theme-label');
            if (lbl) lbl.textContent = state.theme === 'dark' ? 'Thème clair' : 'Thème sombre';
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', state.theme === 'dark' ? '#0f172a' : '#f1f5f9');
        };
        themeToggleBtn.addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveState(); });

        const showToast = (message, isError = false) => {
            toastText.textContent = message;
            toast.className = `fixed top-5 right-4 py-2 px-5 rounded-lg shadow-xl opacity-0 transform -translate-y-4 transition-all duration-300 z-50 flex items-center space-x-2 ${isError ? 'toast-error' : 'toast-success'}`;
            toastIcon.className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            toast.style.pointerEvents = 'none';
            toast.classList.remove('opacity-0', '-translate-y-4');
            setTimeout(() => toast.classList.add('opacity-0', '-translate-y-4'), 3000);
        };

        const getLocalToday = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        };
        // 'YYYY-MM-DD' interprété en date LOCALE (new Date('YYYY-MM-DD') = minuit UTC)
        const parseLocalDate = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
        const fmtDate = (s) => parseLocalDate(s).toLocaleDateString('fr-FR');
        // Échappement HTML : les noms d'exercices/programmes sont injectés dans des templates
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        // Nombre saisi au clavier FR : accepte la virgule ("52,5" → 52.5) ; NaN si non numérique (ex. "PDC")
        const parseNum = (v) => { const n = parseFloat(String(v ?? '').trim().replace(',', '.')); return Number.isFinite(n) ? n : NaN; };
        const num0 = (v) => { const n = parseNum(v); return Number.isFinite(n) ? n : 0; };
        const fmtNum = (n) => String(Math.round(n * 100) / 100).replace('.', ',');   // affichage FR
        const toStore = (n) => String(Math.round(n * 100) / 100);                     // stockage : point décimal, comme l'historique
        // Copie destinée aux fichiers de sauvegarde : uniquement les séries réellement faites, sans le marqueur interne
        // done → un fichier v3 reste lisible tel quel par les versions précédentes et par tout autre outil.
        const FORMAT_NOTE = [
            "Sauvegarde Fitness Tracker (suivi de musculation).",
            "programs[programme].exercises = exercices prévus : Exercice (nom), Groupe (muscle), Séries, Répétitions visées, Repos (secondes), Notes d'exécution, Objectif.",
            "performance[programme][exercice] = séances réalisées, triées par date : { date: AAAA-MM-JJ, sets: [ { poids, reps } ] }.",
            "poids en kg (point décimal) ou \"PDC\" = poids du corps ; reps = répétitions faites. Seules les séries réellement exécutées figurent dans sets.",
            "non_execute_volontairement: true = ce jour-là, l'exercice n'a volontairement PAS été fait (choix de la séance, ou remplacé par un autre exercice équivalent). Ce n'est ni un oubli ni une donnée manquante.",
            "Un exercice sans séance à une date donnée n'a simplement pas été enregistré ce jour-là.",
            "_resume = synthèse calculée à l'export : dernière séance de chaque programme, jours écoulés, exercices faits (poids×reps), volontairement non exécutés, non enregistrés."
        ];
        // Résumé lisible en tête de sauvegarde : où en est chaque programme (pour Claude ou un coach)
        const buildResume = (st) => {
            const today = getLocalToday();
            const fmt = (s) => `${s.poids ?? '–'}×${s.reps ?? '–'}`;
            const programmes = {};
            (st.programOrder || Object.keys(st.programs || {})).forEach(prog => {
                const perf = st.performance?.[prog] || {};
                let last = '';
                Object.values(perf).forEach(h => h.forEach(e => { if (e.date > last) last = e.date; }));
                if (!last) { programmes[prog] = { derniere_seance: null }; return; }
                const faits = {}, nonExecutes = [], nonEnregistres = [];
                (st.programs[prog]?.exercises || []).forEach(ex => {
                    const e = (perf[ex.Exercice] || []).find(x => x.date === last);
                    if (e && e.non_execute_volontairement) nonExecutes.push(ex.Exercice);
                    if (e && (e.sets || []).length) faits[ex.Exercice] = e.sets.map(fmt).join(' · ');
                    else if (!e) nonEnregistres.push(ex.Exercice);
                });
                programmes[prog] = { derniere_seance: last, jours_depuis: Math.round((parseLocalDate(today) - parseLocalDate(last)) / 86400000),
                    exercices_faits: faits, non_executes_volontairement: nonExecutes, non_enregistres: nonEnregistres };
            });
            return { genere_le: new Date().toLocaleString('fr-FR'), application: 'Fitness Tracker v3.2', programme_en_cours: st.currentProgram || null, programmes };
        };
        const exportState = () => {
            const out = JSON.parse(JSON.stringify({ _lisez_moi: FORMAT_NOTE, _resume: null, ...state, isDirty: false }));
            Object.values(out.performance || {}).forEach(prog => Object.keys(prog).forEach(name => {
                prog[name] = prog[name].map(e => ({ ...e, sets: (e.sets || []).filter(s => !(s && s.done === false)).map(s => { const c = { ...s }; delete c.done; return c; }) }))
                    .filter(e => e.non_execute_volontairement === true || e.sets.some(setHasValue));
                if (!prog[name].length) delete prog[name];
            }));
            out._resume = buildResume(out);
            return out;
        };
        // Une série compte comme réalisée sauf si elle est explicitement marquée non faite (done === false).
        // Les données antérieures à v3.0 n'ont pas de champ done : elles restent comptées.
        const setHasValue = (s) => !!s && ((s.poids ?? '').toString().trim() !== '' || (s.reps ?? '').toString().trim() !== '');
        const setIsDone = (s) => setHasValue(s) && s.done !== false;
        const doneSets = (entry) => (entry?.sets || []).filter(setIsDone);

        // Debounced saveState
        let _saveTimeout = null;
        const _saveStateImmediate = () => {
            try { localStorage.setItem('fitnessTrackerState', JSON.stringify(state)); }
            catch(e) { showToast('⚠️ Stockage local plein !', true); }
        };
        const debouncedSave = () => {
            clearTimeout(_saveTimeout);
            _saveTimeout = setTimeout(_saveStateImmediate, 300);
        };

        // Confetti animation
        let _confettiFired = false;
        function launchConfetti() {
            const colors = ['#8b5cf6','#22d3ee','#ec4899','#facc15','#22c55e'];
            for (let i = 0; i < 40; i++) {
                const el = document.createElement('div');
                el.style.cssText = `position:fixed;width:8px;height:8px;border-radius:50%;background:${colors[i%colors.length]};top:-10px;left:${Math.random()*100}vw;z-index:9999;pointer-events:none;`;
                document.body.appendChild(el);
                el.animate([
                    { transform: 'translateY(0) rotate(0)', opacity: 1 },
                    { transform: `translateY(${window.innerHeight+20}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: 1500 + Math.random()*1000, easing: 'cubic-bezier(.25,.46,.45,.94)' });
                setTimeout(() => el.remove(), 2500);
            }
        }

        // Barre de progression : séries validées / séries prévues de la séance du jour
        let _lastPct = null;
        function updateSessionProgress() {
            const fill = document.getElementById('session-progress-fill');
            if (!fill) return;
            const prog = state.currentProgram;
            const exs = state.programs[prog]?.exercises || [];
            let total = 0, done = 0;
            if (prog && sessionStarted(prog)) exs.forEach(ex => { if (isSkipped(prog, ex)) return; const s = setsOf(prog, ex); total += s.length; done += s.filter(setIsDone).length; });
            const pct = total ? Math.round(done / total * 100) : 0;
            fill.style.width = pct + '%';
            if (pct === 100 && _lastPct !== null && _lastPct < 100) launchConfetti();
            _lastPct = pct;
        }

        const cleanupEmptyPerformances = () => {
            const today = getLocalToday();
            for (const progName in state.performance) {
                for (const exoName in state.performance[progName]) {
                    const cleanedHistory = state.performance[progName][exoName].filter(entry => {
                        if (entry.date === today) { return true; }
                        // Séance passée : seules les séries EXPLICITEMENT non validées (done === false, v3.0+) sont retirées.
                        // Les données plus anciennes (sans champ done) ne sont jamais modifiées.
                        if ((entry.sets || []).some(s => s && s.done === false)) {
                            entry.sets = entry.sets.filter(s => !(s && s.done === false));
                        }
                        return entry.non_execute_volontairement === true || (entry.sets || []).some(setHasValue);
                    });
                    if (cleanedHistory.length === 0) {
                        delete state.performance[progName][exoName];
                    } else {
                        state.performance[progName][exoName] = cleanedHistory;
                    }
                }
            }
        };
        
        const cleanupOrphanedData = () => {
            console.log("Lancement du nettoyage des données orphelines...");
            const existingPrograms = new Set(Object.keys(state.programs));
            const validExercises = new Set();
            for (const progName of existingPrograms) {
                (state.programs[progName].exercises || []).forEach(exo => {
                    if (exo.Exercice) validExercises.add(`${progName}|${exo.Exercice.trim()}`);
                });
            }
            for (const progName in state.performance) {
                if (!existingPrograms.has(progName)) {
                    console.log(`Programme orphelin trouvé et supprimé : ${progName}`);
                    delete state.performance[progName];
                    continue;
                }
                for (const exoName in state.performance[progName]) {
                    if (!validExercises.has(`${progName}|${exoName.trim()}`)) {
                        console.log(`Exercice orphelin trouvé et supprimé : ${progName} > ${exoName}`);
                        delete state.performance[progName][exoName];
                    }
                }
            }
            console.log("Nettoyage terminé.");
        };
        
        let _progressTimeout = null;
        const debouncedProgress = () => {
            clearTimeout(_progressTimeout);
            _progressTimeout = setTimeout(updateSessionProgress, 300);
        };

        const saveState = (immediate = false) => {
            cleanupEmptyPerformances();
            if (immediate) _saveStateImmediate();
            else debouncedSave();
            debouncedProgress();
        };

        const markDirty = () => {
            if (!state.isDirty) { state.isDirty = true; renderHeader(); }
            saveState();
        };

        // Rend un état chargé (localStorage, Drive, fichier) sûr à afficher, sans perdre de donnée
        const normalizeState = (st) => {
            st.programs = st.programs && typeof st.programs === 'object' ? st.programs : {};
            st.performance = st.performance && typeof st.performance === 'object' ? st.performance : {};
            Object.values(st.programs).forEach(p => {
                if (!Array.isArray(p.exercises)) p.exercises = [];
                p.exercises.forEach(ex => { if (typeof ex.Exercice !== 'string') ex.Exercice = String(ex.Exercice ?? ''); });
            });
            const known = Array.isArray(st.programOrder) ? st.programOrder.filter(n => st.programs[n]) : [];
            Object.keys(st.programs).forEach(n => { if (!known.includes(n)) known.push(n); });
            st.programOrder = known;
            st.activeFileName = st.activeFileName || null;
            st.isDirty = !!st.isDirty;
            st.theme = st.theme || 'dark';
            delete st._lisez_moi; delete st._resume;   // aides de lecture des sauvegardes, régénérées à chaque export
            if (!st.currentProgram || !st.programs[st.currentProgram]) st.currentProgram = st.programOrder[0] || null;
            return st;
        };

        const loadState = () => {
            const savedState = localStorage.getItem('fitnessTrackerState');
            if (savedState) {
                try { state = JSON.parse(savedState); }
                catch (e) {
                    // On ne détruit pas la donnée illisible : copie de secours avant réinitialisation
                    console.error("localStorage corrompu, réinitialisation.", e);
                    try { localStorage.setItem('fitnessTrackerState_corrompu_' + Date.now(), savedState); } catch (_) {}
                    localStorage.removeItem('fitnessTrackerState');
                }
            }
            normalizeState(state);
        };

        const renderHeader = (overrideLabel = null) => {
            document.getElementById('dirty-dot')?.classList.toggle('hidden', !state.isDirty);
            document.getElementById('menu-dirty')?.classList.toggle('hidden', !state.isDirty);
            const file = state.activeFileName ? state.activeFileName.replace('backup_fitness_', '').replace('.json', '') : '';
            activeBackupNameDisplay.textContent = overrideLabel
                || (file ? `${file}${state.isDirty ? ' · non sauvegardé' : ' ✓'}` : (state.isDirty ? 'Non sauvegardé' : 'Aucun fichier'));
        };

        // =============================================
        // VUE SÉANCE (v3.0) — une carte en cours, barre d'action / minuteur en bas
        // =============================================
        const UI_KEY = 'fitnessUi', REST_KEY = 'fitnessRest';
        const loadJSON = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (_) { return fallback; } };
        // État d'interface (hors sauvegardes) : exercice en cours, séance démarrée, reprise après pause
        const ui = loadJSON(UI_KEY, {});
        ['active', 'started', 'reprise', 'dismissed', 'saved'].forEach(k => { if (!ui[k] || typeof ui[k] !== 'object') ui[k] = {}; });
        const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (_) {} };
        let rest = loadJSON(REST_KEY, null);   // { endAt, total, label, rang } — basé sur l'heure de fin, pas sur des tics
        const saveRest = () => { try { rest ? localStorage.setItem(REST_KEY, JSON.stringify(rest)) : localStorage.removeItem(REST_KEY); } catch (_) {} };
        let selSet = null;                     // { prog, exo, i } : série choisie à la main (sinon la 1re non validée)
        let notesOpen = false;
        const detailPane = document.getElementById('detail');
        const bar = document.getElementById('bar');
        const actionSheet = document.getElementById('action-sheet');
        const appMenu = document.getElementById('app-menu');
        const appMenuBtn = document.getElementById('app-menu-btn');
        const isWide = () => window.matchMedia('(min-width: 880px)').matches;
        const WEIGHT_STEP = 2.5, REPRISE_DAYS = 14, REPRISE_FACTOR = 0.85, REST_OVER_MS = 180000;

        const historyOf = (prog, name) => state.performance[prog]?.[name] || [];
        const todayEntryOf = (prog, name) => historyOf(prog, name).find(e => e.date === getLocalToday()) || null;
        const lastEntryOf = (prog, name) => {
            const today = getLocalToday();
            const h = historyOf(prog, name).filter(e => e.date < today && doneSets(e).length);
            return h[h.length - 1] || null;
        };
        const plannedCount = (ex, last) => {
            const n = parseInt(ex['Séries'], 10);
            if (n > 0) return Math.min(n, 12);
            return (last ? doneSets(last).length : 0) || 3;
        };
        const repriseFactor = (prog) => ui.reprise[prog] === getLocalToday() ? REPRISE_FACTOR : 1;
        // Séries proposées pour aujourd'hui : la dernière séance, au nombre de séries prévu par le programme
        const suggestSets = (prog, ex) => {
            const last = lastEntryOf(prog, ex.Exercice);
            const ls = last ? doneSets(last) : [];
            const f = repriseFactor(prog);
            return Array.from({ length: plannedCount(ex, last) }, (_, i) => {
                const src = ls[i] || ls[ls.length - 1] || {};
                let poids = String(src.poids ?? '');
                const p = parseNum(poids);
                if (f !== 1 && p > 0) poids = toStore(Math.round(p * f / WEIGHT_STEP) * WEIGHT_STEP);
                return { poids, reps: String(src.reps ?? ''), done: false };
            });
        };
        const setsOf = (prog, ex) => todayEntryOf(prog, ex.Exercice)?.sets || suggestSets(prog, ex);
        const ensureToday = (prog, ex) => {
            let entry = todayEntryOf(prog, ex.Exercice);
            if (!entry) {
                if (!state.performance[prog]) state.performance[prog] = {};
                const h = state.performance[prog][ex.Exercice] || (state.performance[prog][ex.Exercice] = []);
                entry = { date: getLocalToday(), sets: suggestSets(prog, ex) };
                h.push(entry);
                h.sort((a, b) => a.date.localeCompare(b.date));
            }
            return entry;
        };
        const padTodayEntries = () => {
            Object.entries(state.programs).forEach(([prog, p]) => (p.exercises || []).forEach(ex => {
                const e = todayEntryOf(prog, ex.Exercice);
                if (!e || e.non_execute_volontairement) return;
                const want = plannedCount(ex, lastEntryOf(prog, ex.Exercice)), sugg = suggestSets(prog, ex);
                while (e.sets.length < want) e.sets.push(sugg[e.sets.length] || { poids: '', reps: '', done: false });
            }));
        };
        const isComplete = (prog, ex) => { const e = todayEntryOf(prog, ex.Exercice); return !!e && e.sets.length > 0 && e.sets.every(setIsDone); };
        // « Pas aujourd'hui » : exercice volontairement non exécuté ce jour-là (choix, ou alternative faite à la place).
        // Enregistré dans la séance du jour → visible dans l'historique et explicite dans les sauvegardes.
        const isSkipped = (prog, ex) => !!todayEntryOf(prog, ex.Exercice)?.non_execute_volontairement;
        const isResolved = (prog, ex) => isComplete(prog, ex) || isSkipped(prog, ex);
        const setSkipped = (prog, ex, on) => {
            if (on) {
                const entry = ensureToday(prog, ex);
                entry.sets = entry.sets.filter(setIsDone);   // les séries proposées non faites n'ont pas de sens ici
                entry.non_execute_volontairement = true;
            } else {
                const entry = todayEntryOf(prog, ex.Exercice);
                if (!entry) return;
                delete entry.non_execute_volontairement;
                if (!entry.sets.some(setIsDone)) state.performance[prog][ex.Exercice] = historyOf(prog, ex.Exercice).filter(e => e !== entry);
            }
            markDirty();
        };
        const sessionStarted = (prog) => ui.started[prog] === getLocalToday()
            || (state.programs[prog]?.exercises || []).some(ex => doneSets(todayEntryOf(prog, ex.Exercice)).length > 0);
        const progExercises = () => state.programs[state.currentProgram]?.exercises || [];
        const curIndex = (prog, ex) => {
            const sets = setsOf(prog, ex);
            if (selSet && selSet.prog === prog && selSet.exo === ex.Exercice && selSet.i < sets.length) return selSet.i;
            return sets.findIndex(s => !setIsDone(s));
        };
        const activeIndex = (prog) => {
            const exs = state.programs[prog]?.exercises || [];
            if (!exs.length || !sessionStarted(prog)) return -1;
            const i = exs.findIndex(ex => ex.Exercice === ui.active[prog] && !isSkipped(prog, ex));
            if (i >= 0) return i;
            const j = exs.findIndex(ex => !isResolved(prog, ex));
            return j >= 0 ? j : 0;
        };
        const nextIncomplete = (prog, from) => {
            const exs = state.programs[prog]?.exercises || [];
            for (let k = 1; k <= exs.length; k++) { const i = (from + k) % exs.length; if (!isResolved(prog, exs[i])) return i; }
            return -1;
        };
        const fmtVal = (v) => { const t = (v ?? '').toString().trim(); const n = parseNum(t); return /^\d+([.,]\d+)?$/.test(t) && Number.isFinite(n) ? fmtNum(n) : t; };
        const fmtSet = (s) => {
            const p = fmtVal(s?.poids), r = fmtVal(s?.reps);
            if (!p && !r) return '—';
            return `${esc(p || '–')} × ${esc(r || '–')}`;
        };
        const fmtSetsLine = (sets) => sets.filter(setHasValue).map(fmtSet).join(' · ');
        const fmtDateShort = (s) => parseLocalDate(s).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
        const lastSessionDate = (prog) => {
            const today = getLocalToday(); let d = '';
            Object.values(state.performance[prog] || {}).forEach(h => h.forEach(e => { if (e.date < today && e.date > d && doneSets(e).length) d = e.date; }));
            return d;
        };
        const daysSince = (d) => Math.round((parseLocalDate(getLocalToday()) - parseLocalDate(d)) / 86400000);
        const agoTxt = (d) => { const n = daysSince(d); return n <= 0 ? "aujourd'hui" : n === 1 ? 'hier' : n < 14 ? `il y a ${n} j` : n < 60 ? `il y a ${Math.round(n / 7)} sem.` : n < 365 ? `il y a ${Math.round(n / 30)} mois` : `il y a ${Math.round(n / 365)} an${n >= 548 ? 's' : ''}`; };
        const deltaHTML = (s, prev) => {
            if (!prev || !setHasValue(prev)) return '';
            const parts = [];
            const cp = parseNum(s.poids), pp = parseNum(prev.poids);
            if (Number.isFinite(cp) && Number.isFinite(pp) && cp !== pp) parts.push(cp > pp ? `<span class="perf-delta-up">↑${fmtNum(cp - pp)}kg</span>` : `<span class="perf-delta-down">↓${fmtNum(pp - cp)}kg</span>`);
            const cr = parseNum(s.reps), pr = parseNum(prev.reps);
            if (Number.isFinite(cr) && Number.isFinite(pr) && cr !== pr) parts.push(cr > pr ? `<span class="perf-delta-up">↑${fmtNum(cr - pr)}r</span>` : `<span class="perf-delta-down">↓${fmtNum(pr - cr)}r</span>`);
            return ` <span class="delta">${parts.length ? parts.join(' ') : '<span class="perf-delta-same">=</span>'}</span>`;
        };

        const repriseBannerHTML = (prog) => {
            if (sessionStarted(prog)) return '';
            const d = lastSessionDate(prog);
            if (!d) return '';
            const n = daysSince(d);
            if (n < REPRISE_DAYS) return '';
            const when = n < 60 ? `${Math.round(n / 7)} sem.` : `${Math.round(n / 30)} mois`;
            const pct = Math.round((1 - REPRISE_FACTOR) * 100);
            if (ui.reprise[prog] === getLocalToday())
                return `<div class="resume"><p>Charges <b>−${pct} %</b> appliquées (reprise après ${when}).</p><button data-action="reprise-undo">Annuler</button></div>`;
            if (ui.dismissed[prog] === getLocalToday()) return '';
            return `<div class="resume"><p>Dernière séance il y a <b>${when}</b> — charges <b>−${pct} %</b> ?</p><button class="y" data-action="reprise-apply">Appliquer</button><button data-action="reprise-dismiss">Ignorer</button></div>`;
        };

        const collapsedCardHTML = (prog, ex, i, isActive) => {
            const sets = setsOf(prog, ex);
            const done = sets.filter(setIsDone).length;
            const complete = isComplete(prog, ex);
            const last = lastEntryOf(prog, ex.Exercice);
            const skipped = isSkipped(prog, ex);
            const summary = skipped ? 'Pas aujourd\'hui' : done ? fmtSetsLine(sets.filter(setIsDone)) : (last ? `<span class="when">${fmtDateShort(last.date)} · ${agoTxt(last.date)}</span> · ${fmtSetsLine(doneSets(last))}` : 'Première séance');
            return `<div class="card${complete ? ' done' : ''}${skipped ? ' skipped' : ''}${isActive && !skipped ? ' active' : ''}" data-index="${i}">
                <div class="c-head" data-action="activate">
                    <span class="num">${complete ? '<i class="fa-solid fa-check"></i>' : i + 1}</span>
                    <div class="c-title"><div class="c-name">${esc(ex.Exercice || 'Sans nom')}</div>
                        <div class="c-sub">${ex.Groupe ? `<b>${esc(ex.Groupe)}</b> · ` : ''}${summary}</div></div>
                    ${skipped ? '<button class="badge skip-undo" data-action="unskip" aria-label="Refaire cet exercice aujourd\'hui"><i class="fa-solid fa-rotate-left pointer-events-none"></i> passé</button>'
                              : `<span class="badge">${complete ? '<i class="fa-solid fa-check"></i> ' : ''}${done}/${sets.length}</span>`}
                    <button class="kebab" data-action="card-menu" aria-label="Actions de l'exercice"><i class="fa-solid fa-ellipsis-vertical pointer-events-none"></i></button>
                </div></div>`;
        };

        const fullCardHTML = (prog, ex, i) => {
            const sets = setsOf(prog, ex);
            const last = lastEntryOf(prog, ex.Exercice);
            const prevSets = last ? doneSets(last) : [];
            const cur = curIndex(prog, ex);
            const done = sets.filter(setIsDone).length;
            const meta = [ex.Groupe ? `<b>${esc(ex.Groupe)}</b>` : '', `${sets.length} série${sets.length > 1 ? 's' : ''}`,
                ex['Répétitions'] ? `${esc(ex['Répétitions'])} reps` : '', `repos ${parseInt(ex.Repos, 10) || 90} s`].filter(Boolean).join(' · ');
            let rows = '';
            sets.forEach((s, k) => {
                const ok = setIsDone(s);
                if (k === cur) {
                    const p = (s.poids ?? '').toString().trim(), r = (s.reps ?? '').toString().trim();
                    const numeric = !p || Number.isFinite(parseNum(p));
                    rows += `<div class="cur" data-set="${k}">
                        <div class="cur-lbl"><span>Série <b>${k + 1}</b> / ${sets.length} — ${ok ? 'correction' : 'en cours'}</span><span>${prevSets[k] ? 'dernière fois ' + fmtSet(prevSets[k]) : ''}</span></div>
                        <div class="steps">
                            <div class="step"><button data-step="poids" data-d="-1" aria-label="Moins de poids"${numeric ? '' : ' disabled'}>−</button><div class="val" data-action="type-value" data-field="poids"><strong>${esc(fmtVal(p) || '0')}</strong><small>${numeric ? 'kg ±' + fmtNum(WEIGHT_STEP) : 'poids'}</small></div><button data-step="poids" data-d="1" aria-label="Plus de poids"${numeric ? '' : ' disabled'}>+</button></div>
                            <div class="step"><button data-step="reps" data-d="-1" aria-label="Moins de répétitions">−</button><div class="val" data-action="type-value" data-field="reps"><strong>${esc(fmtVal(r) || '0')}</strong><small>reps ±1</small></div><button data-step="reps" data-d="1" aria-label="Plus de répétitions">+</button></div>
                        </div></div>`;
                } else {
                    rows += `<div class="set ${ok ? 'ok' : 'sugg'}" data-action="select-set" data-set="${k}">
                        <span class="n">${k + 1}</span><span class="v">${fmtSet(s)}${ok ? deltaHTML(s, prevSets[k]) : ''}</span>
                        <button class="chk" data-action="toggle-done" data-set="${k}" aria-label="${ok ? 'Annuler la validation' : 'Valider la série'}"><i class="${ok ? 'fa-solid fa-check' : 'fa-regular fa-circle'} pointer-events-none"></i></button></div>`;
                }
            });
            const notes = (ex["Notes d'exécution"] || '').trim(), obj = (ex['Objectif charge/reps'] || '').trim();
            const preview = (notes || obj) ? esc((notes || obj).replace(/\s+/g, ' ')) : 'Ajouter des notes…';
            const notesBody = notesOpen ? `<div class="notes-full">${notes ? `<p><b>Exécution</b>${esc(notes)}</p>` : ''}${obj ? `<p><b>Objectif</b>${esc(obj)}</p>` : ''}<button class="notes-edit" data-action="edit-exercise">Modifier l'exercice</button></div>` : '';
            return `<div class="card active" data-index="${i}">
                <div class="c-head">
                    <span class="num">${i + 1}</span>
                    <div class="c-title"><div class="c-name">${esc(ex.Exercice || 'Sans nom')}</div><div class="c-sub">${meta}</div></div>
                    <span class="badge">${done}/${sets.length}</span>
                    <button class="kebab" data-action="card-menu" aria-label="Actions de l'exercice"><i class="fa-solid fa-ellipsis-vertical pointer-events-none"></i></button>
                </div>
                <div class="c-body">
                    <div class="last">${last ? `Dernière fois (${fmtDateShort(last.date)}, ${agoTxt(last.date)}) : <b>${fmtSetsLine(prevSets)}</b>` : 'Première séance : ajuste les valeurs puis valide.'}</div>
                    <div class="sets">${rows}</div>
                    <button class="notes" data-action="toggle-notes"><i class="fa-regular fa-note-sticky pointer-events-none"></i><span>${preview}</span><i class="fa-solid fa-chevron-${notesOpen ? 'up' : 'down'} pointer-events-none"></i></button>
                    ${notesBody}
                </div></div>`;
        };

        const renderProgram = () => {
            const programName = state.currentProgram;
            let programColor = 'transparent';
            if (programName) {
                let hue = 0;
                for (let i = 0; i < programName.length; i++) hue = (hue + programName.charCodeAt(i) * 37) % 360;
                programColor = `hsl(${hue}, 85%, 65%)`;
            }
            document.documentElement.style.setProperty('--program-color', programColor);
            if (selSet && selSet.prog !== programName) selSet = null;
            const exs = programName ? state.programs[programName]?.exercises || [] : [];
            detailPane.innerHTML = '';
            if (!exs.length) {
                exerciseList.innerHTML = `<div class="text-center text-secondary mt-8 p-8 bg-card rounded-lg shadow-lg"><i class="fa-solid fa-rocket text-4xl text-cyan-400 mb-4"></i><h3 class="font-bold text-xl mb-2">Bienvenue !</h3><p>${programName ? 'Ce programme est vide.' : 'Aucun programme sélectionné.'}</p><p class="mt-2">Créez un programme ou ajoutez des exercices.</p><button id="create-first-program" class="mt-4 bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg">${programName ? 'Ajouter un exercice' : 'Gérer les programmes'}</button></div>`;
                document.getElementById('create-first-program')?.addEventListener('click', () => programName ? openExerciseEditor(-1) : manageProgramsBtn.click());
                renderBar(); updateSessionProgress();
                return;
            }
            const act = activeIndex(programName);
            const wide = isWide();
            let html = repriseBannerHTML(programName);
            exs.forEach((ex, i) => { html += (i === act && !wide && !isSkipped(programName, ex)) ? fullCardHTML(programName, ex, i) : collapsedCardHTML(programName, ex, i, i === act); });
            exerciseList.innerHTML = html;
            if (wide) detailPane.innerHTML = act >= 0 ? fullCardHTML(programName, exs[act], act)
                : `<div class="detail-empty"><i class="fa-solid fa-dumbbell text-2xl mb-2"></i><p>Démarre la séance ou touche un exercice.</p></div>`;
            renderBar(); updateSessionProgress();
        };

        const scrollToActive = () => {
            if (isWide()) return;
            const card = exerciseList.querySelector('.card.active');
            if (!card) return;
            const hh = document.querySelector('.hdr')?.offsetHeight || 60;
            window.scrollTo({ top: Math.max(0, card.getBoundingClientRect().top + window.scrollY - hh - 8), behavior: 'smooth' });
        };
        const activate = (i, { scroll = true } = {}) => {
            const prog = state.currentProgram, exs = progExercises();
            if (!exs[i]) return;
            if (isSkipped(prog, exs[i])) setSkipped(prog, exs[i], false);
            ui.active[prog] = exs[i].Exercice; ui.started[prog] = getLocalToday(); saveUi();
            selSet = null; notesOpen = false;
            renderProgram();
            if (scroll) requestAnimationFrame(scrollToActive);
        };

        // ---------- barre du bas : action principale ou minuteur de repos
        const nextAction = (prog) => {
            const exs = state.programs[prog].exercises;
            if (!sessionStarted(prog)) return { action: 'session-start', label: '<i class="fa-solid fa-play"></i>&nbsp; Démarrer la séance' };
            if (exs.every(ex => isResolved(prog, ex))) {
                const saved = ui.saved[prog] === getLocalToday() && !state.isDirty;
                return { action: 'header-drive-save', alt: true, short: saved ? '✓ Sauvegardée' : 'Sauvegarder',
                    label: saved ? '<i class="fa-solid fa-circle-check"></i>&nbsp; Séance terminée · sauvegardée' : '<i class="fa-brands fa-google-drive"></i>&nbsp; Séance terminée · Sauvegarder' };
            }
            const a = activeIndex(prog), ex = exs[a], k = curIndex(prog, ex);
            if (k < 0) return { action: 'next-exercise', label: 'Exercice suivant&nbsp; <i class="fa-solid fa-arrow-right"></i>', short: 'Suivant →' };
            const s = setsOf(prog, ex)[k];
            const verb = setIsDone(s) ? `Corriger série ${k + 1}` : `Série ${k + 1} faite`;
            return { action: 'validate-set', label: `<i class="fa-solid fa-check"></i>&nbsp; ${verb} · ${fmtSet(s)}`, short: `✓ Série ${k + 1} faite`, sub: `série ${k + 1} : ${fmtSet(s)}` };
        };

        let restTick = null;
        const fmtClock = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
        const runRestLoop = () => { clearInterval(restTick); restTick = rest ? setInterval(tickRest, 250) : null; };
        const startRest = (seconds, label) => {
            rest = { endAt: Date.now() + seconds * 1000, total: seconds, label, rang: false };
            saveRest(); renderBar(); runRestLoop();
        };
        const tickRest = () => {
            if (!rest) { clearInterval(restTick); return; }
            const now = Date.now(), left = rest.endAt - now;
            if (left > 0) {
                if (!bar.classList.contains('rest')) { renderBar(); return; }
                const t = document.getElementById('rest-time'); if (t) t.textContent = fmtClock(Math.ceil(left / 1000));
                const ring = document.getElementById('rest-ring'); if (ring) ring.style.width = `${Math.max(0, Math.min(100, left / (rest.total * 1000) * 100))}%`;
                return;
            }
            if (!rest.rang) {
                rest.rang = true; saveRest();
                // Écran visible (Wake Lock) : bip + vibration ; sinon l'état « repos fini » attend au retour
                if (document.visibilityState === 'visible') { playSound(); try { navigator.vibrate?.([200, 100, 200]); } catch (_) {} }
                else notifyRestOver();
                renderBar(); return;
            }
            if (now - rest.endAt >= REST_OVER_MS) { rest = null; saveRest(); clearInterval(restTick); renderBar(); return; }
            if (!bar.classList.contains('over')) { renderBar(); return; }
            const t = document.getElementById('rest-time'); if (t) t.textContent = '+' + fmtClock(Math.floor((now - rest.endAt) / 1000));
        };

        // Fin de repos hors écran : notification système (son + vibration du téléphone), permission demandée au 1er « Démarrer »
        const askNotifyPermission = () => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (_) {} };
        const notifyRestOver = async () => {
            try {
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const reg = await navigator.serviceWorker?.getRegistration();
                const opts = { body: rest?.label?.replace(/^Repos · /, '') || 'Série suivante', tag: 'fitness-rest', renotify: true, vibrate: [300, 120, 300], requireInteraction: false };
                if (reg) await reg.showNotification('⏱️ Repos terminé', opts); else new Notification('⏱️ Repos terminé', opts);
            } catch (_) {}
        };

        const renderBar = () => {
            const prog = state.currentProgram;
            const exs = prog ? state.programs[prog]?.exercises || [] : [];
            bar.className = 'bar';
            if (!exs.length) { bar.classList.add('hidden'); bar.innerHTML = ''; updateWakeLock(); return; }
            const now = Date.now();
            if (rest && now < rest.endAt) {
                bar.classList.add('rest');
                bar.innerHTML = `<span class="ring" id="rest-ring"></span><div class="t"><strong id="rest-time">${fmtClock(Math.ceil((rest.endAt - now) / 1000))}</strong><small>${esc(rest.label)}</small></div>
                    <button class="tb" data-action="rest-add" data-d="-15">−15</button><button class="tb" data-action="rest-add" data-d="15">+15</button>
                    <button class="tb stop" data-action="rest-stop" aria-label="Arrêter le repos"><i class="fa-solid fa-stop pointer-events-none"></i></button>`;
                tickRest(); updateWakeLock(); return;
            }
            const next = nextAction(prog);
            if (rest && now - rest.endAt < REST_OVER_MS) {
                bar.classList.add('over');
                bar.innerHTML = `<div class="t" data-action="rest-stop"><strong id="rest-time">+0:00</strong><small>Repos fini${next.sub ? ' — ' + next.sub : ''}</small></div>
                    <button class="primary half${next.alt ? ' alt' : ''}" data-action="${next.action}">${next.short || next.label}</button>`;
                tickRest(); updateWakeLock(); return;
            }
            bar.innerHTML = `<button class="primary${next.alt ? ' alt' : ''}" data-action="${next.action}">${next.label}</button>`;
            updateWakeLock();
        };

        // ---------- écran allumé pendant la séance (une PWA ne peut pas sonner fiablement écran verrouillé)
        let wakeLock = null;
        const updateWakeLock = async () => {
            const prog = state.currentProgram;
            const exs = progExercises();
            const want = document.visibilityState === 'visible' && !!prog && exs.length > 0 && sessionStarted(prog) && !exs.every(ex => isResolved(prog, ex));
            try {
                if (want && !wakeLock && 'wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
            } catch (_) { wakeLock = null; }
        };

        // ---------- validation d'une série
        const validateSet = (k = null) => {
            const prog = state.currentProgram, exs = progExercises();
            const a = activeIndex(prog);
            if (a < 0) return;
            const ex = exs[a];
            const entry = ensureToday(prog, ex);
            const i = k ?? curIndex(prog, ex);
            if (i < 0 || !entry.sets[i]) return;
            const s = entry.sets[i];
            if (!setHasValue(s)) { showToast('Indique un poids ou des répétitions.', true); return; }
            if ((s.reps ?? '').toString().trim() !== '' && parseNum(s.reps) === 0) { showToast('0 répétition : ajuste avant de valider.', true); return; }
            const wasDone = setIsDone(s);
            s.done = true; selSet = null; ensureAudio();
            ui.started[prog] = getLocalToday(); ui.active[prog] = ex.Exercice; saveUi();
            markDirty();
            if (wasDone) { renderProgram(); return; } // simple correction : pas de nouveau repos
            const exDone = isComplete(prog, ex);
            const allDone = exs.every(e => isResolved(prog, e));
            if (!allDone) {
                let label;
