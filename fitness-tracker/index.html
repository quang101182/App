                if (exDone) { const n = nextIncomplete(prog, a); label = n >= 0 ? `Repos · ensuite ${exs[n].Exercice}` : 'Repos'; }
                else { const ci = curIndex(prog, ex); label = `Repos · ensuite série ${ci + 1} : ${(setsOf(prog, ex)[ci]?.poids || '–')} × ${(setsOf(prog, ex)[ci]?.reps || '–')}`; }
                startRest(parseInt(ex.Repos, 10) || 90, label);
            } else { rest = null; saveRest(); }
            renderProgram();
            if (exDone) {
                showToast(allDone ? '🏁 Séance terminée, bravo !' : `✓ ${ex.Exercice} terminé`);
                if (!allDone) setTimeout(() => {
                    const n = nextIncomplete(prog, a);
                    if (n >= 0 && state.currentProgram === prog) activate(n);
                }, 600);
                else onSessionComplete(prog);
            }
        };
        const onSessionComplete = (prog) => {
            // Sauvegarde Drive automatique en fin de séance (plus besoin d'y penser)
            handleDriveSave().then(() => {
                if (!state.isDirty) { ui.saved[prog] = getLocalToday(); saveUi(); }
                renderBar();
            });
        };

        // ---------- steppers −/+ (appui long = répétition)
        const applyStep = (btn) => {
            const prog = state.currentProgram, exs = progExercises(), a = activeIndex(prog);
            if (a < 0) return false;
            const ex = exs[a], entry = ensureToday(prog, ex), k = curIndex(prog, ex);
            if (k < 0 || !entry.sets[k]) return false;
            const s = entry.sets[k], field = btn.dataset.step, d = Number(btn.dataset.d);
            const raw = (s[field] ?? '').toString().trim();
            let v = raw === '' ? 0 : parseNum(raw);
            if (!Number.isFinite(v)) { showToast('Poids du corps : touche la valeur pour la saisir.', true); return false; }
            v = Math.max(0, v + d * (field === 'poids' ? WEIGHT_STEP : 1));
            s[field] = toStore(v);
            const strong = btn.parentElement.querySelector('strong');
            if (strong) strong.textContent = fmtVal(s[field]);
            markDirty(); renderBar();
            return true;
        };
        let stepHold = null;
        const stopStep = () => { if (stepHold) { clearTimeout(stepHold.t); clearInterval(stepHold.iv); stepHold = null; } };
        const onPointerDown = (e) => {
            const stepBtn = e.target.closest('[data-step]');
            if (stepBtn && stepBtn.disabled) { e.preventDefault(); return; }
            if (stepBtn) {
                e.preventDefault();
                stopStep();
                if (applyStep(stepBtn) === false) return;
                stepHold = { t: setTimeout(() => { if (stepHold) stepHold.iv = setInterval(() => { if (applyStep(stepBtn) === false) stopStep(); }, 150); }, 450) };
                return;
            }
            // appui long sur une série → menu (PDC, saisie clavier, suppression)
            const row = e.target.closest('.set, .cur');
            if (!row || e.target.closest('.chk, .val')) return;
            const k = Number(row.dataset.set), x0 = e.clientX, y0 = e.clientY;
            const cancel = () => { clearTimeout(timer); document.removeEventListener('pointerup', cancel); document.removeEventListener('pointercancel', cancel); document.removeEventListener('pointermove', move); };
            const move = (ev) => { if (Math.abs(ev.clientX - x0) > 10 || Math.abs(ev.clientY - y0) > 10) cancel(); };
            const timer = setTimeout(() => { cancel(); if (!actionSheet.classList.contains('hidden')) return; longPressHeld = true; try { navigator.vibrate?.(15); } catch (_) {} openSetMenu(k); }, 550);
            document.addEventListener('pointerup', cancel); document.addEventListener('pointercancel', cancel); document.addEventListener('pointermove', move);
        };
        // Après un appui long, le relâché ne doit pas « cliquer » dans le menu qui vient de s'ouvrir.
        // Android n'émet pas toujours ce clic : on n'ouvre qu'une courte fenêtre au relâché (sinon le tap suivant serait mangé).
        let longPressHeld = false, suppressClickUntil = 0;
        document.addEventListener('pointerup', () => { if (longPressHeld) { longPressHeld = false; suppressClickUntil = Date.now() + 350; } }, true);
        document.addEventListener('click', (e) => { if (Date.now() < suppressClickUntil) { suppressClickUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
        [exerciseList, detailPane].forEach(el => {
            el.addEventListener('pointerdown', onPointerDown);
            // Chrome Android reconnaît lui-même l'appui long (contextmenu) et annule le pointeur : on s'y branche
            el.addEventListener('contextmenu', (e) => {
                const row = e.target.closest('.set, .cur');
                if (!row) return;
                e.preventDefault();
                if (e.target.closest('.chk, .val, [data-step]') || !actionSheet.classList.contains('hidden')) return;
                longPressHeld = true;
                openSetMenu(Number(row.dataset.set));
            });
        });
        ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, stopStep));

        // ---------- saisie au clavier d'une valeur (tap sur le chiffre)
        const startTyping = (valEl, field) => {
            const prog = state.currentProgram, exs = progExercises(), a = activeIndex(prog);
            if (a < 0) return;
            const ex = exs[a], entry = ensureToday(prog, ex), k = curIndex(prog, ex);
            const s = entry.sets[k];
            if (!s) return;
            valEl.innerHTML = `<input class="val-input" inputmode="decimal" enterkeyhint="done" value="${esc(s[field] ?? '')}" aria-label="${field === 'poids' ? 'Poids' : 'Répétitions'}">`;
            const inp = valEl.querySelector('input');
            inp.focus(); inp.select();
            let committed = false;
            const commit = () => {
                if (committed) return; committed = true;
                const raw = inp.value.trim();
                const n = parseNum(raw);
                if (raw === '') s[field] = '';
                else if (field === 'poids' && /^pdc$/i.test(raw)) s[field] = 'PDC';
                else if (field === 'poids' && /^\d+([.,]\d+)?$/.test(raw)) s[field] = toStore(n);
                else if (field === 'reps' && /^\d+$/.test(raw)) s[field] = toStore(n);
                else showToast(field === 'poids' ? 'Poids invalide : un nombre (ex. 52,5) ou PDC.' : 'Répétitions : un nombre entier.', true);
                markDirty(); renderProgram();
            };
            inp.addEventListener('blur', commit);
            inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); } if (ev.key === 'Escape') { committed = true; renderProgram(); } });
        };

        // ---------- feuilles d'actions (menus en bas d'écran, au pouce)
        const closeSheet = () => { actionSheet.classList.add('hidden'); actionSheet.innerHTML = ''; };
        const openSheet = (title, items) => {
            actionSheet.innerHTML = `<div class="modal-backdrop" data-sheet-close></div><div class="bsheet" role="menu"><div class="bsheet-title">${esc(title)}</div>${
                items.map((it, n) => it === '-' ? '<hr>' : `<button data-sheet-item="${n}" class="${it.danger ? 'danger' : ''}"><i class="${it.icon} pointer-events-none"></i>${esc(it.label)}</button>`).join('')
            }<button data-sheet-close class="bsheet-cancel">Annuler</button></div>`;
            actionSheet.classList.remove('hidden');
            actionSheet.onclick = (e) => {
                const b = e.target.closest('[data-sheet-item], [data-sheet-close]');
                if (!b) return;
                closeSheet();
                if (b.dataset.sheetItem !== undefined) items[Number(b.dataset.sheetItem)].run();
            };
        };
        const openSetMenu = (k) => {
            const prog = state.currentProgram, exs = progExercises(), a = activeIndex(prog);
            if (a < 0) return;
            const ex = exs[a];
            const items = [
                { label: 'Poids du corps (PDC)', icon: 'fa-solid fa-person', run: () => { const e = ensureToday(prog, ex); if (e.sets[k]) { e.sets[k].poids = 'PDC'; markDirty(); renderProgram(); } } },
                { label: 'Saisir au clavier', icon: 'fa-solid fa-keyboard', run: () => { selSet = { prog, exo: ex.Exercice, i: k }; renderProgram(); const v = document.querySelector('.card.active .cur .val[data-field="poids"]'); if (v) startTyping(v, 'poids'); } },
                '-',
                { label: 'Supprimer cette série', icon: 'fa-solid fa-trash-can', danger: true, run: () => {
                    const e = ensureToday(prog, ex);
                    if (e.sets.length <= 1) { showToast('Impossible de supprimer la dernière série.', true); return; }
                    if (setIsDone(e.sets[k]) && !confirm(`Supprimer la série ${k + 1} déjà validée ?`)) return;
                    e.sets.splice(k, 1); selSet = null; markDirty(); renderProgram();
                } },
            ];
            openSheet(`${ex.Exercice} — série ${k + 1}`, items);
        };
        const openCardMenu = (i) => {
            const prog = state.currentProgram, exs = progExercises(), ex = exs[i];
            if (!ex) return;
            const entry = todayEntryOf(prog, ex.Exercice);
            const skipped = isSkipped(prog, ex);
            const items = [
                skipped
                    ? { label: "Le faire finalement aujourd'hui", icon: 'fa-solid fa-rotate-left', run: () => { setSkipped(prog, ex, false); activate(i); } }
                    : { label: "Pas aujourd'hui (non fait / remplacé)", icon: 'fa-solid fa-forward', run: () => {
                        if (entry && entry.sets.some(setIsDone) && !confirm('Des séries sont déjà validées pour cet exercice aujourd\'hui. Le passer quand même ? (elles restent enregistrées)')) return;
                        setSkipped(prog, ex, true);
                        ui.started[prog] = getLocalToday();
                        if (ui.active[prog] === ex.Exercice) { const n = nextIncomplete(prog, i); if (n >= 0) ui.active[prog] = exs[n].Exercice; else delete ui.active[prog]; }
                        saveUi(); selSet = null; renderProgram(); requestAnimationFrame(scrollToActive);
                        showToast(`« ${ex.Exercice} » passé pour aujourd'hui.`);
                    } },
                '-',
                { label: 'Historique', icon: 'fa-solid fa-chart-line', run: () => { renderHistoryModal(ex.Exercice); historyModalContainer.style.display = 'flex'; setTimeout(() => historyModalContainer.classList.add('visible'), 10); } },
                { label: "Modifier l'exercice", icon: 'fa-solid fa-pen', run: () => openExerciseEditor(i) },
                { label: 'Ajouter une série', icon: 'fa-solid fa-plus', run: () => { const e = ensureToday(prog, ex); const l = e.sets[e.sets.length - 1] || {}; e.sets.push({ poids: l.poids || '', reps: l.reps || '', done: false }); ui.active[prog] = ex.Exercice; ui.started[prog] = getLocalToday(); saveUi(); markDirty(); renderProgram(); } },
                { label: 'Reprendre les valeurs de la dernière séance', icon: 'fa-solid fa-clock-rotate-left', run: () => {
                    if (entry && entry.sets.some(setIsDone) && !confirm('Des séries sont déjà validées aujourd\'hui : les remplacer par les valeurs de la dernière séance ?')) return;
                    if (entry) entry.sets = suggestSets(prog, ex); else ensureToday(prog, ex);
                    selSet = null; markDirty(); renderProgram();
                } },
                '-',
                { label: 'Monter', icon: 'fa-solid fa-arrow-up', run: () => { if (i > 0) { [exs[i - 1], exs[i]] = [exs[i], exs[i - 1]]; markDirty(); renderProgram(); } } },
                { label: 'Descendre', icon: 'fa-solid fa-arrow-down', run: () => { if (i < exs.length - 1) { [exs[i + 1], exs[i]] = [exs[i], exs[i + 1]]; markDirty(); renderProgram(); } } },
                { label: 'Dupliquer', icon: 'fa-solid fa-copy', run: () => {
                    let name = `${ex.Exercice} (copie)`, n = 2;
                    while (exs.some(e => e.Exercice === name)) name = `${ex.Exercice} (copie ${n++})`;
                    const copy = JSON.parse(JSON.stringify(ex)); copy.Exercice = name; delete copy.isCollapsed;
                    exs.splice(i + 1, 0, copy); markDirty(); renderProgram(); showToast('Exercice dupliqué.');
                } },
                '-',
                { label: 'Effacer la réalisation du jour', icon: 'fa-solid fa-eraser', danger: true, run: () => {
                    if (!entry) { showToast("Rien d'enregistré aujourd'hui pour cet exercice."); return; }
                    if (!confirm(`Effacer la séance d'aujourd'hui pour « ${ex.Exercice} » ?`)) return;
                    state.performance[prog][ex.Exercice] = historyOf(prog, ex.Exercice).filter(e => e !== entry);
                    selSet = null; markDirty(); renderProgram();
                } },
                { label: "Supprimer l'exercice", icon: 'fa-solid fa-trash-can', danger: true, run: () => {
                    if (!confirm(`Supprimer « ${ex.Exercice} » et tout son historique ?`)) return;
                    exs.splice(i, 1);
                    if (state.performance[prog]) delete state.performance[prog][ex.Exercice];
                    if (ui.active[prog] === ex.Exercice) { delete ui.active[prog]; saveUi(); }
                    markDirty(); renderProgram(); showToast('Exercice supprimé.');
                } },
            ];
            openSheet(ex.Exercice || 'Exercice', items);
        };

        // ---------- édition d'un exercice (nom, séries, reps, repos, notes) — i = -1 : nouvel exercice
        const openExerciseEditor = (i) => {
            const prog = state.currentProgram, exs = progExercises();
            const isNew = i < 0;
            const ex = isNew ? { Groupe: '', Exercice: '', 'Séries': '3', 'Répétitions': '10', Repos: '90', "Notes d'exécution": '', 'Objectif charge/reps': '' } : exs[i];
            if (!ex) return;
            actionSheet.innerHTML = `<div class="modal-backdrop" data-sheet-close></div>
                <form class="bsheet" id="exercise-form" autocomplete="off">
                    <div class="bsheet-title">${isNew ? 'Nouvel exercice' : "Modifier l'exercice"}</div>
                    <label for="ef-name">Nom</label><input id="ef-name" value="${esc(ex.Exercice)}" maxlength="80" enterkeyhint="next">
                    <label for="ef-group">Groupe musculaire</label><input id="ef-group" value="${esc(ex.Groupe)}" maxlength="40" enterkeyhint="next">
                    <div class="row3">
                        <div><label for="ef-sets">Séries</label><input id="ef-sets" inputmode="numeric" value="${esc(ex['Séries'])}"></div>
                        <div><label for="ef-reps">Reps visées</label><input id="ef-reps" value="${esc(ex['Répétitions'])}"></div>
                        <div><label for="ef-rest">Repos (s)</label><input id="ef-rest" inputmode="numeric" value="${esc(ex.Repos)}"></div>
                    </div>
                    <label for="ef-notes">Notes d'exécution</label><textarea id="ef-notes">${esc(ex["Notes d'exécution"])}</textarea>
                    <label for="ef-obj">Objectif</label><textarea id="ef-obj">${esc(ex['Objectif charge/reps'])}</textarea>
                    <div class="actions"><button type="button" data-sheet-close>Annuler</button><button type="submit" class="save">Enregistrer</button></div>
                </form>`;
            actionSheet.classList.remove('hidden');
            actionSheet.onclick = (e) => { if (e.target.closest('[data-sheet-close]')) closeSheet(); };
            const form = document.getElementById('exercise-form');
            if (isNew) setTimeout(() => form.querySelector('#ef-name').focus(), 50);
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = form.querySelector('#ef-name').value.replace(/\s+/g, ' ').trim();
                if (!name) { showToast("Donne un nom à l'exercice.", true); return; }
                if (exs.some((o, idx) => idx !== i && o.Exercice.trim() === name)) { showToast('Ce nom est déjà utilisé dans ce programme.', true); return; }
                const oldName = ex.Exercice;
                const seriesN = parseInt(form.querySelector('#ef-sets').value, 10);
                const repos = parseInt(form.querySelector('#ef-rest').value, 10);
                Object.assign(ex, {
                    Exercice: name,
                    Groupe: form.querySelector('#ef-group').value.trim(),
                    'Séries': seriesN > 0 ? String(Math.min(seriesN, 12)) : '',
                    'Répétitions': form.querySelector('#ef-reps').value.trim(),
                    Repos: repos > 0 ? String(repos) : '90',
                    "Notes d'exécution": form.querySelector('#ef-notes').value.trim(),
                    'Objectif charge/reps': form.querySelector('#ef-obj').value.trim(),
                });
                if (isNew) exs.push(ex);
                else if (oldName !== name) {
                    // l'historique suit le nouveau nom
                    const perf = state.performance[prog];
                    if (perf && perf[oldName]) { perf[name] = perf[oldName]; delete perf[oldName]; }
                    if (ui.active[prog] === oldName) { ui.active[prog] = name; saveUi(); }
                }
                // séance du jour : on aligne le nombre de séries sur le programme sans toucher aux séries validées
                const entry = todayEntryOf(prog, name);
                if (entry && seriesN > 0) {
                    const target = Math.min(seriesN, 12), sugg = suggestSets(prog, ex);
                    while (entry.sets.length < target) entry.sets.push(sugg[entry.sets.length] || { poids: '', reps: '', done: false });
                    for (let k = entry.sets.length - 1; k >= 0 && entry.sets.length > target; k--) if (!setIsDone(entry.sets[k])) entry.sets.splice(k, 1);
                    if (entry.sets.length > target) showToast(`${entry.sets.length} séries déjà validées aujourd'hui : elles sont conservées.`, true);
                }
                if (seriesN > 12) showToast('12 séries maximum.', true);
                closeSheet(); markDirty(); renderProgram();
                showToast(isNew ? 'Exercice ajouté.' : 'Exercice modifié.');
            });
        };

        // ---------- menu ⋯ de l'application
        const closeAppMenu = () => { appMenu.classList.add('hidden'); appMenuBtn.setAttribute('aria-expanded', 'false'); };
        appMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = appMenu.classList.toggle('hidden') === false;
            appMenuBtn.setAttribute('aria-expanded', String(open));
        });
        document.addEventListener('click', (e) => { if (!appMenu.classList.contains('hidden') && !e.target.closest('#app-menu, #app-menu-btn')) closeAppMenu(); });
        appMenu.addEventListener('click', (e) => { if (e.target.closest('button')) closeAppMenu(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAppMenu(); closeSheet(); } });

        const populateSelector = () => {
            // Keep hidden select in sync for compatibility
            programSelect.innerHTML = '';
            const pillsContainer = document.getElementById('program-pills');
            if (pillsContainer) pillsContainer.innerHTML = '';
            if (state.programOrder.length === 0) {
                const option = document.createElement('option');
                option.textContent = "Aucun programme"; programSelect.appendChild(option); programSelect.disabled = true;
                if (pillsContainer) pillsContainer.innerHTML = '<span class="text-sm text-secondary py-2">Aucun programme</span>';
            } else {
                programSelect.disabled = false;
                state.programOrder.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name; option.textContent = name;
                    programSelect.appendChild(option);
                    // Create pill button
                    if (pillsContainer) {
                        const pill = document.createElement('button');
                        pill.className = 'program-pill' + (state.currentProgram === name ? ' active' : '');
                        pill.textContent = name;
                        pill.dataset.program = name;
                        pill.addEventListener('click', () => {
                            if (state.currentProgram === name) return;
                            // Slide transition
                            exerciseList.classList.add('slide-out-left');
                            setTimeout(() => {
                                state.currentProgram = name;
                                programSelect.value = name;
                                saveState();
                                renderProgram();
                                // Update active pill
                                pillsContainer.querySelectorAll('.program-pill').forEach(p => p.classList.toggle('active', p.dataset.program === name));
                                pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                                exerciseList.classList.remove('slide-out-left');
                                exerciseList.classList.add('slide-in-right');
                                setTimeout(() => exerciseList.classList.remove('slide-in-right'), 250);
                            }, 200);
                        });
                        pillsContainer.appendChild(pill);
                    }
                });
                if (state.currentProgram) {
                    programSelect.value = state.currentProgram;
                    // Scroll active pill into view
                    if (pillsContainer) {
                        const activePill = pillsContainer.querySelector('.program-pill.active');
                        if (activePill) setTimeout(() => activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 100);
                    }
                }
            }
        };

        const renderProgramEditor = () => {
            const cfg = driveConfig;
            let editorHTML = `<div class="modal-backdrop absolute inset-0" data-action="close-modal"></div>
            <div class="bg-card rounded-lg shadow-xl w-full max-w-md m-4 p-6 relative flex flex-col max-h-[90vh] border border-border-hover">
                <div class="flex justify-between items-center mb-4 pb-4 border-b border-border-color flex-shrink-0"><h2 class="text-xl font-bold exercise-title">Gérer les Programmes</h2><button data-action="close-modal" class="p-1 rounded-full text-2xl icon-btn">&times;</button></div>

                <div class="flex-grow overflow-y-auto pr-1 space-y-4">

                    <div>
                        <h3 class="font-semibold mb-2 text-secondary">Ajouter un programme</h3>
                        <div class="flex gap-2">
                            <input type="text" id="new-program-name" placeholder="Nom du nouveau programme" class="flex-grow input-bg border-border-color rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <button id="add-program-btn" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-md">Ajouter</button>
                        </div>

        async function promptAndSetDirectory() {
            try {
                const handle = await window.showDirectoryPicker();
                await saveDirectoryHandle(handle);
                backupDirectoryHandle = handle;
                showToast("Dossier de sauvegarde sélectionné !");
                return handle;
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Erreur lors de la sélection du dossier:", err);
                    showToast("Impossible de sélectionner ce dossier.", true);
                }
                return null;
            }
        }

        async function verifyPermission(handle) {
            if (!handle) return false;
            const options = { mode: 'readwrite' };
            if (await handle.queryPermission(options) === 'granted') return true;
            if (await handle.requestPermission(options) === 'granted') return true;
            showToast("La permission d'accès au dossier a été refusée.", true);
            return false;
        }

        const handleBackup = async () => {
            cleanupEmptyPerformances();
            const dateString = getLocalToday();
            const filename = `backup_fitness_${dateString}.json`;
            const backupState = exportState();
            const jsonContent = JSON.stringify(backupState, null, 2);

            if (isFileSystemAccessAPISupported) {
                try {
                    let handle = backupDirectoryHandle;
                    if (!handle) handle = await promptAndSetDirectory();
                    if (!handle) { throw new Error('no-handle'); }
                    if (!(await verifyPermission(handle))) { throw new Error('no-permission'); }
                    backupDirectoryHandle = handle;

                    const fileHandle = await handle.getFileHandle(filename, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(jsonContent);
                    await writable.close();

                    state.isDirty = false;
                    state.activeFileName = filename;
                    saveState();
                    renderHeader();
                    showToast(`💾 Backup local : ${filename}`);
                    return;
                } catch (err) {
                    if (err.message === 'no-handle' || err.message === 'no-permission') return;
                    console.warn('File System API indisponible, fallback téléchargement :', err);
                }
            }

            const a = document.createElement('a');
            const blob = new Blob([jsonContent], { type: 'application/json' });
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            state.isDirty = false;
            state.activeFileName = filename;
            saveState();
            renderHeader();
            showToast(`💾 Téléchargement : ${filename}`);
        };

        const handleImport = async (isMerge = false) => {
            if (!isMerge && !confirmOverwrite()) return;
            if (isFileSystemAccessAPISupported) {
                try {
                    const pickerOpts = {
                        types: [{ description: 'Fichiers JSON', accept: { 'application/json': ['.json'] } }],
                        multiple: isMerge,
                        startIn: backupDirectoryHandle || 'downloads'
                    };
                    const fileHandles = await window.showOpenFilePicker(pickerOpts);
                    await processFiles(fileHandles, isMerge, true);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.warn('showOpenFilePicker indisponible, fallback input[file] :', err);
                }
            }
            fileInput.multiple = isMerge;
            fileInput.dataset.isMerge = isMerge;
            fileInput.click();
        };

        async function processFiles(files, isMerge, areHandles = false) {
           try {
                if (isMerge) {
                    let mergedCount = 0;
                    for (const fileOrHandle of files) {
                        const file = areHandles ? await fileOrHandle.getFile() : fileOrHandle;
                        const content = await file.text();
                        const importedState = JSON.parse(content);
                        if (importedState.programs) {
                            Object.keys(importedState.programs).forEach(progName => {
                                if (!state.programs[progName]) {
                                    state.programs[progName] = importedState.programs[progName];
                                    if (!state.programOrder.includes(progName)) state.programOrder.push(progName);
                                } else {
                                    const mine = state.programs[progName].exercises || (state.programs[progName].exercises = []);
                                    (importedState.programs[progName].exercises || []).forEach(ex => {
                                        if (ex && ex.Exercice && !mine.some(m => m.Exercice.trim() === ex.Exercice.trim())) mine.push(ex);
                                    });
                                }
                            });
                        }
                        if (importedState.performance) {
                            Object.keys(importedState.performance).forEach(progName => {
                                if (!state.performance[progName]) state.performance[progName] = {};
                                Object.keys(importedState.performance[progName]).forEach(exoName => {
                                    if (!state.performance[progName][exoName]) state.performance[progName][exoName] = [];
                                    const existingDates = new Set(state.performance[progName][exoName].map(e => e.date));
                                    const newEntries = importedState.performance[progName][exoName].filter(e => e && e.date && !existingDates.has(e.date));
                                    if (newEntries.length > 0) {
                                        state.performance[progName][exoName].push(...newEntries);
                                    }
                                });
                            });
                        }
                        mergedCount++;
                    }
                    Object.values(state.performance).forEach(prog => {
                        Object.values(prog).forEach(exoHistory => exoHistory.sort((a,b) => a.date.localeCompare(b.date)));
                    });
                    if(mergedCount > 0) {
                        markDirty(); refreshAll();
                        showToast(`${mergedCount} fichier(s) fusionné(s) !`);
                    }
                } else {
                    const file = areHandles ? await files[0].getFile() : files[0];
                    const content = await file.text();
                    const importedState = JSON.parse(content);
                    if (importedState.programs && importedState.performance) {
                        state = normalizeState(importedState); padTodayEntries();
                        state.activeFileName = file.name; state.isDirty = false;
                        saveState(true); refreshAll();
                        showToast('Backup importé avec succès !');
                    } else { throw new Error("Format de fichier invalide."); }
                }
            } catch (err) {
                 console.error("Erreur de traitement du fichier :", err);
                 showToast(err.message || "Erreur lors de l'importation.", true);
            }
        }

        function handleSwipe() {
            if (!state.programOrder || state.programOrder.length < 2) return;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const minSwipeDistance = 100;
            if (Math.abs(deltaX) < Math.abs(deltaY) * 2) return; // défilement vertical : ne pas changer de programme
            const currentIndex = state.programOrder.indexOf(state.currentProgram);
            if (currentIndex === -1) return;
            let newIndex = currentIndex;
            if (deltaX < -minSwipeDistance) {
                newIndex = (currentIndex + 1) % state.programOrder.length;
            } else if (deltaX > minSwipeDistance) {
                newIndex = (currentIndex - 1 + state.programOrder.length) % state.programOrder.length;
            }
            if (newIndex !== currentIndex) {
                exerciseList.classList.add('slide-out-left');
                setTimeout(() => {
                    state.currentProgram = state.programOrder[newIndex];
                    saveState();
                    refreshAll();
                    exerciseList.classList.remove('slide-out-left');
                    exerciseList.classList.add('slide-in-right');
                    setTimeout(() => exerciseList.classList.remove('slide-in-right'), 250);
                }, 200);
            }
        }

        mainContent.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, { passive: true });
        mainContent.addEventListener('touchend', e => {
            if (e.target.closest('input, [contenteditable="true"], .no-swipe')) return;
            touchEndX = e.changedTouches[0].screenX; touchEndY = e.changedTouches[0].screenY; handleSwipe();
        }, { passive: true });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const isMerge = e.target.dataset.isMerge === 'true';
            processFiles(files, isMerge, false);
            e.target.value = '';
        });

        const refreshAll = () => { applyTheme(); renderHeader(); populateSelector(); renderProgram(); };
        programSelect.addEventListener('change', (e) => {
            exerciseList.classList.add('slide-out-left');
            setTimeout(() => {
                state.currentProgram = e.target.value;
                saveState();
                renderProgram();
                // Update pills
                const pillsContainer = document.getElementById('program-pills');
                if (pillsContainer) pillsContainer.querySelectorAll('.program-pill').forEach(p => p.classList.toggle('active', p.dataset.program === e.target.value));
                exerciseList.classList.remove('slide-out-left');
                exerciseList.classList.add('slide-in-right');
                setTimeout(() => exerciseList.classList.remove('slide-in-right'), 250);
            }, 200);
        });


        manageProgramsBtn.addEventListener('click', () => {
            renderProgramEditor();
            programModalContainer.style.display = 'flex';
            setTimeout(() => programModalContainer.classList.add('visible'), 10);
        });
        globalStatsBtn.addEventListener('click', () => {
            renderGlobalStatsModal();
            globalStatsModalContainer.style.display = 'flex';
            setTimeout(() => globalStatsModalContainer.classList.add('visible'), 10);
        });

        addExerciseBtn.addEventListener('click', () => {
            if (!state.currentProgram) { showToast("Crée d'abord un programme (menu ⋯ → Programmes).", true); return; }
            openExerciseEditor(-1);
        });

        clearAllPerfBtn.addEventListener('click', () => {
            const prog = state.currentProgram;
            if (!prog || !state.programs[prog]) return;
            if (!confirm(`Effacer toute la séance d'aujourd'hui pour « ${prog} » ?\n(Les séances des jours précédents ne sont pas touchées.)`)) return;
            const today = getLocalToday();
            Object.keys(state.performance[prog] || {}).forEach(name => {
                state.performance[prog][name] = state.performance[prog][name].filter(e => e.date !== today);
            });
            delete ui.started[prog]; delete ui.active[prog]; saveUi();
            rest = null; saveRest(); selSet = null;
            markDirty(); renderProgram();
            showToast('Séance du jour effacée.');
        });

        app.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (target && target.closest('#app-menu')) closeAppMenu();
            if (!target) return;

            if (!target.isContentEditable) { e.preventDefault(); }
            
            const action = target.dataset.action;
            const programName = state.currentProgram;
            switch (action) {
                case 'header-backup':
                    handleBackup();
                    break;
                case 'header-import':
                    handleImport(false);
                    break;
                case 'header-drive-save': {
                    const prog = state.currentProgram;
                    handleDriveSave().then(() => {
                        if (!state.isDirty && prog) { ui.saved[prog] = getLocalToday(); saveUi(); }
                        renderBar();
                    });
                    break;
                }
                case 'header-drive-load':
                    handleDriveLoad();
                    break;
                case 'merge-import':
                    handleImport(true);
                    programModalContainer.style.display = 'none';
                    break;
                case 'close-drive-modal': {
                    driveModalContainer.classList.remove('visible');
                    setTimeout(() => { driveModalContainer.style.display = 'none'; }, 200);
                    break;
                }
                case 'session-start': {
                    askNotifyPermission();
                    const exs = progExercises();
                    const first = exs.findIndex(ex => !isResolved(programName, ex));
                    ensureAudio();
                    activate(first >= 0 ? first : 0);
                    break;
                }
                case 'activate': {
                    const i = Number(target.closest('.card')?.dataset.index);
                    if (Number.isInteger(i)) activate(i);
                    break;
                }
                case 'unskip': {
                    const i = Number(target.closest('.card')?.dataset.index);
                    const ex = progExercises()[i];
                    if (ex) { setSkipped(programName, ex, false); activate(i); }
                    break;
                }
                case 'card-menu': {
                    const i = Number(target.closest('.card')?.dataset.index);
                    if (Number.isInteger(i)) openCardMenu(i);
                    break;
                }
                case 'select-set': {
                    const exs = progExercises(), a = activeIndex(programName);
                    if (a >= 0) { selSet = { prog: programName, exo: exs[a].Exercice, i: Number(target.dataset.set) }; renderProgram(); }
                    break;
                }
                case 'toggle-done': {
                    const k = Number(target.dataset.set);
                    const exs = progExercises(), a = activeIndex(programName);
                    if (a < 0) break;
                    const entry = ensureToday(programName, exs[a]);
                    if (setIsDone(entry.sets[k])) { entry.sets[k].done = false; selSet = null; markDirty(); renderProgram(); }
                    else validateSet(k);
                    break;
                }
                case 'validate-set':
                    validateSet();
                    break;
                case 'next-exercise': {
                    const n = nextIncomplete(programName, activeIndex(programName));
                    if (n >= 0) activate(n);
                    break;
                }
                case 'rest-add': {
                    if (!rest) break;
                    const now = Date.now();
                    rest.endAt = Math.max(now, rest.endAt) + Number(target.dataset.d) * 1000;
                    if (rest.endAt <= now) { rest.endAt = now; }
                    else { rest.rang = false; rest.total = Math.max(rest.total, Math.ceil((rest.endAt - now) / 1000)); }
                    saveRest(); renderBar(); runRestLoop();
                    break;
                }
                case 'rest-stop':
                    rest = null; saveRest(); renderBar();
                    break;
                case 'toggle-notes':
                    notesOpen = !notesOpen; renderProgram();
                    break;
                case 'edit-exercise': {
                    const i = Number(target.closest('.card')?.dataset.index);
                    if (Number.isInteger(i)) openExerciseEditor(i);
                    break;
                }
                case 'type-value':
                    if (!target.querySelector('input')) startTyping(target, target.dataset.field);
                    break;
                case 'reprise-apply':
                    ui.reprise[programName] = getLocalToday(); saveUi(); renderProgram();
                    showToast('Charges de reprise appliquées aux propositions.');
                    break;
                case 'reprise-undo': {
                    delete ui.reprise[programName]; saveUi();
                    // séances du jour encore vierges : on retire la réduction
                    progExercises().forEach(ex => { const e = todayEntryOf(programName, ex.Exercice); if (e && !e.sets.some(setIsDone)) e.sets = suggestSets(programName, ex); });
                    renderProgram();
                    break;
                }
                case 'reprise-dismiss':
                    ui.dismissed[programName] = getLocalToday(); saveUi(); renderProgram();
                    break;
                case 'view-history': {
                    renderHistoryModal(target.dataset.exerciseName);
                    historyModalContainer.style.display = 'flex';
                    setTimeout(() => historyModalContainer.classList.add('visible'), 10);
                    break;
                }
                case 'filter-history': {
                    renderHistoryModal(target.dataset.exerciseName, target.dataset.period);
                    break;
                }
                case 'filter-stats': {
                    renderGlobalStatsModal(target.dataset.period);
                    break;
                }
                case 'delete-perf-entry': {
                    const { date, exerciseName } = target.dataset;
                    const entryProg = target.dataset.program || programName;
                    if (confirm(`Voulez-vous vraiment supprimer la séance du ${fmtDate(date)} pour "${exerciseName}"${entryProg !== programName ? ` (programme « ${entryProg} »)` : ''} ?`)) {
                        const perfHistory = state.performance[entryProg]?.[exerciseName];
                        if (perfHistory) {
                            const entryIndex = perfHistory.findIndex(e => e.date === date);
                            if (entryIndex > -1) {
                                perfHistory.splice(entryIndex, 1);
                                markDirty(); renderProgram();
                                showToast('Entrée supprimée.');
                                renderHistoryModal(exerciseName, document.querySelector('#history-modal .filter-btn.active')?.dataset.period || 'all');
                            }
                        }
                    }
                    break;
                }
                case 'close-modal': {
                    const modals = [programModalContainer, historyModalContainer, globalStatsModalContainer];
                    modals.forEach(modal => {
                        if(modal.classList.contains('visible')) {
                            modal.classList.remove('visible');
                            setTimeout(() => { modal.style.display = 'none'; }, 200);
                        }
                    });
                    break;
                }
                case 'delete-program': {
                    const name = target.dataset.name;
                    if (confirm(`Voulez-vous vraiment supprimer le programme "${name}" ?`)) {
                        delete state.programs[name];
                        delete state.performance[name];
                        const index = state.programOrder.indexOf(name);
                        if (index > -1) state.programOrder.splice(index, 1);
                        if (state.currentProgram === name) {
                            state.currentProgram = state.programOrder[0] || null;
                        }
                        markDirty();
                        renderProgramEditor();
                        refreshAll();
                    }
                    break;
                }
                case 'duplicate-program': {
                    const name = target.dataset.name;
                    let newName = `${name} (copie)`;
                    let i = 2;
                    while (state.programs[newName]) {
                        newName = `${name} (copie ${i++})`;
                    }
                    state.programs[newName] = JSON.parse(JSON.stringify(state.programs[name]));
                    const index = state.programOrder.indexOf(name);
                    state.programOrder.splice(index + 1, 0, newName);
                    markDirty();
                    renderProgramEditor();
                    populateSelector();
                    showToast('Programme dupliqué.');
                    break;
                }
                case 'move-program': {
                    const index = parseInt(target.dataset.index, 10);
                    const direction = target.dataset.direction;
                    if (direction === 'up' && index > 0) {
                        [state.programOrder[index], state.programOrder[index - 1]] = [state.programOrder[index - 1], state.programOrder[index]];
                    } else if (direction === 'down' && index < state.programOrder.length - 1) {
                        [state.programOrder[index], state.programOrder[index + 1]] = [state.programOrder[index + 1], state.programOrder[index]];
                    }
                    markDirty();
                    renderProgramEditor();
                    populateSelector();
                    break;
                }
            }
        });

        programModalContainer.addEventListener('click', (e) => {
            const target = e.target.closest('button');
            if (!target) return;
            if (target.id === 'remap-backup-path-btn') { promptAndSetDirectory(); }
            if (target.id === 'add-program-btn') {
                const newName = programModalContainer.querySelector('#new-program-name').value.trim();
                if (newName && !state.programs[newName]) {
                    state.programs[newName] = { exercises: [] };
                    state.programOrder.push(newName);
                    if (!state.currentProgram) state.currentProgram = newName;
                    programModalContainer.querySelector('#new-program-name').value = '';
                    markDirty();
                    renderProgramEditor();
                    refreshAll();
                    showToast('Programme ajouté !');
                } else {
                    showToast('Nom invalide ou déjà existant.', true);
                }
            }
        });

        programModalContainer.addEventListener('change', (e) => {
             if (e.target.classList.contains('program-name-input')) {
                const input = e.target;
                const oldName = input.dataset.oldName;
                const newName = input.value.trim();
                if (newName && newName !== oldName && !state.programs[newName]) {
                    const programData = state.programs[oldName];
                    delete state.programs[oldName];
                    state.programs[newName] = programData;

                    if (state.performance[oldName]) {
                        const perfData = state.performance[oldName];
                        delete state.performance[oldName];
                        state.performance[newName] = perfData;
                    }
                    const index = state.programOrder.indexOf(oldName);
                    if(index > -1) state.programOrder[index] = newName;
                    if (state.currentProgram === oldName) state.currentProgram = newName;
                    if(state.programs[newName].name) { state.programs[newName].name = newName; }
                    input.dataset.oldName = newName;
                    markDirty();
                    populateSelector();
                    showToast('Programme renommé.');
                } else if (newName !== oldName) {
                    input.value = oldName;
                    showToast('Nom invalide ou déjà existant.', true);
                }
            }
        });

        async function init() {
            loadDriveConfig();
            loadState();
            setTimeout(checkDriveApi, 1000);
            refreshAll();
            if (isFileSystemAccessAPISupported) {
                dbRequest.onsuccess = async () => {
                    backupDirectoryHandle = await getDirectoryHandle();
                    if (backupDirectoryHandle) console.log("Un dossier de backup a été trouvé en mémoire.");
                };
                dbRequest.onerror = () => showToast("Impossible d'utiliser la base de données locale.", true);
            }
        }

        init();
        if (rest) runRestLoop();
        window.matchMedia('(min-width: 880px)').addEventListener('change', () => renderProgram());
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { renderProgram(); tickRest(); }
            updateWakeLock();
        });

        // Le debounce de 300 ms peut perdre la dernière saisie si l'app est fermée juste après
        const flushSave = () => { if (_saveTimeout) { clearTimeout(_saveTimeout); _saveTimeout = null; _saveStateImmediate(); } };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
        window.addEventListener('pagehide', flushSave);

        // === Service Worker + Update notification ===
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
            navigator.serviceWorker.addEventListener('message', e => {
                if (e.data?.type === 'SW_UPDATED') {
                    const v = e.data.version || '';
                    const t = document.getElementById('toast');
                    if (t) {
                        toastText.innerHTML = `🆕 Nouvelle version ${v.replace('fitness-tracker-','')} <button onclick="location.reload()" style="margin-left:8px;padding:3px 10px;border-radius:16px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.15);color:white;cursor:pointer;font-size:11px;">Recharger</button>`;
                        toastIcon.className = 'fas fa-arrow-up';
                        toast.className = 'fixed top-5 right-4 py-2 px-5 rounded-lg shadow-xl transition-all duration-300 z-50 flex items-center space-x-2 toast-success';
                        toast.style.pointerEvents = 'auto';
                        setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-4'); toast.style.pointerEvents = 'none'; }, 15000);
                    }
                }
            });
        }

        // === Install PWA prompt ===
        let _deferredInstall = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            _deferredInstall = e;
            const btn = document.getElementById('install-banner');
            if (btn) btn.style.display = 'flex';
        });
        document.getElementById('install-banner')?.addEventListener('click', () => {
            if (_deferredInstall) {
                _deferredInstall.prompt();
                _deferredInstall.userChoice.then(() => {
                    _deferredInstall = null;
                    document.getElementById('install-banner').style.display = 'none';
                });
            }
        });
        window.addEventListener('appinstalled', () => {
            document.getElementById('install-banner').style.display = 'none';
            _deferredInstall = null;
        });
    });
</script>
</body>
</html>
