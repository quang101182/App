# ─────────────────────────────────────────────────────────────────────────────
# factory-visits — Cloudflare Worker (Ebook Funnel Factory : compteur de visites)
# URL : https://factory-visits.quang101182.workers.dev
# Compteur ISOLÉ avec défense anti-bot server-side (ASN datacenter + empreinte
# IP+UA + denylist UA). Ne touche PAS api-gateway-pro (revenue prod).
# Deploy : cd App/factory-visits && wrangler deploy --config wrangler.toml
# ─────────────────────────────────────────────────────────────────────────────
name               = "factory-visits"
main               = "src/index.js"
compatibility_date = "2024-09-23"

# Namespace KV dédié (vierge → repart de 0, mesure propre du trafic humain).
[[kv_namespaces]]
binding = "FACTORY_VISITS_KV"
id      = "28178eb426624b9f85c24a0ff8435b3f"
