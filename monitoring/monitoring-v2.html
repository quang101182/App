        return `<article class="fac-card"><div class="fac-card-head"><div class="fac-num">${a.n}</div><div class="fac-head-text"><div class="fac-name">${safeText(a.name)}<span class="fac-badges"><span class="fac-badge ${dotCls}">${safeText(phaseLabel)}</span>${a.bilingual ? '<span class="fac-badge bil">EN+FR</span>' : ''}</span></div><div class="fac-handle"><a href="${safeText(a.handleUrl)}" target="_blank" rel="noopener">${safeText(a.handle)}</a></div></div></div><div class="fac-meta"><div class="fac-domain"><a href="https://${safeText(a.domain)}" target="_blank" rel="noopener">🔗 ${safeText(a.domain)}</a></div>${emailHtml}</div><div class="fac-metrics">${metricsHtml}</div>${convHtml}<div class="fac-health"><span class="fac-dot ${dotCls}"></span>Santé op : ${safeText(phaseLabel)}${a.note ? ` · ${safeText(a.note)}` : ''}</div></article>`;
      }).join('');
      const tail = hasStats
        ? '<button class="fac-tokenbtn" type="button" data-factory-token>🔑 token</button>'
        : (data && data.hadToken)
          ? `<span class="fac-warn">worker factory-stats injoignable → ventes/abonnés « — »</span> <button class="fac-tokenbtn" type="button" data-factory-token>🔑 token</button>`
          : '<button class="fac-tokenbtn accent" type="button" data-factory-token>🔑 brancher ventes &amp; abonnés</button>';
      return `${Panel('fac-accounts', 'Comptes', `<p class="fac-note">Visites / clics achat / téléchargements = compteur public <b>temps réel</b>, reparti de zéro le ${FACTORY_VISITS_SINCE}. Ventes &amp; abonnés = worker <code>factory-stats</code>, <b>cumuls depuis l’origine</b> (« — » tant qu’aucun token n’est branché). Les deux fenêtres ne se comparent pas.</p><div class="fac-grid">${cards}</div><div class="fac-foot">${tail}</div>`, true)}`;
    }

    // ── P4 / Studio — filtres (mêmes clés que la prod : on persiste les items DÉCOCHÉS) ──
    function studioCats() { return { project: Object.keys(STUDIO_PROJECTS), channel: Object.keys(STUDIO_CHANNELS), lang: ['FR', 'EN'] }; }
    function loadStudioFilters() {
      let off = {};
      try { off = JSON.parse(localStorage.getItem(STUDIO_FILTER_LS)) || {}; } catch (e) {}
      const cats = studioCats(), out = {};
      Object.keys(cats).forEach(cat => {
        const offSet = new Set(Array.isArray(off[cat]) ? off[cat] : []);
        out[cat] = new Set(cats[cat].filter(x => !offSet.has(x)));
      });
      return out;
    }
    function saveStudioFilters() {
      const cats = studioCats(), off = {};
      Object.keys(cats).forEach(cat => { off[cat] = cats[cat].filter(x => !studioFilters[cat].has(x)); });
      try { localStorage.setItem(STUDIO_FILTER_LS, JSON.stringify(off)); } catch (e) {}
    }
    let studioFilters = loadStudioFilters();
    // Re-render depuis le CACHE : un clic de chip ne doit JAMAIS repartir sur le réseau (la prod refetch à chaque clic).
    function studioRerender() { const cfg = getApp('studio'); renderApp(cfg, state.cache.get('studio') || {}); }
    function toggleStudioFilter(cat, val) {
      const s = studioFilters[cat];
      if (s.has(val)) s.delete(val); else s.add(val);
      saveStudioFilters(); studioRerender();
    }
    function toggleAllStudio(cat) {
      const all = studioCats()[cat], s = studioFilters[cat];
      if (s.size >= all.length) s.clear(); else all.forEach(x => s.add(x));
      saveStudioFilters(); studioRerender();
    }
    // Écart CALENDAIRE (pas une durée) : la prod mélange `toDateString()` pour « aujourd'hui » et un ceil de
    // millisecondes pour « J+N » → un post de DEMAIN à plus de 24 h s'annonce « J+2 » (vérifié : 29/06 10:00 → post 30/06 19:15 = J+2).
    function studioDayDelta(from, to) {
      const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
      const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
      return Math.round((b - a) / 86400000);
    }
    function studioPerfRows(list) {
      return list.slice(0, 8).map((p, i) => {
        const c = p.current || {};
        const dv = (p.delta || {}).views;
        const dtxt = (typeof dv === 'number' && dv > 0) ? ` <span class="pf-delta">+${dv}</span>` : '';
        return `<div class="pf-row"><span class="pf-rank">${i + 1}</span><span class="pf-cap">${safeText((p.caption || '').slice(0, 54))}</span><span class="pf-m">👁 ${c.views != null ? c.views : '—'}${dtxt}</span><span class="pf-m">❤ ${c.likes != null ? c.likes : '—'}</span><span class="pf-m">💬 ${c.comments != null ? c.comments : '—'}</span></div>`;
      }).join('');
    }
    function renderStudioPerf(data) {
      if (!data || !data.perf) {
        return Panel('studio-perf', '📊 Performances TikTok', `<p class="st-perf-empty">Rollup <code>${STUDIO_PERF_URL}</code> indisponible${data && data.perfError ? ` (${safeText(data.perfError)})` : ''} — le planning ci-dessous reste à jour.</p>`, true);
      }
      const d = data.perf;
      const posts = d.posts || [];
      const mine = posts.filter(p => p.owner === 'studio' && p.current && (p.current.views || 0) > 0);
      // DÉCISION QUANG (16/07) : organique et boosté affichés SÉPARÉMENT, jamais additionnés.
      // La prod annonce « boostées exclues » et les compte quand même : 4 vidéos achetées (67 000 vues) en tête du tableau.
      const organic = mine.filter(p => !p.boosted).sort((a, b) => (b.current.views || 0) - (a.current.views || 0));
      const boosted = mine.filter(p => p.boosted).sort((a, b) => (b.current.views || 0) - (a.current.views || 0));
      const sumViews = list => list.reduce((t, p) => t + (p.current.views || 0), 0);
      const perso = posts.filter(p => p.owner !== 'studio' && !p.boosted && p.current && (p.current.views || 0) > 0)
        .sort((a, b) => (b.current.views || 0) - (a.current.views || 0));
      const ref = perso[0];
      const snap = d.generatedAt ? studioFmtSnap(d.generatedAt) : '?';
      const nSnap = d.snapshots || 1;
      const organicBlock = organic.length
        ? `<div class="pf-group"><div class="pf-group-h"><span class="pf-tag organic">Organique</span><span class="pf-group-sum">${organic.length} vidéo${organic.length > 1 ? 's' : ''} · <b>${sumViews(organic)}</b> vues</span></div>${studioPerfRows(organic)}</div>`
        : '<div class="pf-group"><div class="pf-group-h"><span class="pf-tag organic">Organique</span><span class="pf-group-sum">aucune vidéo publiée</span></div></div>';
      const boostedBlock = boosted.length
        ? `<div class="pf-group"><div class="pf-group-h"><span class="pf-tag paid">Boostées · vues achetées</span><span class="pf-group-sum">${boosted.length} vidéo${boosted.length > 1 ? 's' : ''} · <b>${sumViews(boosted)}</b> vues</span></div>${studioPerfRows(boosted)}<div class="pf-note">Vues payées — jamais additionnées à l’organique : elles ne mesurent pas la traction.</div></div>`
        : '';
      const foot = `Snapshot du ${safeText(snap)} · ${nSnap} relevé${nSnap > 1 ? 's' : ''} · posts perso exclus${ref ? ` · réf organique compte ~${ref.current.views} vues` : ''}`;
      return Panel('studio-perf', '📊 Performances TikTok', `${organicBlock}${boostedBlock}<div class="pf-foot">${foot}</div><p class="pf-note">Ce bloc couvre <b>tout le compte @se7en.ai</b> : il ne suit pas les filtres de l’agenda (le rollup n’a pas la notion de projet).</p>`, true);
    }
    // '20260630-1912' — chaîne compacte sans fuseau, affichée brute par la prod. Formatée ici, sans prétendre connaître le fuseau du collecteur.
    function studioFmtSnap(s) {
      const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})$/.exec(String(s));
      return m ? `${m[3]}/${m[2]}/${m[1]} à ${m[4]}:${m[5]}` : String(s);
    }
    function renderStudioView(data) {
      const now = new Date();
      const passF = p => studioFilters.project.has(p.project) && studioFilters.lang.has(p.lang) && p.channels.some(c => studioFilters.channel.has(c));
      const posts = STUDIO_SCHEDULE.filter(passF).map(p => {
        const dt = new Date(`${p.date}T${p.time}:00`);   // heure LOCALE (pas de Z) — cohérent avec STUDIO_UPDATED, ne pas "corriger" en UTC
        return { p, dt, past: dt < now };
      });
      const upcoming = posts.filter(x => !x.past).sort((a, b) => a.dt - b.dt);
      const past = posts.filter(x => x.past).sort((a, b) => b.dt - a.dt);
      let nextTxt = '—';
      if (upcoming.length) {
        const delta = studioDayDelta(now, upcoming[0].dt);
        nextTxt = delta === 0 ? `Auj. ${upcoming[0].p.time}` : delta === 1 ? 'Demain' : `J+${delta}`;
      }
      const wk = upcoming.filter(x => x.dt - now < 7 * 86400000).length;
      const card = x => {
        const p = x.p;
        const pc = (STUDIO_PROJECTS[p.project] || {}).color || 'var(--accent)';
        // Tous les canaux du post restent visibles (l'info est vraie), mais ceux qui sont décochés sont atténués :
        // la prod les affiche à l'identique, donc un canal masqué par le filtre continuait de s'afficher en pleine couleur.
        const chans = p.channels.map(c => {
          const m = STUDIO_CHANNELS[c] || { label: c, c: '#888' };
          const off = !studioFilters.channel.has(c);
          return `<span class="st-chan${off ? ' off' : ''}" style="--chan:${m.c}"${off ? ' title="Canal décoché dans les filtres"' : ''}>${safeText(m.label)}</span>`;
        }).join('');
        const fmt = `Démo écran + voix off${p.subs ? ' + sous-titres' : ''}`;
        const mus = p.music ? ` <span class="mus">· 🎵 ${safeText(p.music)}</span>` : '';
        return `<div class="st-card${x.past ? ' posted' : ''}" style="--proj:${pc}"><div class="st-date"><div class="d">${x.dt.getDate()}</div><div class="m">${STUDIO_MONTHS[x.dt.getMonth()]}</div><div class="t">${safeText(p.time)}</div></div><div class="st-body"><div class="st-row1"><span class="st-proj">${safeText(p.project)}</span><span class="st-lang">${safeText(p.lang)}</span><span class="st-status ${x.past ? 'posted' : 'sched'}">${x.past ? 'Publié' : 'Programmé'}</span></div><div class="st-chans">${chans}</div><div class="st-meta">${fmt}${mus}</div></div></div>`;
      };
      const lanes = STUDIO_LANES.map(l => `<div class="st-lane-row"><strong>${safeText(l.chan)}</strong><span class="arrow">→</span><span class="st-lang">${safeText(l.lang)}</span><span class="st-why">${safeText(l.why)}</span></div>`).join('');
      // Le backlog obéit aux 3 filtres, comme l'agenda (la prod ne lui applique que le projet → décocher TikTok laissait 3 items TikTok à l'écran).
      const backlogArr = STUDIO_BACKLOG.filter(b => studioFilters.project.has(b.project) && studioFilters.channel.has(b.target) && studioFilters.lang.has(b.lang));
      const backlog = backlogArr.map(b => {
        const pc = (STUDIO_PROJECTS[b.project] || {}).color || 'var(--accent)';
        const m = STUDIO_CHANNELS[b.target] || { label: b.target };
        return `<div class="st-backlog"><div class="bk-top"><span class="st-proj" style="color:${pc}">${safeText(b.project)}</span><span class="st-lang">${safeText(m.label)}</span></div><div class="bk-what">${safeText(b.what)}</div>${b.note ? `<div class="bk-meta">${safeText(b.note)}</div>` : ''}</div>`;
      }).join('');
      const CATS = [
        { key: 'project', label: 'Projet', items: Object.keys(STUDIO_PROJECTS).map(p => ({ v: p, l: p, c: STUDIO_PROJECTS[p].color })) },
        { key: 'channel', label: 'Réseau', items: Object.keys(STUDIO_CHANNELS).map(c => ({ v: c, l: STUDIO_CHANNELS[c].label, c: STUDIO_CHANNELS[c].c })) },
        { key: 'lang', label: 'Langue', items: ['FR', 'EN'].map(l => ({ v: l, l, c: 'var(--accent)' })) }
      ];
      const fbar = `<div class="st-filters">${CATS.map(cat => {
        const allOn = studioFilters[cat.key].size >= cat.items.length;
        const chips = cat.items.map(it => `<button type="button" class="st-chip ${studioFilters[cat.key].has(it.v) ? 'on' : 'off'}" style="--chip:${it.c}" data-studio-filter="${cat.key}" data-studio-val="${safeText(it.v)}" aria-pressed="${studioFilters[cat.key].has(it.v)}">${safeText(it.l)}</button>`).join('');
        return `<div class="st-filt-row"><span class="st-filt-lbl">${cat.label}</span>${chips}<button class="st-allbtn" type="button" data-studio-all="${cat.key}">${allOn ? 'Tout décocher' : 'Tout cocher'}</button></div>`;
      }).join('')}</div>`;
      const agenda = (upcoming.length || past.length || backlogArr.length)
        ? `${upcoming.length ? `<div class="st-section-h">À venir <span class="cnt">${upcoming.length}</span></div>${upcoming.map(card).join('')}` : ''}${backlog ? `<div class="st-section-h">À produire <span class="cnt">${backlogArr.length}</span></div>${backlog}` : ''}${past.length ? `<div class="st-section-h">Publié <span class="cnt">${past.length}</span></div>${past.map(card).join('')}` : ''}`
        : '<div class="st-empty">Aucun post pour ces filtres.<br>Vérifie les chips décochés ci-dessus.</div>';
      const su = new Date(STUDIO_UPDATED);
      const p2s = n => String(n).padStart(2, '0');
      const suStale = now.getTime() - su.getTime() > 3 * 86400000;
      const banner = `<div class="st-planning-bar${suStale ? ' stale' : ''}"><span class="fb-ic">🎬</span><span>Planning tenu à la main — dernière édition le <b>${p2s(su.getDate())}/${p2s(su.getMonth() + 1)}/${su.getFullYear()} à ${p2s(su.getHours())}:${p2s(su.getMinutes())}</b> (${relativeTime(su)})${suStale ? ' — <b>périmé (&gt; 3 j)</b>' : ''}</span></div>`;
      return `${banner}<div class="st-stats kpi-grid">${KpiTile('Prochain', nextTxt, upcoming.length ? 'post visible le plus proche' : 'aucun post à venir')}${KpiTile('7 prochains jours', wk, 'fenêtre glissante, pas la semaine calendaire')}${KpiTile('À venir', upcoming.length, 'après filtres')}</div>${renderStudioPerf(data)}${Panel('studio-lanes', '📡 Stratégie par canal', `<div class="st-lane">${lanes}</div>`, true)}${fbar}<div class="st-agenda">${agenda}</div><p class="st-foot">Planning éditorial — les chiffres des plateformes viennent du seul rollup TikTok ci-dessus.</p>`;
    }

    function renderApp(app, data) {
      const err = state.error.get(app.key);
      // Détruire AVANT de remplacer le DOM : sinon Chart.js empile les instances sur des canvas morts.
      // (La prod a cette fuite : `window._cLatency` est hors de son objet `charts`, donc `destroyCharts()` l'oublie.)
      dkDestroyCharts();
      let content;
      if (app.auth === 'token' && !getToken(app)) content = TokenGate(app);
      else if (err && /401/.test(err)) content = TokenGate(app, 'Session expirée ou token invalide (401). Colle un token valide.');
      else if (err) content = EmptyState(app.name, `Échec du chargement : ${err}`);
      else if (app.key === 'home') content = renderHome(data);
      else if (app.key === 'acq') content = renderAcq(data);
      else if (app.key === 'swp') content = renderSwpView(data);
      else if (app.key === 'sv') content = renderSvView(data);
      else if (app.key === 'dk') content = renderDkView(data);
      else if (app.key === 'factory') content = renderFactoryView(data);
      else if (app.key === 'studio') content = renderStudioView(data);
      else content = renderPlaceholder(app, data);
      document.getElementById('view-root').innerHTML = `<div class="page-head"><div><h1>${safeText(app.name)} <span class="view-badge">${VERSION}</span></h1><p>${safeText(app.subtitle)}</p></div><button class="button" type="button" data-refresh="${app.key}">↻ Actualiser</button></div>${FreshBar(app)}${content}`;
      if (app.key === 'dk' && !err && getToken(app)) dkMountCharts(data);   // après innerHTML : les canvas doivent exister
    }
    // Le prod a un `loadingOverlay` ; sans équivalent, la vue DictoKey (5 sources, jusqu'à ~20 s quand le
    // worker Cloudflare est à froid) laisse un écran BLANC muet — on croit que c'est cassé. Mesuré : 22 s.
    function renderLoading(app) {
      const wait = app.key === 'dk'
        ? 'DictoKey interroge 5 sources ; jusqu’à ~20 s quand le worker est à froid.'
        : 'Récupération des données.';
      document.getElementById('view-root').innerHTML =
        `<div class="page-head"><div><h1>${safeText(app.name)} <span class="view-badge">${VERSION}</span></h1><p>${safeText(app.subtitle)}</p></div></div>` +
        `<div class="loading-state" role="status" aria-live="polite"><span class="loading-spin" aria-hidden="true"></span><div><strong>Chargement…</strong><p>${wait}</p></div></div>`;
    }
    async function refresh(key) {
      const cfg = getApp(key);
      if (cfg.auth === 'token' && !getToken(cfg)) { renderApp(cfg, {}); return; }   // pas de token → pas de 401 inutile
      if (state.controller) state.controller.abort();
      renderLoading(cfg);
      state.controller = new AbortController();
      try { state.cache.set(cfg.key, await fetchApp(cfg, state.controller.signal)); state.loadedAt.set(cfg.key, new Date()); state.error.delete(cfg.key); }
      catch (error) { if (error.name !== 'AbortError') state.error.set(cfg.key, error.message || String(error)); }
      finally { state.controller = null; renderApp(cfg, state.cache.get(cfg.key) || {}); }
    }
    function route(key, forceRefresh = false) {
      const cfg = getApp(key);
      if (location.hash !== `#${cfg.key}`) {
        location.hash = cfg.key;
        return;
      }
      state.activeKey = cfg.key;
      renderNavigation();
      if (!state.loadedAt.has(cfg.key) || forceRefresh) refresh(cfg.key); else renderApp(cfg, state.cache.get(cfg.key) || {});
      closeDrawer();
    }
    function openDrawer() { document.getElementById('app-shell').classList.add('drawer-open'); document.getElementById('menu-button').setAttribute('aria-expanded', 'true'); }
    function closeDrawer() { document.getElementById('app-shell').classList.remove('drawer-open'); document.getElementById('menu-button').setAttribute('aria-expanded', 'false'); }
    function onHashChange() { route(location.hash.slice(1) || 'home'); }

    document.addEventListener('click', event => {
      const routeButton = event.target.closest('[data-route]');
      if (routeButton) { route(routeButton.dataset.route); return; }
      const refreshButton = event.target.closest('[data-refresh]');
      if (refreshButton) { refresh(refreshButton.dataset.refresh); return; }
      const studioChip = event.target.closest('[data-studio-filter]');
      if (studioChip) { toggleStudioFilter(studioChip.dataset.studioFilter, studioChip.dataset.studioVal); return; }
      const studioAll = event.target.closest('[data-studio-all]');
      if (studioAll) { toggleAllStudio(studioAll.dataset.studioAll); return; }
      const factoryToken = event.target.closest('[data-factory-token]');
      if (factoryToken) {
        const cfg = getApp('factory');
        let current = '';
        try { current = localStorage.getItem(cfg.tokenKey) || ''; } catch (e) {}
        const value = window.prompt('Token du worker factory-stats (ventes/abonnés). Laisser vide pour effacer :', current);
        if (value === null) return;
        try {
          if (value.trim()) localStorage.setItem(cfg.tokenKey, value.trim());
          else localStorage.removeItem(cfg.tokenKey);
        } catch (e) {}
        refresh('factory');
        return;
      }
      const tokenButton = event.target.closest('[data-token-save]');
      if (tokenButton) {
        const cfg = getApp(tokenButton.dataset.tokenSave);
        const input = document.getElementById('token-input');
        const value = (input && input.value || '').trim();
        if (!value || !cfg.tokenKey) return;
        localStorage.setItem(cfg.tokenKey, value);
        state.error.delete(cfg.key);
        refresh(cfg.key);
        return;
      }
      const tierPill = event.target.closest('[data-tier]');
      if (tierPill) {
        const t = tierPill.dataset.tier;
        dkDevState.filters[t] = !dkDevState.filters[t];
        dkSaveTierFilters();
        dkApplyDeviceFilters(true);
        dkRefreshDevicesPanel();
        return;
      }
      const tierReset = event.target.closest('[data-tier-reset]');
      if (tierReset) {
        event.preventDefault();
        dkDevState.filters = { pro: true, premium: true, free: true };
        dkSaveTierFilters();
        dkApplyDeviceFilters(true);
        dkRefreshDevicesPanel();
        return;
      }
      const devPage = event.target.closest('[data-dev-page]');
      if (devPage) {
        const totalPages = Math.ceil(dkDevState.filtered.length / DK_PER_PAGE);
        if (devPage.dataset.devPage === 'prev') dkDevState.page = Math.max(0, dkDevState.page - 1);
        else dkDevState.page = Math.min(Math.max(totalPages - 1, 0), dkDevState.page + 1);
        dkRefreshDevicesPanel();
        return;
      }
      const panelButton = event.target.closest('.panel-toggle');
      if (panelButton) {
        const panel = panelButton.closest('.panel');
        const open = panel.dataset.open !== 'true';
        panel.dataset.open = String(open);
        panelButton.setAttribute('aria-expanded', String(open));
        // Un canvas dans un panneau replié a une taille nulle → resize à l'ouverture, sinon chart écrasé.
        if (open) requestAnimationFrame(() => Object.values(dkCharts).forEach(c => { try { c.resize(); } catch (e) {} }));
      }
    });
    document.addEventListener('input', event => {
      if (event.target && event.target.id === 'dk-dev-search') {
        dkDevState.search = event.target.value || '';
        dkApplyDeviceFilters(true);
        dkRefreshDevicesPanel(true);
      }
    });
    document.getElementById('menu-button').addEventListener('click', () => document.getElementById('app-shell').classList.contains('drawer-open') ? closeDrawer() : openDrawer());
    document.getElementById('nav-scrim').addEventListener('click', closeDrawer);
    window.addEventListener('hashchange', onHashChange);
    route(location.hash.slice(1) || 'home');
  </script>
</body>
</html>
