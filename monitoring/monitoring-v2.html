<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Se7en AI — Monitoring v2</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg: #0a0d13;
      --surface: #141a26;
      --surface-raised: #1c2434;
      --surface-soft: #111725;
      --line: rgba(255, 255, 255, .07);
      --line-strong: rgba(255, 255, 255, .15);
      --ink: #e9eef6;
      --ink-muted: #9aa7b8;
      --ink-faint: #68758a;
      --accent: #3aa0ff;
      --dk: #2f80d8;
      --swp: #ec4899;
      --sv: #c77d0a;
      --good: #22c55e;
      --warn: #f5b52e;
      --crit: #ef4444;
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-width: 224px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }

    .sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 18px 12px; overflow-y: auto; background: linear-gradient(180deg, var(--surface-soft), #0e1420); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-size: 1.08rem; font-weight: 800; letter-spacing: .01em; }
    .brand-mark { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #cfe8ff, var(--accent) 55%, #0a2c5c); box-shadow: 0 0 16px rgba(58, 160, 255, .55); }
    .brand-seven { color: var(--accent); }
    .nav-group { margin: 12px 0 4px; padding: 0 12px; color: var(--ink-faint); font-size: .62rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--ink-muted); text-align: left; font-size: .88rem; font-weight: 650; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .nav-item:hover { background: var(--surface-raised); color: var(--ink); }
    .nav-item[aria-current="page"] { border-color: rgba(58, 160, 255, .28); background: rgba(58, 160, 255, .13); color: #d3ebff; }
    .nav-icon { width: 18px; text-align: center; font-size: 1rem; }
    .product-dot { width: 8px; height: 8px; margin-left: auto; border-radius: 50%; background: var(--product-color); box-shadow: 0 0 7px var(--product-color); }
    .side-footer { margin-top: auto; padding: 18px 10px 4px; color: var(--ink-faint); font-size: .67rem; }

    .mobile-bar { position: sticky; top: 0; z-index: 30; display: none; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; background: rgba(20, 26, 38, .96); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    .menu-button, .icon-button { display: inline-grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; }
    .mobile-title { font-weight: 800; }
    .scrim { display: none; }

    main { width: 100%; max-width: 1180px; padding: 26px 30px 64px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .page-head h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.7rem; line-height: 1.15; letter-spacing: -.025em; }
    .page-head p { margin: 4px 0 0; color: var(--ink-muted); font-size: .85rem; }
    .view-badge { padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-muted); font-size: .65rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: .82rem; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .button:hover { border-color: var(--accent); background: var(--surface-raised); }

    .freshbar { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 24px; padding: 9px 13px; border: 1px solid var(--line); border-left: 3px solid var(--fresh-color); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-muted); font-size: .81rem; cursor: pointer; }
    .freshbar:hover { border-color: var(--line-strong); background: var(--surface-raised); }
    .fresh-dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--fresh-color); box-shadow: 0 0 0 0 var(--fresh-color); }
    .freshbar strong { color: var(--ink); }
    .fresh-action { margin-left: auto; color: var(--accent); font-weight: 700; white-space: nowrap; }

    .placeholder { display: grid; min-height: 290px; place-items: center; padding: 32px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: linear-gradient(145deg, var(--surface), rgba(20, 26, 38, .45)); text-align: center; }
    .placeholder-inner { max-width: 470px; }
    .placeholder-icon { display: block; margin-bottom: 13px; color: var(--accent); font-size: 1.8rem; }
    .placeholder h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .placeholder p { margin: 0; color: var(--ink-muted); }

    .section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
    .section-head a { color: var(--accent); font-size: .78rem; font-weight: 700; text-decoration: none; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .kpi-tile, .product-card, .funnel, .alert, .panel { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .kpi-tile { min-height: 126px; padding: 16px 17px; }
    .kpi-label { color: var(--ink-faint); font-size: .67rem; font-weight: 750; letter-spacing: .065em; text-transform: uppercase; }
    .kpi-value { margin-top: 7px; font-size: 1.82rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 3px; color: var(--ink-muted); font-size: .76rem; }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .product-card { position: relative; overflow: hidden; padding: 18px; color: inherit; text-align: left; cursor: pointer; }
    .product-card::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--product-color); content: ""; }
    .product-card::after { position: absolute; inset: 0 0 auto; height: 80px; background: radial-gradient(115% 100% at 0 0, color-mix(in srgb, var(--product-color) 22%, transparent), transparent 70%); content: ""; pointer-events: none; }
    .product-card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
    .product-name { position: relative; padding-left: 8px; font-size: 1rem; font-weight: 800; }
    .product-meta { position: relative; display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; padding-left: 8px; }
    .product-meta span { display: block; color: var(--ink-faint); font-size: .64rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .product-meta strong { font-size: 1.08rem; }
    .product-meta .pm-item > strong { display: block; margin-top: 3px; color: var(--ink); font-size: 1.08rem; font-variant-numeric: tabular-nums; }
    .product-progress { position: relative; height: 6px; margin: 15px 0 0 8px; overflow: hidden; border-radius: 5px; background: rgba(255, 255, 255, .07); }
    .product-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--product-color); }
    .funnel { padding: 18px; }
    .funnel-step + .funnel-step { margin-top: 13px; }
    .funnel-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: .84rem; }
    .funnel-meta span { color: var(--ink-muted); }
    .funnel-bar { height: 12px; overflow: hidden; border-radius: 7px; background: rgba(58, 160, 255, .09); }
    .funnel-bar i { display: block; width: var(--bar-width); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #7cc0ff); box-shadow: 0 0 12px rgba(58, 160, 255, .35); }
    .alert-list { display: grid; gap: 9px; }
    .alert { display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 11px 14px; border-left: 3px solid var(--alert-color); }
    .alert-badge { padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--alert-color) 16%, transparent); color: var(--alert-color); font-size: .64rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .alert-message { color: var(--ink-muted); font-size: .84rem; }
    .alert-message strong { color: var(--ink); }
    .panel { overflow: hidden; }
    .panel-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; padding: 13px 16px; border: 0; background: transparent; color: var(--ink); text-align: left; font-weight: 750; cursor: pointer; }
    .panel-toggle:hover { background: rgba(255, 255, 255, .025); }
    .panel-chevron { color: var(--accent); transition: transform .16s; }
    .panel[data-open="true"] .panel-chevron { transform: rotate(180deg); }
    .panel-content { display: none; padding: 0 16px 16px; color: var(--ink-muted); font-size: .85rem; }
    .panel[data-open="true"] .panel-content { display: block; }

    .acq-northstar { margin: 0 0 22px; color: var(--ink-muted); font-size: .84rem; line-height: 1.45; }
    .acq-northstar strong { color: var(--ink); }
    .acq-hub { padding: 18px 16px; border: 1px solid rgba(58, 160, 255, .16); border-radius: var(--radius); background: linear-gradient(160deg, rgba(58, 160, 255, .05), var(--surface-soft)); }
    .acq-hub-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .acq-hub-head h3 { margin: 0; font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; }
    .acq-hub-head a { color: var(--accent); text-decoration: none; }
    .acq-hub-desc { margin: 2px 0 16px; color: var(--ink-muted); font-size: .8rem; line-height: 1.45; }
    .acq-recap { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; }
    .acq-sub { margin-bottom: 12px; color: var(--ink-faint); font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .funnel-note { color: var(--ink-faint); font-weight: 400; font-size: .74rem; }
    .funnel-line { display: flex; align-items: center; gap: 10px; }
    .funnel-line .funnel-bar { flex: 1; }
    .funnel-conv { flex: 0 0 auto; min-width: 78px; color: var(--ink-faint); font-size: .76rem; text-align: right; white-space: nowrap; }
    .acq-detail { margin-top: 11px; color: var(--ink-muted); font-size: .8rem; }
    .acq-detail strong { color: var(--ink); }
    .acq-site { position: relative; overflow: hidden; margin-bottom: 14px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .acq-site::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--product-color); content: ""; }
    .acq-site-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 13px; padding-left: 8px; }
    .acq-site-head a { color: var(--product-color); font-size: 1.02rem; font-weight: 800; text-decoration: none; }
    .acq-rate { color: var(--ink-muted); font-size: .77rem; white-space: nowrap; }
    .acq-rate strong { color: var(--ink); font-size: .92rem; }
    .acq-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 12px; padding-left: 8px; }
    .acq-mlabel { display: block; color: var(--ink-faint); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .acq-mvalue { display: block; margin-top: 3px; color: var(--product-color); font-size: 1.32rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .acq-mvalue.acq-out { color: var(--warn); }
    .acq-mnote { display: block; margin-top: 2px; color: var(--ink-muted); font-size: .72rem; }
    .acq-progress { height: 12px; margin-left: 8px; overflow: hidden; border-radius: 6px; background: rgba(58, 160, 255, .09); }
    .acq-progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--product-color), #7cc0ff); }
    .acq-when { margin-top: 12px; color: var(--ink-faint); font-size: .78rem; }

    /* P3 — produits payants */
    .muted { color: var(--ink-faint); }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .78rem; }
    .empty { padding: 18px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--ink-muted); text-align: center; }
    .badge { display: inline-block; padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--ink-muted); font-size: .66rem; font-weight: 750; }
    .badge.pro { border-color: rgba(58,160,255,.4); background: rgba(58,160,255,.12); color: #9fd0ff; }
    .badge.trial { border-color: rgba(245,181,46,.4); background: rgba(245,181,46,.12); color: #f3ce7d; }
    .badge.rev { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.12); color: #f5a3a3; }
    .health { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: .76rem; }
    .health .hdot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
    .health.h-risk .hdot { background: var(--crit); box-shadow: 0 0 6px var(--crit); }
    .health.h-warn .hdot { background: var(--warn); }
    .health.h-ok .hdot { background: var(--good); }
    .health.h-trial .hdot { background: var(--warn); opacity: .6; }
    .health.h-rev .hdot, .health.h-test .hdot { background: var(--ink-faint); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .data-table { width: 100%; border-collapse: collapse; font-size: .8rem; white-space: nowrap; }
    .data-table th { padding: 10px 12px; border-bottom: 1px solid var(--line-strong); color: var(--ink-faint); text-align: left; font-size: .66rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table tr.row-risk td { background: rgba(239, 68, 68, .06); }
    .data-table tr.row-rev td, .data-table tr.row-test td { color: var(--ink-muted); }
    .sv-row { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .sv-row + .sv-row { margin-top: 9px; }
    .sv-row-main { display: flex; align-items: center; gap: 9px; }
    .sv-email { font-weight: 700; }
    .sv-row-meta { margin-top: 5px; color: var(--ink-muted); font-size: .77rem; }
    .token-form { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .token-form input { min-width: 0; flex: 1 1 240px; max-width: 320px; min-height: 40px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: .85rem; }
    .token-form input:focus { border-color: var(--accent); outline: none; }

    /* P3b1 — DictoKey */
    .kpi-value { color: var(--ink); }
    .trend-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .trend-item { display: flex; align-items: baseline; gap: 8px; flex: 1 1 190px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .trend-label { color: var(--ink-faint); font-size: .68rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .trend-val { margin-left: auto; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .change { font-size: .74rem; font-weight: 750; }
    .change.up, .churn-info .up { color: var(--good); }
    .change.down, .churn-info .down { color: var(--crit); }
    .change.neutral { color: var(--ink-faint); }
    .churn-info { font-size: .9rem; }
    .dk-stale { margin-bottom: 14px; }
    .dk-sub2 { margin-top: 20px; }
    .cost-list { display: grid; gap: 9px; }
    .cost-row { display: flex; align-items: center; gap: 12px; }
    .cost-label { flex: 0 0 110px; color: var(--ink-muted); font-size: .8rem; }
    .cost-bar-bg { flex: 1; height: 11px; overflow: hidden; border-radius: 6px; background: rgba(255, 255, 255, .06); }
    .cost-bar-bg i { display: block; height: 100%; border-radius: inherit; }
    .cost-bar-bg i.c0 { background: linear-gradient(90deg, #7c5cff, #a68bff); }
    .cost-bar-bg i.c1 { background: linear-gradient(90deg, var(--accent), #7cc0ff); }
    .cost-bar-bg i.c2 { background: linear-gradient(90deg, var(--good), #6ee7a8); }
    .cost-amount { flex: 0 0 62px; color: var(--ink); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
    .cost-total { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 750; font-size: .84rem; }
    .panel-content .acq-sub:first-child { margin-top: 0; }

    /* P3b3 — Charts & jauges */
    .chart-title { margin-bottom: 10px; color: var(--ink-faint); font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .chart-box { position: relative; height: 260px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .chart-box.donut { height: 230px; }
    .no-data { display: grid; min-height: 90px; place-items: center; color: var(--ink-faint); font-size: .82rem; }
    .donut-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .gauge-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .gauge { padding: 13px 14px; border: 1px solid var(--line); border-left: 3px solid var(--g-color); border-radius: var(--radius-sm); background: var(--surface); }
    .gauge.g-good { --g-color: var(--good); }
    .gauge.g-warn { --g-color: var(--warn); }
    .gauge.g-crit { --g-color: var(--crit); }
    .gauge-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .gauge-label { color: var(--ink-faint); font-size: .68rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .gauge-state { color: var(--g-color); font-size: .66rem; font-weight: 800; }
    .gauge-value { margin: 6px 0 8px; font-size: 1.32rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .gauge-bar { height: 7px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, .07); }
    .gauge-bar i { display: block; height: 100%; border-radius: inherit; background: var(--g-color); }
    .gauge-sub { margin-top: 7px; color: var(--ink-faint); font-size: .68rem; }

    /* P3b5 — Rétention / usage / mouvements de tier */
    .ret-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi-value.r-good { color: var(--good); }
    .kpi-value.r-warn { color: var(--warn); }
    .kpi-value.r-crit { color: var(--crit); }
    .kpi-value.ret-na { color: var(--ink-faint); font-size: .84rem; font-weight: 600; }
    .seg-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .seg { padding: 6px 11px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-muted); font-size: .76rem; }
    .seg b { color: var(--ink); }
    .adopt-list { display: grid; gap: 10px; }
    .adopt-row { display: flex; align-items: center; gap: 12px; }
    .adopt-label { flex: 0 0 92px; color: var(--ink-muted); font-size: .8rem; }
    .adopt-bg { flex: 1; height: 9px; overflow: hidden; border-radius: 5px; background: rgba(255, 255, 255, .06); }
    .adopt-bg i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #7cc0ff); }
    .adopt-info { flex: 0 0 auto; color: var(--ink-faint); font-size: .74rem; font-variant-numeric: tabular-nums; }
    .churn-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; color: var(--ink-muted); font-size: .86rem; line-height: 1.7; }
    .churn-sum b { color: var(--ink); }
    .churn-sum b.up, .up { color: var(--good); }
    .churn-sum b.down, .down { color: var(--crit); }
    .churn-kv { margin-top: 7px; color: var(--ink-faint); font-size: .72rem; }

    /* P3b4 — Firebase / Adoption / Attribution */
    .fb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .fb-card { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .fb-card .chart-title { margin-bottom: 8px; }
    .fb-funnel { padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: .84rem; line-height: 1.85; }
    .fb-funnel .ind { margin-left: 1.2em; }
    .fb-funnel b { color: var(--ink); }
    .badge-row { margin-bottom: 12px; }

    function swpFmtDate(iso) { if (!iso) return '<span class="muted">—</span>'; const d = new Date(iso); if (isNaN(d.getTime())) return '<span class="muted">—</span>'; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }

    // UTC forcé : last_data_date / window_* viennent du Worker qui parse les CSV Google en UTC (l.2957-2971).
    function dkPlayDate(iso) { return iso ? new Date(iso + 'T00:00:00Z').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', timeZone: 'UTC' }) : '?'; }
    function dkDaysSinceUtc(iso) {
      if (!iso) return null;
      const now = new Date();
      const todayUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());

    // Fantôme = free jamais utilisé (et pas premium runtime, sinon ce n'est pas un fantôme).
    // ⚠ UNIFICATION v2 : la prod définit ce test 3 fois (render l.2606, renderDevicesPage l.4008 = ms + tier
    // minusculé ; donut pays l.2811 = comparaison de strings ISO + `d.tier` BRUT sans minuscules). Vérifié le
    // 16/07 sur les 464 devices réels : les 2 variantes donnent 65, ZÉRO écart (tiers déjà en minuscules,
    // aucune date manquante) → unifiées ici sans changer un seul chiffre. Le donut de P3b3 doit utiliser CE helper.
    function dkIsPhantom(d) {
      if ((d.tier || 'free').toLowerCase() !== 'free') return false;
      if (d.effectiveTier) return false;
      const created = new Date(d.createdAt).getTime();

    // Cohortes devices — PC exclus (préfixe `pc_`). premiumRuntime = KV free + effective premium UNIQUEMENT
    // (v1.7.21 : `tier !== 'pro'` incluait à tort les KV premium → ne pas réintroduire).
    function dkDeviceStats(dev) {
      const devicesList = ((dev && dev.devices) || []).filter(d => !(d.deviceId || '').toLowerCase().startsWith('pc_'));
      const tierCounts = { pro: 0, premium: 0, free: 0 };
      let phantomCount = 0, premiumRuntimeCount = 0;
      devicesList.forEach(d => {
        const tier = (d.tier || 'free').toLowerCase();
        if (tierCounts[tier] !== undefined) tierCounts[tier]++; else tierCounts.free++;
        if (d.effectiveTier === 'premium' && tier === 'free') premiumRuntimeCount++;
        if (dkIsPhantom(d)) phantomCount++;
      });
      const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
      const newDevicesToday = devicesList.filter(d => { if (!d.createdAt) return false; const t = new Date(d.createdAt).getTime(); return !isNaN(t) && t >= startOfToday.getTime(); }).length;
      return { devicesList, tierCounts, phantomCount, premiumRuntimeCount,
               effectiveFree: tierCounts.free - premiumRuntimeCount,
               totalPremium: tierCounts.premium + premiumRuntimeCount, newDevicesToday };

    // Replie la queue sur « Autres » : au-delà de 8 tranches on ne cycle JAMAIS les couleurs.
    function dkFoldTop(entries, n = 7) {
      const sorted = entries.slice().sort((a, b) => b[1] - a[1]);
      if (sorted.length <= n + 1) return sorted;
      const tail = sorted.slice(n).reduce((s, e) => s + e[1], 0);
      return tail > 0 ? sorted.slice(0, n).concat([['Autres', tail]]) : sorted.slice(0, n);
    }
    function dkFlagEmoji(code) {
      if (!code || code === 'Inconnu') return '❓ Inconnu';

      if (code.length !== 2) return code;
      const RIA = 0x1F1E6, A = 0x41;
      try { return String.fromCodePoint(RIA + code.toUpperCase().charCodeAt(0) - A) + String.fromCodePoint(RIA + code.toUpperCase().charCodeAt(1) - A) + ' ' + code.toUpperCase(); }
      catch (e) { return code; }

      const perms = !permRows.length ? '<div class="good-note">✅ Aucun refus de permission 7j (= bon signal)</div>'
        : permRows.slice().sort((a2, b) => (b.users || 0) - (a2.users || 0))
            .map(r => `<div class="sm">• <b>${safeText(r.permission || '(unknown)')}</b> : ${r.users} users (${r.count} refus)</div>`).join('');

      return `<div class="badge-row">${dkBadge(totalEvents)}</div><div class="fb-grid">`
        + `<div class="fb-card"><div class="chart-title">Choix du flow</div>${flow}</div>`
        + `<div class="fb-card"><div class="chart-title">Conversion bandeau</div>${bubble}</div>`
        + `<div class="fb-card"><div class="chart-title">Drop-off par slide</div>${steps}</div>`
        + `<div class="fb-card"><div class="chart-title">Refus de permission</div>${perms}</div></div>`;
    }

    function renderDkAttribution(fb) {
      const at = fb && fb.aggregated && fb.aggregated.attribution_v2617;
      if (!at) return `<div class="no-data">⏳ En attente</div>`;
      let totalEvents = 0;
      ['install_source', 'install_content', 'oem_kill_brand'].forEach(k => (at[k] || []).forEach(r => { totalEvents += (r.count || 0); }));

      const srcRows = at.install_source || [];
      let src;
      if (!srcRows.length) src = '<div class="no-data">⏳ Aucun event <code>install_attribution</code> 7j</div>';
      else {
        const total = srcRows.reduce((a, r) => a + (r.users || 0), 0);
        src = `<div class="big">${dkNum(total)} <span>nouveaux installs trackés</span></div>`
          + srcRows.slice().sort((a, b) => (b.users || 0) - (a.users || 0)).slice(0, 6).map(r => {
              const s = r.source || '(unknown)';
              const cls = s === 'dictokey-site' ? 's1' : s === '(direct)' ? 's2' : 's3';
              return `<div class="sm"><i class="sw ${cls}"></i><b>${safeText(s)}</b> : ${r.users || 0} (${dkPct(r.users || 0, total)}%)</div>`;
            }).join('');
      }
      const contRows = at.install_content || [];
      let cont;
      if (!contRows.length) cont = '<div class="no-data">⏳ Aucun event 7j</div>';
      else {
        const total = contRows.reduce((a, r) => a + (r.users || 0), 0);
        cont = `<div class="big">${dkNum(total)} <span>installs taggés (top 8)</span></div>`
          + contRows.slice().sort((a, b) => (b.users || 0) - (a.users || 0)).slice(0, 8)
              .map(r => `<div class="sm">• <code>${safeText(r.content || '(none)')}</code> : <b>${r.users || 0}</b> (${dkPct(r.users || 0, total)}%)</div>`).join('');
      }
      const oemRows = at.oem_kill_brand || [];
      let oem;
      if (!oemRows.length) oem = '<div class="good-note">✅ Aucun kill OEM détecté 7j (= bon signal)</div>';
      else {
        const kills = oemRows.reduce((a, r) => a + (r.count || 0), 0);
        const devices = oemRows.reduce((a, r) => a + (r.users || 0), 0);
        oem = `<div class="big warn">${dkNum(devices)} <span>devices impactés / ${kills} kills 7j</span></div>`
          + oemRows.slice().sort((a, b) => (b.count || 0) - (a.count || 0)).slice(0, 6)
              .map(r => `<div class="sm">• <b>${safeText(r.brand || '(unknown)')}</b> : ${r.count || 0} kills (${r.users || 0} device${(r.users || 0) > 1 ? 's' : ''})</div>`).join('');
      }
      return `<div class="badge-row">${dkBadge(totalEvents)}</div><div class="fb-grid">`
        + `<div class="fb-card"><div class="chart-title">Sources d’installation</div>${src}</div>`
        + `<div class="fb-card"><div class="chart-title">Top boutons / pages</div>${cont}</div>`
        + `<div class="fb-card"><div class="chart-title">Kills OEM</div>${oem}</div></div>`;
    }

    // === P3b5 — Rétention (mon.advanced) + Mouvements de tier (parité stricte, index.html l.3673-3784 / 3914-3969) ===
    function renderDkAdvanced(adv) {
      if (!adv) return `<div class="no-data">Pas de métriques avancées sur la période</div>`;
      // --- Rétention D1/D7/D30. Seuils : ≥0.4 vert · ≥0.2 orange · sinon rouge. Cohorte absente → « Pas assez de données ».
      let ret = '';
      if (adv.retention) {
        ret = `<div class="chart-title">Rétention</div><div class="kpi-grid ret-grid">` + [['d1', 'D1'], ['d7', 'D7'], ['d30', 'D30']].map(([k, label]) => {
          const d = adv.retention[k];
          if (!d) return `<article class="kpi-tile"><div class="kpi-label">${label}</div><div class="kpi-value ret-na">Pas assez de données</div></article>`;
          const cls = d.rate >= 0.4 ? 'r-good' : d.rate >= 0.2 ? 'r-warn' : 'r-crit';
          return `<article class="kpi-tile"><div class="kpi-label">${label}</div><div class="kpi-value ${cls}">${Math.round(d.rate * 100)}%</div><div class="kpi-note">Cohorte : ${d.cohort_size} utilisateurs</div></article>`;
        }).join('') + `</div>`;
      }
      // --- Nouveaux utilisateurs (chart monté dans dkMountCharts)
      let signups = '';
      if (adv.new_users) {
        signups = `<div class="chart-title dk-sub2">Nouveaux utilisateurs</div>`
          + `<div class="sm">${adv.new_users.total_period} total sur la période — moy. ${adv.new_users.avg_per_day}/jour</div>`
          + `<div class="chart-box" style="height:210px;margin-top:9px"><canvas id="dk-chart-signup"></canvas></div>`;
      }
      // --- Distribution d'usage + segments
      let usage = '';
      if (adv.usage_distribution) {
        const pu = adv.usage_distribution.per_user || {}, seg = adv.usage_distribution.segments || {};
        usage = `<div class="chart-title dk-sub2">Usage par utilisateur</div><div class="kpi-grid">`
          + [['Min', pu.min], ['Max', pu.max], ['Moyenne', pu.avg], ['Médiane', pu.median]]
              .map(([l, v]) => KpiTile(l, v || 0, 'dictées/jour')).join('')
          + `</div><div class="seg-row">`
          + `<span class="seg">Power (&gt;20) : <b>${seg.power || 0}</b></span>`
          + `<span class="seg">Régulier (5-20) : <b>${seg.regular || 0}</b></span>`
          + `<span class="seg">Occasionnel (&lt;5) : <b>${seg.casual || 0}</b></span></div>`;
      }
      // --- Adoption des features
      let adoption = '';
      if (adv.feature_adoption) {
        const fa = adv.feature_adoption, totalDev = fa.active_devices || 1;
        adoption = `<div class="chart-title dk-sub2">Adoption des features</div><div class="adopt-list">`
          + [['Dictée', fa.transcribe], ['Réécriture', fa.rewrite], ['Correction', fa.correct], ['Traduction', fa.translate]]
              .map(([label, d0]) => {
                const d = d0 || { users: 0, rate: 0 };
                const pct = Math.round(d.rate * 100);
                return `<div class="adopt-row"><span class="adopt-label">${safeText(label)}</span><div class="adopt-bg"><i style="width:${pct}%"></i></div>`
                  + `<span class="adopt-info">${pct}% — ${d.users}/${totalDev} util.</span></div>`;
              }).join('') + `</div>`;
      }
      return ret + signups + usage + adoption;
    }

    // Mouvements de tier. Le KV (`m:churn:{date}`) ne bouge QUE sur un changement de tier admin ; les
    // achats/restores Play Billing côté APK ne notifient pas le gateway → KV à 0 alors que Firebase voit
    // les events. La prod affiche donc les 2 sources côte à côte avec leur sémantique exacte — on fait pareil.
    function renderDkChurn(churn, fb) {
      const details = (churn && churn.details) || [];
      const ups = (churn && churn.upgrades) || 0, dns = (churn && churn.downgrades) || 0;
      const ev = fb && fb.aggregated && fb.aggregated.events;
      let summary;
      if (ev) {
        const g = (n, f) => (ev[n] && ev[n][f]) || 0;
        const pu = g('premium_purchase', 'users'), puC = g('premium_purchase', 'count');
        const rs = g('premium_restored', 'users');
        const rm = g('app_remove', 'users'), rmC = g('app_remove', 'count');
        summary = `<div class="churn-sum"><span><b class="up">↑ ${pu}</b> achats Premium fresh${puC !== pu ? ` (${puC} events)` : ''}</span>`
          + `<span><b>🔁 ${rs}</b> restaurations (reinstall/replay)</span>`
          + `<span><b class="down">↓ ${rm}</b> désinstalls totaux${rmC !== rm ? ` (${rmC} events)` : ''}</span>`
          + `<span class="muted">Firebase 7j</span></div>`
          + `<div class="churn-kv">KV gateway (changements de tier admin seulement) : ${ups} upgrades · ${dns} downgrades · ${details.length} détail${details.length > 1 ? 's' : ''} table ci-dessous.</div>`;
      } else {
        summary = `<div class="churn-sum"><span class="up"><b>↑ ${ups} upgrades</b></span> · <span class="down"><b>↓ ${dns} downgrades</b></span>`
          + ` · <span class="muted">${details.length} détail${details.length > 1 ? 's' : ''} affiché${details.length > 1 ? 's' : ''}</span>`
          + ` · <span class="muted">(Firebase events en attente)</span></div>`;
      }
      if (!details.length) return summary + `<div class="empty dk-sub2">Aucun mouvement de tier sur la période</div>`;
      const rows = details.slice().sort((a, b) => new Date(b.ts || b.date).getTime() - new Date(a.ts || a.date).getTime())
        .map(d => {
          const did = d.deviceId || 'inconnu';
          return `<tr><td>${safeText(dkFmtDateTime(d.ts || d.date))}</td><td class="mono" title="${safeText(did)}">${safeText(did.length > 12 ? did.slice(0, 12) + '...' : did)}</td>`
            + `<td><span class="down">${safeText(d.from || '?')} → ${safeText(d.to || '?')}</span></td></tr>`;
        }).join('');
      return summary + `<div class="table-wrap dk-sub2"><table class="data-table"><thead><tr><th>Date</th><th>Appareil</th><th>Transition</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    // === P3b2 — Appareils DictoKey : état + helpers (parité stricte, index.html l.3786-4061) ===
    // 30/page — ÉCART ASSUMÉ vs prod (50/page), demande explicite Quang le 16/07 : pages plus courtes,
    // surtout lisible en mobile. N'affecte AUCUN chiffre (total, KPI, filtres) — seulement le nb de pages.
    const DK_PER_PAGE = 30;
    const LS_TIER_FILTERS = 'monitoring_tier_filters';   // même clé que la prod → filtres hérités
    const dkDevState = { page: 0, search: '', filters: dkLoadTierFilters(), all: [], filtered: [] };
    function dkLoadTierFilters() {
      try {
        const stored = localStorage.getItem(LS_TIER_FILTERS);
        if (stored) { const p = JSON.parse(stored); return { pro: p.pro !== false, premium: p.premium !== false, free: p.free !== false }; }
      } catch (e) {}
      return { pro: true, premium: true, free: true };
    }
    function dkSaveTierFilters() { try { localStorage.setItem(LS_TIER_FILTERS, JSON.stringify(dkDevState.filters)); } catch (e) {} }
    // Catégorie EFFECTIVE. Les 2 sources de premium sont disjointes par construction :
    //   - `tier === 'premium'` en KV  → écrit par l'APP (`/device/restore` ou `/device/update-tier`), pas à la main
    //   - `effectiveTier === 'premium'` avec KV free → premium runtime (app < v2.61.4 qui n'a jamais syncé le KV)
    // ⚠ Seul `pro` est admin-set (cadeau à vie). NE PAS décrire les premium comme « manuels » — ce sont des achats Google Play.
    // 🐛 CORRIGE UN BUG DE LA PROD (divergence assumée, feu vert Quang 16/07) : `getDeviceCategory()` (l.3813-3822)
    // teste `pro` puis `effectiveTier === 'premium'`, et OUBLIE le cas `tier === 'premium'` en KV → ces appareils
    // retombaient dans « free ». Sur les données réelles : 12 KV premium + 6 runtime = 18, dont 2 KV premium sans
    // aucun signal runtime → pills premium 16 au lieu de 18, et ces 2 disparaissaient dès qu'on décochait « free ».
    // Le summary, lui, les comptait bien (totalPremium = 18) → les 2 sources se contredisaient.
    function dkDeviceCategory(d) {
      const kvTier = (d.tier || 'free').toLowerCase();
      if (kvTier === 'pro') return 'pro';
      if (kvTier === 'premium' || d.effectiveTier === 'premium') return 'premium';
      return 'free';
    }
    function dkDetectPlatform(deviceId) { return (deviceId || '').toLowerCase().startsWith('pc_') ? 'PC' : 'Mobile'; }
    function dkRelativeTime(s) {
      const mins = Math.floor((Date.now() - new Date(s).getTime()) / 60000);
      if (mins < 1) return "À l'instant";
      if (mins < 60) return `Il y a ${mins}min`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `Il y a ${hours}h`;
      return `Il y a ${Math.floor(hours / 24)}j`;
    }
    function dkTimeOnly(s) { if (!s) return ''; const d = new Date(s); return isNaN(d.getTime()) ? '' : `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    function dkDateStack(s) {
      if (!s) return '—';
      const d = new Date(s);
      if (isNaN(d.getTime())) return '—';
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}<div class="time-sub">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div>`;
    }
    function dkCountryFlag(code) { return (!code || code === '—') ? '' : `<img src="https://flagcdn.com/20x15/${String(code).toLowerCase()}.png" width="20" height="15" alt="${safeText(code)}" class="flag">`; }
    function dkApplyDeviceFilters(resetPage) {
      const q = (dkDevState.search || '').toLowerCase();
      dkDevState.filtered = (dkDevState.all || []).filter(d => {
        const cat = dkDeviceCategory(d);
        if (!dkDevState.filters[cat]) return false;
        if (!q) return true;
        return (d.deviceId || '').toLowerCase().includes(q) || cat.includes(q)
          || dkDetectPlatform(d.deviceId || '').toLowerCase().includes(q) || (d.country || '').toLowerCase().includes(q);
      });
      const totalPages = Math.ceil(dkDevState.filtered.length / DK_PER_PAGE);
      dkDevState.page = (resetPage === false) ? Math.min(dkDevState.page, Math.max(totalPages - 1, 0)) : 0;
    }

    // === P2 — Agrégats Home (dérivés des mêmes compteurs publics que la vue Acquisition) ===
    // Somme cohérente avec la vue acq : hub/swp/sv comptent les `out:*`, DictoKey compte `clicks.total` (outMode).
    function acqSiteOut(acq, key) {
      const d = acq[key] || {};
      const clicks = d.clicks || {};
      if ((ACQ_META[key] || {}).outMode === 'total') return acqInt(clicks.total);
      const bb = clicks.by_btn_all || {};
      return Object.keys(bb).reduce((sum, b) => b.indexOf('out:') === 0 ? sum + acqInt(bb[b]) : sum, 0);
    }
    function acqTotals(acq) {
      if (!acq) return null;
      let visites = 0, today = 0;
      ['se7', 'dk', 'swp', 'sv'].forEach(k => { const v = (acq[k] && acq[k].visit) || {}; visites += acqInt(v.total); today += acqInt(v.today); });
      const hb = (acq.se7 && acq.se7.clicks && acq.se7.clicks.by_btn_all) || {};
      const engagement = acqInt(hb['f:demo']) + acqInt(hb['f:chat']) + acqInt(hb['f:cta']);
      const hubOut = Object.keys(hb).reduce((sum, k) => k.indexOf('out:') === 0 ? sum + acqInt(hb[k]) : sum, 0);
      const sortants = hubOut + ['dk', 'swp', 'sv'].reduce((sum, k) => sum + acqSiteOut(acq, k), 0);
      return { visites, today, engagement, sortants };
    }
    // Agrégats produit pour la Home. La Home est TOKEN-LESS (décision roadmap §4) : elle ne fetche JAMAIS
    // les endpoints payants — elle consomme UNIQUEMENT le cache des apps déjà ouvertes (§2.2). Cache absent
    // → `null` → la Home affiche « — » et le dit, plutôt que d'exposer une donnée protégée sans token.
    function homeSwpStats() {
      const data = (state.cache.get('swp') || {}).overview;
      if (!data) return null;
      const list = (data.customers_list || []).map(cu => Object.assign({}, cu, { _h: swpHealth(cu) }));
      const real = list.filter(c => !swpIsTest(c.email));
      const payants = real.filter(c => c.plan === 'pro' && !c.revoked && c.lsStatus === 'active');
      return { mrr: payants.length * SWP_PRICE_EUR, real: real.length, atRisk: real.filter(c => c._h.rank <= 1).length };
    }
    function homeSvStats() {
      const data = (state.cache.get('sv') || {}).overview;
      if (!data) return null;
      const real = (data.customers_list || []).filter(c => !svIsInternal(c.email));
      return { revenue: real.reduce((s, c) => s + svRevenue(c.creditsGranted), 0), real: real.length };
    }
    function homeDkStats() {
      const c = state.cache.get('dk');
      if (!c || !c.mon) return null;
      const ds = dkDeviceStats(c.dev);
      const a = c.play && c.play.aggregated;
      const psActive = (a && a.active_devices_net) || null;
      return { actives: (psActive && psActive > 0) ? psActive : (ds.devicesList.length - ds.phantomCount),
               snapAge: a ? dkDaysSinceUtc(a.last_data_date) : null, snapDate: a ? a.last_data_date : null };
    }

    // Alertes agrégées. Publiques (acq) toujours ; produit seulement si l'app a été ouverte (cache présent).
    function homeAlerts(acq, swp, sv, dk) {
      const list = [];
      if (acq) ['dk', 'swp', 'sv'].forEach(k => {
        const vTot = acqInt(((acq[k] || {}).visit || {}).total);
        if (vTot >= 50 && acqSiteOut(acq, k) === 0) list.push({ level: 'attention', title: ACQ_META[k].name, message: `${vTot} visites mais aucun clic sortant — le parcours de sortie ne convertit pas.` });
      });
      if (swp && swp.atRisk > 0) list.push({ level: 'critique', title: 'SubWhisper Pro', message: `${swp.atRisk} abonné(s) payant(s) à risque (payé jamais utilisé / inactif >14j / paiement en échec).` });
      if (dk && dk.snapAge !== null && dk.snapAge > 3) list.push({ level: 'attention', title: 'DictoKey', message: `snapshot Play Console figé au ${dkPlayDate(dk.snapDate)} (J-${dk.snapAge}) — les chiffres Play reflètent ce snapshot, pas l’état actuel.` });
      return list;
    }

    // === P3 — Vue SubWhisper Pro (parité stricte avec renderSwp, index.html l.2300-2424) ===
    function renderSwpView(payload) {
      const data = payload && payload.overview;
      if (!data) return EmptyState('SubWhisper Pro', 'Aucune donnée reçue de /admin/swp/overview.');
      const u = data.usage_this_month || { transcriptions: 0, translations: 0 };
      const visits = data.site_visits || { total: 0, today: 0 };
      const lim = data.limits_per_plan || {};
      const limTrial = lim.trial || { transcriptions: '?', translations: '?' };
      const limPro = lim.pro || { transcriptions: '?', translations: '?' };
      // Cohortes — base de TOUS les chiffres. Les KPI excluent les test/démo ; le TABLEAU les inclut (2 populations).
      const swpList = (data.customers_list || []).map(cu => Object.assign({}, cu, { _h: swpHealth(cu) }));
      swpList.sort((a, b) => (a._h.rank - b._h.rank) || String(b.created || '').localeCompare(String(a.created || '')));
      const real = swpList.filter(c => !swpIsTest(c.email));
      const proNonRevoked = real.filter(c => c.plan === 'pro' && !c.revoked);
      const payants = proNonRevoked.filter(c => c.lsStatus === 'active');   // 'active' STRICT
      const pastDue = proNonRevoked.filter(c => c.lsStatus === 'past_due' || c.lsStatus === 'unpaid');
      const orphanPro = proNonRevoked.filter(c => c.lsStatus === 'not_found');
      const trialsActifs = real.filter(c => c.plan === 'trial' && !c.revoked);
      const revokedReal = real.filter(c => c.revoked);
      const atRisk = real.filter(c => c._h.rank <= 1);
      const jamais = real.filter(c => c._h.rank === 0);
      const nbTest = swpList.length - real.length;
      const mrr = payants.length * SWP_PRICE_EUR;

      // Bandeau d'alerte — 3 états exclusifs
      let alertHtml = '';
      if (atRisk.length > 0) {
        const reasons = [];
        if (jamais.length > 0) reasons.push(`${jamais.length} payé(s) jamais utilisé(s) (risque remboursement)`);
        if (pastDue.length > 0) reasons.push(`${pastDue.length} paiement(s) en échec / past_due`);
        const inactiveOnly = atRisk.length - jamais.length - pastDue.length;
        if (inactiveOnly > 0) reasons.push(`${inactiveOnly} inactif(s) >14j`);
        const who = atRisk.slice(0, 3).map(c => c.email).join(', ') + (atRisk.length > 3 ? ' …' : '');
        alertHtml = Alert('critique', `${atRisk.length} abonné(s) à risque`, `${reasons.join(' · ')} → à relancer : ${who}`);
      } else if (payants.length > 0) {
        alertHtml = Alert('ok', 'Aucun payant à risque', `les ${payants.length} abonnement(s) actif(s) ont une activité récente.`);
      }

      const payantsSub = `${payants.length} abonnement(s) LS « active »`
        + (pastDue.length > 0 ? ` · ${pastDue.length} paiement échoué` : '')
        + (orphanPro.length > 0 ? ` · ${orphanPro.length} clé orpheline` : '');
      const money = `<div class="kpi-grid">`
        + KpiTile('💶 MRR réel', `${mrr} €`, `${payants.length} abonnement(s) LemonSqueezy « active » × ${SWP_PRICE_EUR}€ (prix liste)`)
        + KpiTile('💳 Payants actifs', payants.length, payantsSub)
        + KpiTile('⚠️ À risque', atRisk.length, 'payé jamais utilisé / inactif >14j / paiement en échec')
        + KpiTile('📉 Churn', swpPct(revokedReal.length, real.length), `${revokedReal.length} révoqués / ${real.length} clients réels (cumulé, pas mensuel)`)
        + `</div>`;

      const vTot = visits.total || 0;
      const funnel = `<div class="funnel">`
        + FunnelBar('👁 Visites', vTot, 100)
        + FunnelBar(`👥 Clients réels — ${swpPct(real.length, vTot)}`, real.length, vTot ? Math.max(2, Math.round((real.length / vTot) * 100)) : 0)
        + FunnelBar(`💳 Payants — ${swpPct(payants.length, real.length)} des clients`, payants.length, vTot ? Math.max(2, Math.round((payants.length / vTot) * 100)) : 0)
        + `</div>`;

      const cActive = proNonRevoked.length + trialsActifs.length;
      const clients = `<div class="kpi-grid">`
        + KpiTile('Clients réels SWP', real.length, `${cActive} non révoqués · ${revokedReal.length} révoqués · ${nbTest} test/démo exclus`)
        + KpiTile('Trial', trialsActifs.length, 'en période d’essai')
        + KpiTile('Pro (payant)', payants.length, `${proNonRevoked.length} clé(s) pro non-révoquée(s) · ${payants.length} active(s)`)
        + KpiTile('Revoked', revokedReal.length, 'annulés / expirés')
        + `</div>`;

      const usage = `<div class="kpi-grid">`
        + KpiTile('Transcriptions ce mois', u.transcriptions || 0, `limites : ${limTrial.transcriptions} (trial) / ${limPro.transcriptions} (pro) par client`)
        + KpiTile('Traductions ce mois', u.translations || 0, `limites : ${limTrial.translations} (trial) / ${limPro.translations} (pro) par client`)
        + KpiTile('Visites site', vTot, `+${visits.today || 0} aujourd’hui`)
        + `</div>`;

      const rows = swpList.length ? swpList.map(cu => {
        const h = cu._h;
        const cls = h.rank <= 1 ? 'row-risk' : h.cls === 'test' ? 'row-test' : h.cls === 'rev' ? 'row-rev' : '';
        const um = cu.usageMonth || {}, ut = cu.usageTotal || {};
        return `<tr class="${cls}">`
          + `<td><span class="health h-${h.cls}"><span class="hdot"></span>${safeText(h.label)}</span></td>`
          + `<td>${safeText(cu.email)}</td>`
          + `<td>${swpPlanBadge(cu)}</td>`
          + `<td>${swpFmtDate(cu.created)}</td>`
          + `<td>${swpFmtDate(cu.expiresAt)}</td>`
          + `<td title="${safeText(cu.lastUsed || '')}">${swpFmtRelative(cu.lastUsed)}</td>`
          + `<td class="mono">${um.transcriptions || 0}t / ${um.translations || 0}tr</td>`
          + `<td class="mono muted">${ut.transcriptions || 0}t / ${ut.translations || 0}tr</td>`
          + `</tr>`;
      }).join('') : '';
      const table = swpList.length
        ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Santé</th><th>Email</th><th>Statut</th><th>Créé le</th><th>Expire le</th><th>Dernière activité</th><th>Usage ${safeText(data.month || '')}</th><th>Usage total</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="empty">Aucun client pour le moment.</div>`;

      const when = new Date(data.generatedAt || Date.now()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return (alertHtml ? `<section class="section"><div class="alert-list">${alertHtml}</div></section>` : '')
        + `<section class="section"><div class="section-head"><h2>💶 Revenu &amp; abonnements</h2></div>${money}</section>`
        + `<section class="section"><div class="section-head"><h2>Funnel</h2><a href="#acq">Acquisition →</a></div>${funnel}</section>`
        + `<section class="section"><div class="section-head"><h2>Clients</h2></div>${clients}</section>`
        + `<section class="section"><div class="section-head"><h2>Usage ${safeText(data.month || '')}</h2></div>${usage}</section>`
        + `<section class="section"><div class="section-head"><h2>Détail clients · triés par risque</h2></div>${table}</section>`
        + `<div class="acq-when">Dernière mise à jour : ${safeText(when)}</div>`;
    }

    // === P3 — Vue StoryVoice (parité stricte avec renderSv, index.html l.2506-2552) ===
    function renderSvView(payload) {
      const data = payload && payload.overview;
      if (!data) return EmptyState('StoryVoice', 'Aucune donnée reçue de /admin/sv/overview.');
      const list = (data.customers_list || []).slice();
      const real = list.filter(c => !svIsInternal(c.email));
      const internal = list.length - real.length;
      let revenue = 0, grantedReal = 0, usedReal = 0, remReal = 0, activeReal = 0, revokedReal = 0;
      real.forEach(c => {                                   // accumulés sur `real` UNIQUEMENT
        revenue += svRevenue(c.creditsGranted);
        grantedReal += Number(c.creditsGranted || 0);
        usedReal += Number(c.creditsUsed || 0);
        remReal += Number(c.creditsRemaining || 0);
        if (!c.revoked) activeReal++; else revokedReal++;
      });
      const visits = (data.site_visits || {}).total || 0;
      const visToday = (data.site_visits || {}).today || 0;
      const convPct = visits > 0 ? Math.round((real.length / visits) * 1000) / 10 : null;

      const money = `<div class="kpi-grid">`
        + KpiTile('📈 Conversion démo→achat', convPct === null ? '—' : `${convPct}%`, `${real.length} achat(s) / ${svFmt(visits)} visite(s) · seuil GO 3%`)
        + KpiTile('💶 Revenu estimé', `${svFmt(Math.round(revenue * 100) / 100)} €`, 'dérivé des crédits vendus (packs LemonSqueezy)')
        + KpiTile('👤 Clients payants', real.length, internal > 0 ? `${internal} interne(s)/test exclus` : 'aucune clé interne')
        + KpiTile('👁 Visites démo', svFmt(visits), visToday > 0 ? `+${visToday} auj.` : 'storiesvoice.org')
        + `</div>`;
      const credits = `<div class="kpi-grid">`
        + KpiTile('💳 Crédits vendus', svFmt(grantedReal), `≈ ${svHours(grantedReal)} h de voix`)
        + KpiTile('🎧 Heures écoutées', `${svHours(usedReal)} h`, `${svFmt(usedReal)} crédits consommés`)
        + KpiTile('🔋 Crédits restants', svFmt(remReal), 'chez les clients payants')
        + KpiTile('🔑 Clés', `${activeReal} active(s)`, `${revokedReal} révoquée(s) · ${internal} interne(s)`)
        + `</div>`;

      const sorted = list.slice().sort((a, b) => String(b.lastUsed || b.created || '').localeCompare(String(a.lastUsed || a.created || '')));
      const rows = sorted.length ? sorted.map(c => {
        const badge = svIsInternal(c.email) ? '<span class="badge">interne/test</span>'
          : c.revoked ? '<span class="badge rev">Révoqué</span>' : '<span class="badge pro">Client</span>';
        return `<div class="sv-row"><div class="sv-row-main"><span class="sv-email">${safeText(c.email || '—')}</span> ${badge}</div>`
          + `<div class="sv-row-meta">🔋 ${svFmt(c.creditsRemaining)} restants · 🎧 ${svHours(c.creditsUsed)} h écoutées · 💳 ${svFmt(c.creditsGranted)} vendus · créé ${swpFmtDate(c.created)} · vu ${swpFmtRelative(c.lastUsed)}</div></div>`;
      }).join('') : '<div class="empty">Aucune clé StoryVoice pour le moment.</div>';

      return `<section class="section"><div class="section-head"><h2>🎭 Conversion &amp; revenu</h2></div>${money}</section>`
        + `<section class="section"><div class="section-head"><h2>Crédits de voix &amp; écoute</h2></div>${credits}</section>`
        + `<section class="section"><div class="section-head"><h2>Détail clients · clés internes/test exclues du revenu</h2></div>${rows}</section>`
        + `<div class="acq-when">Source : /admin/sv/overview · généré ${data.generatedAt ? swpFmtRelative(data.generatedAt) : ''}</div>`;
    }

    // === P3b1 — Vue DictoKey : Overview + Play Store + Infra (devices/charts/Firebase/advanced = lots suivants) ===
    function renderDkView(payload) {
      if (!payload || !payload.mon) return EmptyState('DictoKey', 'Aucune donnée reçue du gateway.');
      const { mon, stats, dev, visit, click, play, fb } = payload;
      const ds = dkDeviceStats(dev);
      // Devices triés par lastSeen desc (comme la prod). Les filtres/la page sont conservés entre les rendus.
      dkDevState.all = ds.devicesList.slice().sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));
      dkApplyDeviceFilters(false);

      // --- Trend bar : requêtes + utilisateurs actifs (mobile only) + churn
      const rc = dkPctChange(mon.trend.requests.today, mon.trend.requests.yesterday);
      const dauDaily = (mon.dau && mon.dau.daily) || [];
      const dauToday = dauDaily.length > 0 ? ((dauDaily[0].by_platform && dauDaily[0].by_platform.mobile) || 0) : 0;
      const dauYesterday = dauDaily.length > 1 ? ((dauDaily[1].by_platform && dauDaily[1].by_platform.mobile) || 0) : 0;
      const dc = dkPctChange(dauToday, dauYesterday);
      const trend = `<div class="trend-bar">`
        + `<div class="trend-item"><span class="trend-label">Requêtes</span><span class="trend-val">${mon.trend.requests.today}</span><span class="change ${rc.cls}">${safeText(rc.text)}</span></div>`
        + `<div class="trend-item"><span class="trend-label">Utilisateurs actifs</span><span class="trend-val">${dauToday}</span><span class="change ${dc.cls}">${safeText(dc.text)}</span></div>`
        + `<div class="trend-item"><span class="trend-label">Churn</span><span class="trend-val churn-info"><span class="up">↑ ${mon.churn.upgrades}</span> / <span class="down">↓ ${mon.churn.downgrades}</span></span></div>`
        + `</div>`;

      // --- KPI hero « Appareils réels actifs » : Play Console prioritaire, sinon fallback cumul KV.
      // v1.10.0 : quand la source est Play, le breakdown pro/premium/free n'est PLUS affiché ici — retrancher
      // des cumuls KV d'un stock Play est mathématiquement fallacieux. Le breakdown reste dans « Appareils » (P3b2).
      const psActive = (play && play.aggregated && play.aggregated.active_devices_net) || null;
      let heroVal, heroSub;
      if (psActive && psActive > 0) {
        heroVal = psActive;
        const snapAge = dkDaysSinceUtc(play.aggregated.last_data_date);
        heroSub = play.aggregated.last_data_date
          ? `snapshot Google au ${dkPlayDate(play.aggregated.last_data_date)}${snapAge !== null ? ` (J-${snapAge})` : ''}`
          : 'snapshot Google';
      } else {
        heroVal = ds.devicesList.length - ds.phantomCount;
        const parts = [];
        if (ds.tierCounts.pro > 0) parts.push(`${ds.tierCounts.pro} pro`);
        if (ds.totalPremium > 0) parts.push(`💎 ${ds.totalPremium}`);
        const realFree = ds.effectiveFree - ds.phantomCount;
        if (realFree > 0) parts.push(`${realFree} free`);
        heroSub = parts.join(' · ') + (ds.phantomCount > 0 ? ` (+${ds.phantomCount} fant${ds.phantomCount > 1 ? 'ômes' : 'ôme'})` : '') + ' · cumul KV';
      }
      const heroTile = `<article class="kpi-tile"><div class="kpi-label">Appareils réels actifs</div><div class="kpi-value">${safeText(heroVal)}</div><div class="kpi-note">${safeText(heroSub)}</div><div class="kpi-note">⚡ +${ds.newDevicesToday} aujourd’hui (KV live)</div></article>`;

      let dauSub = '';
      if (dauDaily.length > 0) {
        let sum = 0, max = 0;
        dauDaily.forEach(d => { const c = (d.by_platform && d.by_platform.mobile) || 0; sum += c; if (c > max) max = c; });
        dauSub = `moy. ${Math.round(sum / dauDaily.length)} / pic ${max}`;
      }
      const today = (stats.stats && stats.stats.today) || {};
      const ecm = (stats.stats && stats.stats.estimated_cost_month) || {};
      const kpis = `<div class="kpi-grid">${heroTile}`
        + KpiTile('Actifs aujourd’hui', dauToday, dauSub)
        + KpiTile('Dictées aujourd’hui', today.transcriptions || 0, `+${today.rewrites || 0} réécr. +${today.corrections || 0} corr. +${today.translations || 0} trad.`)
        + KpiTile('Coût du mois', ecm.total || '$0.00', `W:${ecm.whisper || ecm.groq_whisper || '—'} L:${ecm.llm || ecm.groq_llm || '—'} A:${ecm.azure || ecm.azure_translate || '—'}`)
        + `</div>`;

      // --- Bandeau « Premium runtime non-syncé KV » : pattern NORMAL app < v2.61.4, PAS un incident.
      // /admin/set-tier INTERDIT (créerait un Premium gratuit à vie en cas de résiliation).
      const nowMs = Date.now(), sevenDaysMs = 7 * 86400 * 1000;
      const activeSilent = ds.devicesList.filter(d => {
        if (d.effectiveTier !== 'premium') return false;
        if ((d.tier || 'free').toLowerCase() !== 'free') return false;
        const req30d = parseInt(d.reqCount30d || d.requests30d || 0, 10) || 0;
        const lastSeenMs = d.lastSeen ? new Date(d.lastSeen).getTime() : 0;
        return req30d > 0 || (lastSeenMs ? (nowMs - lastSeenMs) : Infinity) < sevenDaysMs;   // exclut les artefacts
      });
      const silent = activeSilent.length ? `<div class="alert-list">${Alert('attention', `${activeSilent.length} Premium runtime non-syncé KV`,
        `${activeSilent.map(d => `${(d.deviceId || '').slice(0, 8).toUpperCase()}${d.country ? ' ' + d.country : ''}${(parseInt(d.reqCount30d || d.requests30d || 0, 10) || 0) > 0 ? ` (${parseInt(d.reqCount30d || d.requests30d || 0, 10)} req/30j)` : ''}`).join(' · ')} — pattern normal pour app < v2.61.4 (Premium fonctionnel via header X-Premium), auto-corrigé au prochain auto-update. Pas un incident.`)}</div>` : '';

      // --- Funnel site : le taux global retranche la baseline (tracking clics démarré après le compteur visites) ;
      // le taux « auj. » ne l'applique PAS → les deux ne sont pas comparables (piège hérité du prod).
      const sv = visit.total || 0, svToday = visit.today || 0, sc = click.total || 0, scToday = click.today || 0;
      const trackedVisits = Math.max(0, sv - TRACKING_BASELINE_VISITS);
      const rate = trackedVisits > 0 ? ((sc / trackedVisits) * 100).toFixed(1) : '0.0';
      const rateToday = svToday > 0 ? ((scToday / svToday) * 100).toFixed(1) : '0.0';
      const btn = click.by_btn || {};
      const btnParts = [];
      ['hero', 'pricing', 'nav', 'cta', 'sticky'].forEach(k => { if (btn[k]) btnParts.push(`${k} ${btn[k]}`); });
      const siteFunnel = `<div class="kpi-grid">`
        + KpiTile('Visites site', sv.toLocaleString('fr-FR'), `auj. +${svToday}`)
        + KpiTile('Clics Play Store', sc.toLocaleString('fr-FR'), btnParts.length ? btnParts.join(' · ') : `auj. +${scToday}`)
        + KpiTile('Taux clic site → Play', `${rate}%`, `auj. ${rateToday}%`)
        + `</div>`;

      // --- Play Store
      const a = play && play.aggregated;
      let psHtml;
      if (a) {
        const num = v => typeof v === 'number' ? v.toLocaleString('fr-FR') : (v || '—');
        const pubDate = a.publication_date ? new Date(a.publication_date + 'T00:00:00Z').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : 'publication';
        const snapAge = dkDaysSinceUtc(a.last_data_date);
        const snapLabel = a.last_data_date ? `snapshot au ${dkPlayDate(a.last_data_date)}${snapAge !== null ? ` (J-${snapAge})` : ''}` : 'snapshot Google';
        const lostPct = a.installs_cumulative > 0 ? Math.round(a.lost_total / a.installs_cumulative * 100) : 0;
        const winLabel = (a.window_first_date && a.window_last_date) ? `du ${dkPlayDate(a.window_first_date)} au ${dkPlayDate(a.window_last_date)}` : 'fenêtre 28 j';
        const stale = (snapAge !== null && snapAge > 3)
          ? `<div class="alert-list dk-stale">${Alert('attention', 'Données Play Console figées', `au ${dkPlayDate(a.last_data_date)} (J-${snapAge}). Google n’a pas encore publié de CSV plus récent. Les KPI ci-dessous reflètent ce snapshot, pas l’état actuel.`)}</div>` : '';
        psHtml = stale
          + `<div class="acq-sub">🎯 Adoption globale (depuis publication)</div><div class="kpi-grid">`
          + KpiTile('📥 Installations totales', num(a.installs_cumulative || '—'), `depuis ${pubDate}`)
          + KpiTile('📱 Appareils actifs', num(a.active_devices_net || '—'), snapLabel)
          + KpiTile('🚪 Pertes', num(a.lost_total != null ? a.lost_total : '—'), a.installs_cumulative > 0 ? `= ${lostPct}% des installs` : '= installs − actifs')
          + `</div><div class="acq-sub dk-sub2">📈 Activité — fenêtre 28 jours</div><div class="kpi-grid">`
          + KpiTile('👁 Visiteurs fiche', num(a.store_visitors_28d || '—'), winLabel)
          + KpiTile('⬇ Installs', num(a.installs_28d || '—'), winLabel)
          + KpiTile('🎯 Conversion fiche', `${(a.conversion_rate_28d || 0).toFixed(1)} %`, winLabel)
          + KpiTile('⭐ Note moyenne', (a.rating_avg || 0).toFixed(2), a.rating_count != null ? `${a.rating_count} avis` : 'note globale (toutes périodes)')
          + `</div>`;
      } else {
        psHtml = `<div class="kpi-grid">` + ['📥 Installations totales', '📱 Appareils actifs', '🚪 Pertes', '👁 Visiteurs fiche', '⬇ Installs', '🎯 Conversion fiche', '⭐ Note moyenne'].map(l => KpiTile(l, '⏳', 'En attente activation')).join('') + `</div>`;
      }

      // --- Infra : erreurs (conditionnel) + coûts
      const errHtml = (mon.errors && mon.errors.total > 0)
        ? `<div class="acq-sub">Erreurs récentes</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Endpoint</th><th>Message</th></tr></thead><tbody>`
          + (mon.errors.recent || []).map(e => `<tr><td>${safeText(dkFmtDateTime(e.date || e.timestamp || e.ts))}</td><td>${safeText(e.endpoint || '—')}</td><td>${safeText(e.message || e.error || (e.status ? 'HTTP ' + e.status : '—'))}</td></tr>`).join('')
          + `</tbody></table></div><div class="acq-sub dk-sub2">Coûts estimés ce mois</div>` : `<div class="acq-sub">Coûts estimés ce mois</div>`;
      const parseCost = v => parseFloat(String(v || '0').replace('$', '')) || 0;
      const costs = [{ label: 'Groq Whisper', value: parseCost(ecm.groq_whisper) }, { label: 'Groq LLM', value: parseCost(ecm.groq_llm) }, { label: 'Azure Translate', value: parseCost(ecm.azure_translate) }];
      const maxCost = Math.max(...costs.map(c => c.value), 0.001);
      const costBars = `<div class="cost-list">` + costs.map((c, i) => `<div class="cost-row"><span class="cost-label">${safeText(c.label)}</span><div class="cost-bar-bg"><i class="c${i}" style="width:${Math.max((c.value / maxCost) * 100, 2)}%"></i></div><span class="cost-amount">$${c.value.toFixed(2)}</span></div>`).join('')
        + `</div><div class="cost-total">Total ce mois : $${parseCost(ecm.total).toFixed(2)}</div>`;

      // --- Jauges de latence par endpoint (statut = couleur + mot, jamais la couleur seule)
      const latSummary = (mon.latency && mon.latency.summary) || {};
      const latEps = Object.keys(latSummary);
      const gauges = latEps.length === 0
        ? '<div class="no-data">Pas encore de données latence</div>'
        : `<div class="gauge-grid">` + latEps.map(ep => {
            const d = latSummary[ep], p50 = d.p50 || 0, p95 = d.p95 || 0;
            const cls = p50 < 1000 ? 'g-good' : p50 < 3000 ? 'g-warn' : 'g-crit';
            const word = p50 < 1000 ? 'Rapide' : p50 < 3000 ? 'Moyen' : 'Lent';
            return `<article class="gauge ${cls}"><div class="gauge-head"><span class="gauge-label">${safeText(DK_EP_LABELS[ep] || ep)}</span><span class="gauge-state">${word}</span></div>`
              + `<div class="gauge-value">${(p50 / 1000).toFixed(2)}s</div>`
              + `<div class="gauge-bar"><i style="width:${Math.min((p50 / 5000) * 100, 100)}%"></i></div>`
              + `<div class="gauge-sub">P95 ${(p95 / 1000).toFixed(2)}s · avg ${((d.avg || 0) / 1000).toFixed(2)}s · max ${((d.max || 0) / 1000).toFixed(2)}s</div></article>`;
          }).join('') + `</div>`;
      const perf = gauges + `<div class="chart-title dk-sub2">Latence P50 quotidienne</div><div class="chart-box"><canvas id="dk-chart-latency"></canvas></div>`;
      const activity = `<div class="chart-title">Utilisateurs actifs quotidiens</div><div class="chart-box"><canvas id="dk-chart-dau"></canvas></div>`
        + `<div class="chart-title dk-sub2">Activité quotidienne</div><div class="chart-box"><canvas id="dk-chart-activity"></canvas></div>`;
      const donuts = `<div class="donut-grid"><div><div class="chart-title">Langues dictées</div><div class="chart-box donut"><canvas id="dk-chart-lang"></canvas></div></div>`
        + `<div><div class="chart-title">Top pays actifs</div><div class="chart-box donut"><canvas id="dk-chart-country"></canvas></div></div></div>`;

      return trend + silent
        + `<section class="section">${kpis}</section>`
        + `<section class="section">${Panel('dk-site', '🌐 Funnel site → Play Store', siteFunnel, true)}</section>`
        + `<section class="section">${Panel('dk-play', '📥 Play Store — adoption & activité', psHtml, true)}</section>`
        + `<section class="section">${Panel('dk-activity', '📈 Activité', activity, true)}</section>`
        + `<section class="section">${Panel('dk-perf', '⚡ Performance API', perf, false)}</section>`
        + `<section class="section">${Panel('dk-split', '🌍 Répartition', donuts, false)}</section>`
        + `<section class="section">${Panel('dk-fb', '📊 Activation & engagement (Firebase J-1)', renderDkFirebase(fb), false)}</section>`
        + `<section class="section">${Panel('dk-adoption', '📈 Adoption refonte v2.61', renderDkAdoption(fb), false)}</section>`
        + `<section class="section">${Panel('dk-attr', '🎯 Attribution install & signaux v2.61.7', renderDkAttribution(fb), false)}</section>`
        + `<section class="section">${Panel('dk-adv', '🔄 Rétention & usage', renderDkAdvanced(mon.advanced), false)}</section>`
        + `<section class="section">${Panel('dk-churn', '💱 Mouvements de tier', renderDkChurn(mon.churn, fb), false)}</section>`
        + `<section class="section">${Panel('dk-devices', '📱 Appareils enregistrés', dkRenderDevicesSection(ds), true)}</section>`
        + `<section class="section">${Panel('dk-infra', '🛠 Infra — erreurs & coûts', errHtml + costBars, false)}</section>`
        + `<section class="section">${Panel('dk-todo', '⏳ Section restante', '<p>Panneau détail par appareil (expand) — lot P3b2b.</p>', false)}</section>`;
    }

    // === P3b2 — Section « Appareils enregistrés » (summary + filtres + recherche + tableau paginé) ===
    function dkRenderDevicesSection(ds) {
      // Summary — répartition complète : pro + premium + free = realCount (les fantômes sont hors realCount).
      const realCount = ds.devicesList.length - ds.phantomCount;
      const realFreeCount = ds.effectiveFree - ds.phantomCount;
      const sumParts = [`${ds.tierCounts.pro} pro`];
      if (ds.totalPremium > 0) sumParts.push(`💎 ${ds.totalPremium} premium`);
      sumParts.push(`${realFreeCount} free`);
      let summaryText = `${realCount} appareil${realCount > 1 ? 's' : ''} — ${sumParts.join(', ')}`;
      if (ds.phantomCount > 0) summaryText += ` — ${ds.phantomCount} fantôme${ds.phantomCount > 1 ? 's' : ''} (free, 0 req)`;
      if (ds.totalPremium === 0) summaryText += ' — Premium Google : voir Play Console';
      summaryText += ` — ⚡ +${ds.newDevicesToday} aujourd’hui`;

      // Compteurs des pills = sur allDevices (NON filtré), comme la prod.
      const counts = { pro: 0, premium: 0, free: 0 };
      (dkDevState.all || []).forEach(d => { counts[dkDeviceCategory(d)]++; });
      const pills = ['pro', 'premium', 'free'].map(t =>
        `<button class="tier-pill${dkDevState.filters[t] ? ' active' : ''}" type="button" data-tier="${t}">${t} <b>${counts[t]}</b></button>`).join('');

      const start = dkDevState.page * DK_PER_PAGE;
      const end = Math.min(start + DK_PER_PAGE, dkDevState.filtered.length);
      const page = dkDevState.filtered.slice(start, end);
      let body, pageInfo, prevDis, nextDis, pagiHidden;
      if (dkDevState.filtered.length === 0) {
        const noTier = !dkDevState.filters.pro && !dkDevState.filters.premium && !dkDevState.filters.free;

        + `<div class="dev-pagi"${pagiHidden ? ' hidden' : ''}><button class="button" type="button" data-dev-page="prev"${prevDis ? ' disabled' : ''}>← Précédent</button>`

      const alertList = alerts.length

    function renderPlaceholder(app) { const tokenHint = app.auth === 'token' ? 'Cette vue restera token-gated au branchement des données.' : 'Cette vue utilisera uniquement ses données publiques au branchement.'; return `<section class="placeholder"><div class="placeholder-inner"><span class="placeholder-icon" aria-hidden="true">◌</span><h2>${safeText(app.name)} — vue prête au branchement</h2><p>${safeText(tokenHint)} Le socle P0 ne déclenche aucune requête réseau.</p></div></section><section class="section">${Panel(`architecture-${app.key}`, 'Contrat de données préparé', `<p>Config déclarative disponible dans <code>APPS[]</code> : authentification, endpoints et sections. Le rendu métier sera ajouté dans le lot dédié.</p>`, true)}</section>`; }
    // ── P4 / Factory — rendu ────────────────────────────────────────────────────
    const facDash = '<span class="fac-dash">—</span>';
    function facFmt(n) { return n == null ? facDash : safeText(String(n)); }
    function facPct(num, den) { return (num == null || !den || den <= 0) ? facDash : `${Math.round((num / den) * 1000) / 10}%`; }
    function facTodaySub(o) { return (!o || o.today == null || o.today <= 0) ? '' : `+${o.today} auj.`; }
    function facMetric(label, valHtml, sub, cls) {
      return `<div class="fac-metric ${cls || ''}"><div class="fac-m-label">${label}</div><div class="fac-m-val">${valHtml}</div>${sub ? `<div class="fac-m-sub">${safeText(sub)}</div>` : ''}</div>`;
    }
    function renderFactoryView(data) {
      const accounts = (data && data.accounts) || [];
      const visits = (data && data.visits) || [];
      // Pas de token au moment du fetch → on IGNORE les stats, même présentes en cache : sans source branchée,
      // afficher d'anciennes ventes comme fraîches est un mensonge (bug prod : token live vs stats du cache).
      const stats = (data && data.hadToken && data.stats && data.stats.accounts) ? data.stats.accounts : {};
      const hasStats = !!(data && data.hadToken && data.stats);
      const cards = accounts.map((a, i) => {
        if (a.placeholder) {
          return `<article class="fac-card placeholder"><div class="fac-card-head"><div class="fac-num">${a.n}</div><div class="fac-head-text"><div class="fac-name">${safeText(a.name)}<span class="fac-badges"><span class="fac-badge soon">${safeText(FACTORY_PHASE_LABELS.soon)}</span>${a.bilingual ? '<span class="fac-badge bil">EN+FR</span>' : ''}</span></div></div></div><div class="fac-placeholder-body">${safeText(a.note || 'Emplacement réservé.')}</div></article>`;
        }
        const v = visits[i] || {};
        const visO = v.visits, buyO = v.buy, dlO = v.dl;
        const visTotal = visO ? visO.total : null;
        const buyTotal = buyO ? buyO.total : null;
        const dlTotal = dlO ? dlO.total : null;
        const st = stats[a.id] || {};
        const sales = st.sales != null ? st.sales : null;
        const revenue = st.revenue != null ? st.revenue : null;
        const currency = st.currency || 'EUR';
        const subs = st.subs != null ? st.subs : null;
        const phaseKey = a.phase || 'soon';
        const phaseLabel = FACTORY_PHASE_LABELS[phaseKey] || phaseKey;
        const dotCls = phaseKey === 'posting' ? 'post' : (phaseKey === 'warm-up' ? 'warm' : 'soon');
        const metricsHtml =
          facMetric('👁 Visites', facFmt(visTotal), facTodaySub(visO), '') +
          facMetric('🛒 Clics achat', a.instrumented ? facFmt(buyTotal) : facDash, a.instrumented ? facTodaySub(buyO) : 'non instrumenté', a.instrumented ? '' : 'muted') +
          facMetric('⬇ Téléchargements', a.instrumented ? facFmt(dlTotal) : facDash, a.instrumented ? facTodaySub(dlO) : 'non instrumenté', a.instrumented ? '' : 'muted') +
          facMetric('📨 Abonnés', facFmt(subs), subs == null ? 'MailerLite · non branché' : 'MailerLite · cumul', subs == null ? 'muted' : '') +
          facMetric('💳 Ventes ebook', facFmt(sales), a.lemonProductId ? (sales == null ? 'LemonSqueezy · non branché' : 'LemonSqueezy · cumul') : 'pas d’ebook', sales == null ? 'muted' : '') +
          facMetric('💶 Revenu', revenue != null ? `${safeText(String(revenue))} ${safeText(currency)}` : facDash, '', `revenue${revenue == null ? ' muted' : ''}`);
        let convHtml = '';
        if (a.instrumented) {
          // Visite→clic et Visite→dl comparent deux compteurs de la MÊME source, même fenêtre : ils sont sains.
          // Visite→vente NON : les ventes sont cumulées depuis toujours, les visites repartent du 25/06 → le taux est

          convHtml = `<div class="fac-conv"><span>Visite→clic : <b>${facPct(buyTotal, visTotal)}</b></span><span>Visite→dl : <b>${facPct(dlTotal, visTotal)}</b></span>${sales != null ? `<span class="fac-conv-warn" title="Ventes cumulées depuis la création du produit ÷ visites depuis le ${FACTORY_VISITS_SINCE} — deux fenêtres différentes, taux surévalué.">Visite→vente : <b>${facPct(sales, visTotal)}</b> <span class="fac-warn-ic">⚠ fenêtres mixtes</span></span>` : ''}</div>`;
        }
