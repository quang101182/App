      const today = (stats.stats && stats.stats.today) || {};
      const ecm = (stats.stats && stats.stats.estimated_cost_month) || {};
      const kpis = `<div class="kpi-grid">${heroTile}`
        + KpiTile('Actifs aujourd’hui', dauToday, dauSub)
        + KpiTile('Dictées aujourd’hui', today.transcriptions || 0, `+${today.rewrites || 0} réécr. +${today.corrections || 0} corr. +${today.translations || 0} trad.`)
        + KpiTile('Coût du mois', ecm.total || '$0.00', `W:${ecm.whisper || ecm.groq_whisper || '—'} L:${ecm.llm || ecm.groq_llm || '—'} A:${ecm.azure || ecm.azure_translate || '—'}`)
        + `</div>`;

      // --- Bandeau « Premium runtime non-syncé KV » : pattern NORMAL app < v2.61.4, PAS un incident.
      // /admin/set-tier INTERDIT (créerait un Premium gratuit à vie en cas de résiliation).
      const nowMs = Date.now(), sevenDaysMs = 7 * 86400 * 1000;
      const activeSilent = ds.devicesList.filter(d => {
        if (d.effectiveTier !== 'premium') return false;
        if ((d.tier || 'free').toLowerCase() !== 'free') return false;
        const req30d = parseInt(d.reqCount30d || d.requests30d || 0, 10) || 0;
        const lastSeenMs = d.lastSeen ? new Date(d.lastSeen).getTime() : 0;
        return req30d > 0 || (lastSeenMs ? (nowMs - lastSeenMs) : Infinity) < sevenDaysMs;   // exclut les artefacts
      });
      const silent = activeSilent.length ? `<div class="alert-list">${Alert('attention', `${activeSilent.length} Premium runtime non-syncé KV`,
        `${activeSilent.map(d => `${(d.deviceId || '').slice(0, 8).toUpperCase()}${d.country ? ' ' + d.country : ''}${(parseInt(d.reqCount30d || d.requests30d || 0, 10) || 0) > 0 ? ` (${parseInt(d.reqCount30d || d.requests30d || 0, 10)} req/30j)` : ''}`).join(' · ')} — pattern normal pour app < v2.61.4 (Premium fonctionnel via header X-Premium), auto-corrigé au prochain auto-update. Pas un incident.`)}</div>` : '';

      // --- Funnel site : le taux global retranche la baseline (tracking clics démarré après le compteur visites) ;
      // le taux « auj. » ne l'applique PAS → les deux ne sont pas comparables (piège hérité du prod).
      const sv = visit.total || 0, svToday = visit.today || 0, sc = click.total || 0, scToday = click.today || 0;
      const trackedVisits = Math.max(0, sv - TRACKING_BASELINE_VISITS);
      const rate = trackedVisits > 0 ? ((sc / trackedVisits) * 100).toFixed(1) : '0.0';
      const rateToday = svToday > 0 ? ((scToday / svToday) * 100).toFixed(1) : '0.0';
      const btn = click.by_btn || {};
      const btnParts = [];
      ['hero', 'pricing', 'nav', 'cta', 'sticky'].forEach(k => { if (btn[k]) btnParts.push(`${k} ${btn[k]}`); });
      const siteFunnel = `<div class="kpi-grid">`
        + KpiTile('Visites site', sv.toLocaleString('fr-FR'), `auj. +${svToday}`)
        + KpiTile('Clics Play Store', sc.toLocaleString('fr-FR'), btnParts.length ? btnParts.join(' · ') : `auj. +${scToday}`)
        + KpiTile('Taux clic site → Play', `${rate}%`, `auj. ${rateToday}%`)
        + `</div>`;

      // --- Play Store
      const a = play && play.aggregated;
      let psHtml;
      if (a) {
        const num = v => typeof v === 'number' ? v.toLocaleString('fr-FR') : (v || '—');
        const pubDate = a.publication_date ? new Date(a.publication_date + 'T00:00:00Z').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : 'publication';
        const snapAge = dkDaysSinceUtc(a.last_data_date);
        const snapLabel = a.last_data_date ? `snapshot au ${dkPlayDate(a.last_data_date)}${snapAge !== null ? ` (J-${snapAge})` : ''}` : 'snapshot Google';
        const lostPct = a.installs_cumulative > 0 ? Math.round(a.lost_total / a.installs_cumulative * 100) : 0;
        const winLabel = (a.window_first_date && a.window_last_date) ? `du ${dkPlayDate(a.window_first_date)} au ${dkPlayDate(a.window_last_date)}` : 'fenêtre 28 j';
        const stale = (snapAge !== null && snapAge > 3)
          ? `<div class="alert-list dk-stale">${Alert('attention', 'Données Play Console figées', `au ${dkPlayDate(a.last_data_date)} (J-${snapAge}). Google n’a pas encore publié de CSV plus récent. Les KPI ci-dessous reflètent ce snapshot, pas l’état actuel.`)}</div>` : '';
        psHtml = stale
          + `<div class="acq-sub">🎯 Adoption globale (depuis publication)</div><div class="kpi-grid">`
          + KpiTile('📥 Installations totales', num(a.installs_cumulative || '—'), `depuis ${pubDate}`)
          + KpiTile('📱 Appareils actifs', num(a.active_devices_net || '—'), snapLabel)
          + KpiTile('🚪 Pertes', num(a.lost_total != null ? a.lost_total : '—'), a.installs_cumulative > 0 ? `= ${lostPct}% des installs` : '= installs − actifs')
          + `</div><div class="acq-sub dk-sub2">📈 Activité — fenêtre 28 jours</div><div class="kpi-grid">`
          + KpiTile('👁 Visiteurs fiche', num(a.store_visitors_28d || '—'), winLabel)
          + KpiTile('⬇ Installs', num(a.installs_28d || '—'), winLabel)
          + KpiTile('🎯 Conversion fiche', `${(a.conversion_rate_28d || 0).toFixed(1)} %`, winLabel)
          + KpiTile('⭐ Note moyenne', (a.rating_avg || 0).toFixed(2), a.rating_count != null ? `${a.rating_count} avis` : 'note globale (toutes périodes)')
          + `</div>`;
      } else {
        psHtml = `<div class="kpi-grid">` + ['📥 Installations totales', '📱 Appareils actifs', '🚪 Pertes', '👁 Visiteurs fiche', '⬇ Installs', '🎯 Conversion fiche', '⭐ Note moyenne'].map(l => KpiTile(l, '⏳', 'En attente activation')).join('') + `</div>`;
      }

      // --- Infra : erreurs (conditionnel) + coûts
      const errHtml = (mon.errors && mon.errors.total > 0)
        ? `<div class="acq-sub">Erreurs récentes</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Endpoint</th><th>Message</th></tr></thead><tbody>`
          + (mon.errors.recent || []).map(e => `<tr><td>${safeText(dkFmtDateTime(e.date || e.timestamp || e.ts))}</td><td>${safeText(e.endpoint || '—')}</td><td>${safeText(e.message || e.error || (e.status ? 'HTTP ' + e.status : '—'))}</td></tr>`).join('')
          + `</tbody></table></div><div class="acq-sub dk-sub2">Coûts estimés ce mois</div>` : `<div class="acq-sub">Coûts estimés ce mois</div>`;
      const parseCost = v => parseFloat(String(v || '0').replace('$', '')) || 0;
      const costs = [{ label: 'Groq Whisper', value: parseCost(ecm.groq_whisper) }, { label: 'Groq LLM', value: parseCost(ecm.groq_llm) }, { label: 'Azure Translate', value: parseCost(ecm.azure_translate) }];
      const maxCost = Math.max(...costs.map(c => c.value), 0.001);
      const costBars = `<div class="cost-list">` + costs.map((c, i) => `<div class="cost-row"><span class="cost-label">${safeText(c.label)}</span><div class="cost-bar-bg"><i class="c${i}" style="width:${Math.max((c.value / maxCost) * 100, 2)}%"></i></div><span class="cost-amount">$${c.value.toFixed(2)}</span></div>`).join('')
        + `</div><div class="cost-total">Total ce mois : $${parseCost(ecm.total).toFixed(2)}</div>`;

      return trend + silent
        + `<section class="section">${kpis}</section>`
        + `<section class="section">${Panel('dk-site', '🌐 Funnel site → Play Store', siteFunnel, true)}</section>`
        + `<section class="section">${Panel('dk-play', '📥 Play Store — adoption & activité', psHtml, true)}</section>`
        + `<section class="section">${Panel('dk-devices', '📱 Appareils enregistrés', dkRenderDevicesSection(ds), true)}</section>`
        + `<section class="section">${Panel('dk-infra', '🛠 Infra — erreurs & coûts', errHtml + costBars, false)}</section>`
        + `<section class="section">${Panel('dk-todo', '⏳ Sections restantes', '<p>Charts &amp; donuts (P3b3) · Firebase / Adoption v2.61 / Attribution (P3b4) · Rétention &amp; mouvements de tier (P3b5) · panneau détail par appareil (P3b2b).</p>', false)}</section>`;
    }

    // === P3b2 — Section « Appareils enregistrés » (summary + filtres + recherche + tableau paginé) ===
    function dkRenderDevicesSection(ds) {
      // Summary — répartition complète : pro + premium + free = realCount (les fantômes sont hors realCount).
      const realCount = ds.devicesList.length - ds.phantomCount;
      const realFreeCount = ds.effectiveFree - ds.phantomCount;
      const sumParts = [`${ds.tierCounts.pro} pro`];
      if (ds.totalPremium > 0) sumParts.push(`💎 ${ds.totalPremium} premium`);
      sumParts.push(`${realFreeCount} free`);
      let summaryText = `${realCount} appareil${realCount > 1 ? 's' : ''} — ${sumParts.join(', ')}`;
      if (ds.phantomCount > 0) summaryText += ` — ${ds.phantomCount} fantôme${ds.phantomCount > 1 ? 's' : ''} (free, 0 req)`;
      if (ds.totalPremium === 0) summaryText += ' — Premium Google : voir Play Console';
      summaryText += ` — ⚡ +${ds.newDevicesToday} aujourd’hui`;

      // Compteurs des pills = sur allDevices (NON filtré), comme la prod.
      const counts = { pro: 0, premium: 0, free: 0 };
      (dkDevState.all || []).forEach(d => { counts[dkDeviceCategory(d)]++; });
      const pills = ['pro', 'premium', 'free'].map(t =>
        `<button class="tier-pill${dkDevState.filters[t] ? ' active' : ''}" type="button" data-tier="${t}">${t} <b>${counts[t]}</b></button>`).join('');

      const start = dkDevState.page * DK_PER_PAGE;
      const end = Math.min(start + DK_PER_PAGE, dkDevState.filtered.length);
      const page = dkDevState.filtered.slice(start, end);
      let body, pageInfo, prevDis, nextDis, pagiHidden;
      if (dkDevState.filtered.length === 0) {
        const noTier = !dkDevState.filters.pro && !dkDevState.filters.premium && !dkDevState.filters.free;
        body = `<tr class="devices-empty-row"><td colspan="4">${noTier ? 'Aucun tier sélectionné — <a href="#" data-tier-reset="1">Tout réactiver</a>' : 'Aucun appareil ne correspond aux filtres'}</td></tr>`;
        pageInfo = '0 / 0 (0 appareil)'; prevDis = true; nextDis = true; pagiHidden = true;
      } else {
        body = page.map(d => {
          const did = d.deviceId || 'inconnu';
          const id = did.length > 12 ? did.slice(0, 12) + '...' : did;
          const kvTier = d.tier || 'free';
          const effective = d.effectiveTier || null;
          const displayTier = effective || kvTier;
          const showSubTier = effective && effective !== kvTier;
          const tierCls = displayTier === 'pro' ? 'b-pro'
            : displayTier === 'premium' ? (effective === 'premium' && kvTier !== 'premium' ? 'b-prem b-prem-rt' : 'b-prem') : 'b-free';
          const isPhantom = dkIsPhantom(d);
          // 3 sous-lignes FIXES (drapeau+pays+version / modèle / Android) → hauteur uniforme, pas de wrap.
          // '—' si donnée absente (app < v2.60.0 n'envoyait ni deviceModel ni androidVersion).
          const l1 = [];
          if (d.country && d.country !== '—') l1.push(dkCountryFlag(d.country) + safeText(d.country));
          if (d.appVersion) l1.push('v' + safeText(d.appVersion));
          const idCell = `<div>${safeText(id)}${isPhantom ? ' <span class="phantom-tag">FANTOME</span>' : ''}</div>`
            + (l1.length ? `<div class="id-sub">${l1.join(' · ')}</div>` : '')
            + `<div class="id-sub">${d.deviceModel ? safeText(d.deviceModel) : '—'}</div>`
            + `<div class="id-sub">${d.androidVersion ? 'A' + safeText(d.androidVersion) : '—'}</div>`;
          const tierCell = `<span class="badge ${tierCls}">${safeText(displayTier === 'premium' ? 'prem' : displayTier)}</span>`
            + (showSubTier ? `<div class="tier-kv-sub">KV: ${safeText(kvTier)}</div>` : '');
          return `<tr class="dev-row${isPhantom ? ' is-phantom' : ''}" title="${safeText(did)}"><td>${idCell}</td><td>${tierCell}</td>`
            + `<td>${dkDateStack(d.createdAt)}</td><td>${dkRelativeTime(d.lastSeen)}<div class="time-sub">${dkTimeOnly(d.lastSeen)}</div></td></tr>`;
        }).join('');
        const totalPages = Math.ceil(dkDevState.filtered.length / DK_PER_PAGE);
        const n = dkDevState.filtered.length;
        pageInfo = `${dkDevState.page + 1} / ${Math.max(totalPages, 1)} (${n} appareil${n > 1 ? 's' : ''})`;
        prevDis = dkDevState.page === 0;
        nextDis = end >= dkDevState.filtered.length;
        pagiHidden = dkDevState.filtered.length <= DK_PER_PAGE;
      }

      return `<div class="dev-summary" id="dk-dev-summary">${safeText(summaryText)}</div>`
        + `<div class="dev-controls"><input type="search" id="dk-dev-search" placeholder="Rechercher (id, tier, pays…)" value="${safeText(dkDevState.search)}" autocomplete="off"><div class="tier-pills">${pills}</div></div>`
        + `<div class="table-wrap"><table class="data-table dev-table"><thead><tr><th>Appareil</th><th>Tier</th><th>Créé</th><th>Vu</th></tr></thead><tbody>${body}</tbody></table></div>`
        + `<div class="dev-pagi"${pagiHidden ? ' hidden' : ''}><button class="button" type="button" data-dev-page="prev"${prevDis ? ' disabled' : ''}>← Précédent</button>`
        + `<span class="dev-page-info">${safeText(pageInfo)}</span>`
        + `<button class="button" type="button" data-dev-page="next"${nextDis ? ' disabled' : ''}>Suivant →</button></div>`;
    }

    function EmptyState(name, message) { return `<section class="placeholder"><div class="placeholder-inner"><span class="placeholder-icon" aria-hidden="true">◌</span><h2>${safeText(name)}</h2><p>${safeText(message)}</p></div></section>`; }
    function TokenGate(app, message) {
      return `<section class="placeholder"><div class="placeholder-inner"><span class="placeholder-icon" aria-hidden="true">🔒</span><h2>${safeText(app.name)} — token requis</h2><p>${safeText(message || 'Cette vue expose des données payantes. Colle le token admin pour y accéder.')}</p>`
        + `<div class="token-form"><input type="password" id="token-input" placeholder="Token admin" autocomplete="off" spellcheck="false"><button class="button" type="button" data-token-save="${app.key}">Enregistrer</button></div></div></section>`;
    }

    // Re-rend UNIQUEMENT le panneau Appareils (filtres/recherche/pagination = zéro requête réseau).
    function dkRefreshDevicesPanel(keepFocus) {
      const host = document.getElementById('dk-devices-content');
      if (!host) return;
      const cached = state.cache.get('dk');
      if (!cached || !cached.dev) return;
      host.innerHTML = dkRenderDevicesSection(dkDeviceStats(cached.dev));
      if (keepFocus) {
        const input = document.getElementById('dk-dev-search');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }

    function renderNavigation() {
      const nav = document.getElementById('navigation');
      const items = family => APPS.filter(app => app.family === family).map(app => `<button class="nav-item" type="button" data-route="${app.key}" ${app.key === state.activeKey ? 'aria-current="page"' : ''}><span class="nav-icon" aria-hidden="true">${app.icon}</span><span>${safeText(app.name)}</span>${app.color ? `<span class="product-dot" style="--product-color:${app.color}" aria-hidden="true"></span>` : ''}</button>`).join('');
      nav.innerHTML = `${items('home')}${Object.keys(FAMILY_LABELS).map(key => `<div class="nav-group">${FAMILY_LABELS[key]}</div>${items(key)}`).join('')}`;
    }
    function renderHome(data) {
      const acq = (data && data.acq) || null;
      const t = acqTotals(acq);
      const alerts = homeAlerts(acq);
      const products = APPS.filter(app => app.family === 'products');
      // Hero : MRR/Actifs exigent les données produit token-gated (lot P3). Visites/Clics = agrégats publics réels.
      // NB « Visites 7j » du mock-up n'est pas réalisable : le compteur public n'expose que total + today (pas de fenêtre 7j).
      const hero = `<div class="kpi-grid">` +
        KpiTile('MRR total', '—', 'Données produit — lot P3') +
        KpiTile('Utilisateurs actifs', '—', 'Données produit — lot P3') +
        KpiTile('Visites sites', t ? t.visites : '—', t ? (t.today > 0 ? `+${t.today} aujourd’hui` : 'tous sites, cumul') : '—') +
        KpiTile('Alertes', t ? alerts.length : '—', alerts.length ? 'à traiter' : 'rien à signaler') +
        `</div>`;
      const funnel = t
        ? `<div class="funnel">${FunnelBar('Visites', t.visites, 100)}${FunnelBar('Engagement (hub)', t.engagement, t.visites ? Math.max(2, Math.round((t.engagement / t.visites) * 100)) : 0)}${FunnelBar(`Clics sortants — ${acqPct(t.sortants, t.visites)} de sortie`, t.sortants, t.visites ? Math.max(2, Math.round((t.sortants / t.visites) * 100)) : 0)}</div>`
        : `<div class="funnel">${FunnelBar('Visites', '—', 100)}${FunnelBar('Engagement (hub)', '—', 0)}${FunnelBar('Clics sortants', '—', 0)}</div>`;
      const alertList = alerts.length
        ? alerts.map(a => Alert(a.level, a.title, a.message)).join('')
        : Alert('attention', 'Alertes produit', 'Churn, snapshot figé et santé backend arrivent avec les données produit (lot P3).');
      return `<section class="section">${hero}</section>` +
        `<section class="section"><div class="section-head"><h2>Produits</h2><a href="#acq">Voir l’acquisition →</a></div><div class="product-grid">${products.map(app => ProductCard(app, acq)).join('')}</div></section>` +
        `<section class="section"><div class="section-head"><h2>Acquisition — funnel global</h2><a href="#acq">Détail →</a></div>${funnel}</section>` +
        `<section class="section"><div class="section-head"><h2>À surveiller</h2></div><div class="alert-list">${alertList}</div></section>`;
    }
    function renderPlaceholder(app) { const tokenHint = app.auth === 'token' ? 'Cette vue restera token-gated au branchement des données.' : 'Cette vue utilisera uniquement ses données publiques au branchement.'; return `<section class="placeholder"><div class="placeholder-inner"><span class="placeholder-icon" aria-hidden="true">◌</span><h2>${safeText(app.name)} — vue prête au branchement</h2><p>${safeText(tokenHint)} Le socle P0 ne déclenche aucune requête réseau.</p></div></section><section class="section">${Panel(`architecture-${app.key}`, 'Contrat de données préparé', `<p>Config déclarative disponible dans <code>APPS[]</code> : authentification, endpoints et sections. Le rendu métier sera ajouté dans le lot dédié.</p>`, true)}</section>`; }
    function renderApp(app, data) {
      const err = state.error.get(app.key);
      let content;
      if (app.auth === 'token' && !getToken(app)) content = TokenGate(app);
      else if (err && /401/.test(err)) content = TokenGate(app, 'Session expirée ou token invalide (401). Colle un token valide.');
      else if (err) content = EmptyState(app.name, `Échec du chargement : ${err}`);
      else if (app.key === 'home') content = renderHome(data);
      else if (app.key === 'acq') content = renderAcq(data);
      else if (app.key === 'swp') content = renderSwpView(data);
      else if (app.key === 'sv') content = renderSvView(data);
      else if (app.key === 'dk') content = renderDkView(data);
      else content = renderPlaceholder(app, data);
      document.getElementById('view-root').innerHTML = `<div class="page-head"><div><h1>${safeText(app.name)} <span class="view-badge">${VERSION}</span></h1><p>${safeText(app.subtitle)}</p></div><button class="button" type="button" data-refresh="${app.key}">↻ Actualiser</button></div>${FreshBar(app)}${content}`;
    }
    async function refresh(key) {
      const cfg = getApp(key);
      if (cfg.auth === 'token' && !getToken(cfg)) { renderApp(cfg, {}); return; }   // pas de token → pas de 401 inutile
      if (state.controller) state.controller.abort();
      state.controller = new AbortController();
      try { state.cache.set(cfg.key, await fetchApp(cfg, state.controller.signal)); state.loadedAt.set(cfg.key, new Date()); state.error.delete(cfg.key); }
      catch (error) { if (error.name !== 'AbortError') state.error.set(cfg.key, error.message || String(error)); }
      finally { state.controller = null; renderApp(cfg, state.cache.get(cfg.key) || {}); }
    }
    function route(key, forceRefresh = false) {
      const cfg = getApp(key);
      if (location.hash !== `#${cfg.key}`) {
        location.hash = cfg.key;
        return;
      }
      state.activeKey = cfg.key;
      renderNavigation();
      if (!state.loadedAt.has(cfg.key) || forceRefresh) refresh(cfg.key); else renderApp(cfg, state.cache.get(cfg.key) || {});
      closeDrawer();
    }
    function openDrawer() { document.getElementById('app-shell').classList.add('drawer-open'); document.getElementById('menu-button').setAttribute('aria-expanded', 'true'); }
    function closeDrawer() { document.getElementById('app-shell').classList.remove('drawer-open'); document.getElementById('menu-button').setAttribute('aria-expanded', 'false'); }
    function onHashChange() { route(location.hash.slice(1) || 'home'); }

    document.addEventListener('click', event => {
      const routeButton = event.target.closest('[data-route]');
      if (routeButton) { route(routeButton.dataset.route); return; }
      const refreshButton = event.target.closest('[data-refresh]');
      if (refreshButton) { refresh(refreshButton.dataset.refresh); return; }
      const tokenButton = event.target.closest('[data-token-save]');
      if (tokenButton) {
        const cfg = getApp(tokenButton.dataset.tokenSave);
        const input = document.getElementById('token-input');
        const value = (input && input.value || '').trim();
        if (!value || !cfg.tokenKey) return;
        localStorage.setItem(cfg.tokenKey, value);
        state.error.delete(cfg.key);
        refresh(cfg.key);
        return;
      }
      const tierPill = event.target.closest('[data-tier]');
      if (tierPill) {
        const t = tierPill.dataset.tier;
        dkDevState.filters[t] = !dkDevState.filters[t];
        dkSaveTierFilters();
        dkApplyDeviceFilters(true);
        dkRefreshDevicesPanel();
        return;
      }
      const tierReset = event.target.closest('[data-tier-reset]');
      if (tierReset) {
        event.preventDefault();
        dkDevState.filters = { pro: true, premium: true, free: true };
        dkSaveTierFilters();
        dkApplyDeviceFilters(true);
        dkRefreshDevicesPanel();
        return;
      }
      const devPage = event.target.closest('[data-dev-page]');
      if (devPage) {
        const totalPages = Math.ceil(dkDevState.filtered.length / DK_PER_PAGE);
        if (devPage.dataset.devPage === 'prev') dkDevState.page = Math.max(0, dkDevState.page - 1);
        else dkDevState.page = Math.min(Math.max(totalPages - 1, 0), dkDevState.page + 1);
        dkRefreshDevicesPanel();
        return;
      }
      const panelButton = event.target.closest('.panel-toggle');
      if (panelButton) { const panel = panelButton.closest('.panel'); const open = panel.dataset.open !== 'true'; panel.dataset.open = String(open); panelButton.setAttribute('aria-expanded', String(open)); }
    });
    document.addEventListener('input', event => {
      if (event.target && event.target.id === 'dk-dev-search') {
        dkDevState.search = event.target.value || '';
        dkApplyDeviceFilters(true);
        dkRefreshDevicesPanel(true);
      }
    });
    document.getElementById('menu-button').addEventListener('click', () => document.getElementById('app-shell').classList.contains('drawer-open') ? closeDrawer() : openDrawer());
    document.getElementById('nav-scrim').addEventListener('click', closeDrawer);
    window.addEventListener('hashchange', onHashChange);
    route(location.hash.slice(1) || 'home');
  </script>
</body>
</html>
