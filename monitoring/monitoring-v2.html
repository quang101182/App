<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Se7en AI — Monitoring v2</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg: #0a0d13;
      --surface: #141a26;
      --surface-raised: #1c2434;
      --surface-soft: #111725;
      --line: rgba(255, 255, 255, .07);
      --line-strong: rgba(255, 255, 255, .15);
      --ink: #e9eef6;
      --ink-muted: #9aa7b8;
      --ink-faint: #68758a;
      --accent: #3aa0ff;
      --dk: #2f80d8;
      --swp: #ec4899;
      --sv: #c77d0a;
      /* Ondine (v2.19.0) — turquoise choisi PAR MESURE, pas à l'œil : contraste 9,36:1 sur --surface,
         et un écart ΔE minimal de 15,4 contre --dk/--swp/--sv en simulation protanopie/deutéranopie/
         tritanopie (Viénot 1999). Le bleu et le cyan sont le piège classique ici : #14b8a6 tombait à
         ΔE 6 en CVD (confondu avec --dk), #2dd4bf tient. Ne pas « harmoniser » sans refaire la mesure. */
      --ondine: #2dd4bf;
      --good: #22c55e;
      --warn: #f5b52e;
      --crit: #ef4444;
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-width: 224px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }

    .sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 18px 12px; overflow-y: auto; background: linear-gradient(180deg, var(--surface-soft), #0e1420); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-size: 1.08rem; font-weight: 800; letter-spacing: .01em; }
    .brand-mark { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #cfe8ff, var(--accent) 55%, #0a2c5c); box-shadow: 0 0 16px rgba(58, 160, 255, .55); }
    .brand-seven { color: var(--accent); }
    .nav-group { margin: 12px 0 4px; padding: 0 12px; color: var(--ink-faint); font-size: .62rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--ink-muted); text-align: left; font-size: .88rem; font-weight: 650; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .nav-item:hover { background: var(--surface-raised); color: var(--ink); }
    .nav-item[aria-current="page"] { border-color: rgba(58, 160, 255, .28); background: rgba(58, 160, 255, .13); color: #d3ebff; }
    .nav-icon { width: 18px; text-align: center; font-size: 1rem; }
    .product-dot { width: 8px; height: 8px; margin-left: auto; border-radius: 50%; background: var(--product-color); box-shadow: 0 0 7px var(--product-color); }
    .side-footer { margin-top: auto; padding: 18px 10px 4px; color: var(--ink-faint); font-size: .67rem; }

    .mobile-bar { position: sticky; top: 0; z-index: 30; display: none; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; background: rgba(20, 26, 38, .96); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    .menu-button { display: inline-grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; }
    .mobile-title { font-weight: 800; }
    .scrim { display: none; }

    main { width: 100%; max-width: 1180px; padding: 26px 30px 64px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .page-head h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.7rem; line-height: 1.15; letter-spacing: -.025em; }
    .page-head p { margin: 4px 0 0; color: var(--ink-muted); font-size: .85rem; }
    .view-badge { padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-muted); font-size: .65rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: .82rem; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .button:hover { border-color: var(--accent); background: var(--surface-raised); }

    .freshbar { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 24px; padding: 9px 13px; border: 1px solid var(--line); border-left: 3px solid var(--fresh-color); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-muted); font-size: .81rem; cursor: pointer; }
    .freshbar:hover { border-color: var(--line-strong); background: var(--surface-raised); }
    /* Données servies depuis le cache disque : le bandeau doit SE VOIR, pas juste porter un liseré. */
    .freshbar[data-fresh="vieillit"] { border-color: rgba(245, 181, 46, .38); background: rgba(245, 181, 46, .07); }
    .freshbar[data-fresh="perime"] { border-color: rgba(239, 83, 80, .42); background: rgba(239, 83, 80, .08); }
    .fresh-dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--fresh-color); box-shadow: 0 0 0 0 var(--fresh-color); }
    .freshbar strong { color: var(--ink); }
    .fresh-action { margin-left: auto; color: var(--accent); font-weight: 700; white-space: nowrap; }

    .placeholder { display: grid; min-height: 290px; place-items: center; padding: 32px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: linear-gradient(145deg, var(--surface), rgba(20, 26, 38, .45)); text-align: center; }
    .placeholder-inner { max-width: 470px; }
    .placeholder-icon { display: block; margin-bottom: 13px; color: var(--accent); font-size: 1.8rem; }
    .placeholder h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .placeholder p { margin: 0; color: var(--ink-muted); }

    .section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
    .section-head a { color: var(--accent); font-size: .78rem; font-weight: 700; text-decoration: none; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .kpi-tile, .product-card, .funnel, .alert, .panel { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .kpi-tile { min-height: 126px; padding: 16px 17px; }
    .kpi-label { color: var(--ink-faint); font-size: .67rem; font-weight: 750; letter-spacing: .065em; text-transform: uppercase; }
    .kpi-value { margin-top: 7px; font-size: 1.82rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 3px; color: var(--ink-muted); font-size: .76rem; }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .product-card { position: relative; overflow: hidden; padding: 18px; color: inherit; text-align: left; cursor: pointer; }
    .product-card::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--product-color); content: ""; }
    .product-card::after { position: absolute; inset: 0 0 auto; height: 80px; background: radial-gradient(115% 100% at 0 0, color-mix(in srgb, var(--product-color) 22%, transparent), transparent 70%); content: ""; pointer-events: none; }
    .product-card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
    .product-name { position: relative; padding-left: 8px; font-size: 1rem; font-weight: 800; }
    .product-meta { position: relative; display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; padding-left: 8px; }
    .product-meta span { display: block; color: var(--ink-faint); font-size: .64rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .product-meta strong { font-size: 1.08rem; }
    .product-meta .pm-item > strong { display: block; margin-top: 3px; color: var(--ink); font-size: 1.08rem; font-variant-numeric: tabular-nums; }
    .product-progress { position: relative; height: 6px; margin: 15px 0 0 8px; overflow: hidden; border-radius: 5px; background: rgba(255, 255, 255, .07); }
    .product-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--product-color); }
    .funnel { padding: 18px; }
    .funnel-step + .funnel-step { margin-top: 13px; }
    .funnel-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: .84rem; }
    .funnel-meta span { color: var(--ink-muted); }
    .funnel-bar { height: 12px; overflow: hidden; border-radius: 7px; background: rgba(58, 160, 255, .09); }
    .funnel-bar i { display: block; width: var(--bar-width); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #7cc0ff); box-shadow: 0 0 12px rgba(58, 160, 255, .35); }
    .alert-list { display: grid; gap: 9px; }
    .alert { display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 11px 14px; border-left: 3px solid var(--alert-color); }
    .alert-badge { padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--alert-color) 16%, transparent); color: var(--alert-color); font-size: .64rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .alert-message { color: var(--ink-muted); font-size: .84rem; }
    .alert-message strong { color: var(--ink); }
    .panel { overflow: hidden; }
    .panel-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; padding: 13px 16px; border: 0; background: transparent; color: var(--ink); text-align: left; font-weight: 750; cursor: pointer; }
    .panel-toggle:hover { background: rgba(255, 255, 255, .025); }
    .panel-chevron { color: var(--accent); transition: transform .16s; }
    .panel[data-open="true"] .panel-chevron { transform: rotate(180deg); }
    .panel-content { display: none; padding: 0 16px 16px; color: var(--ink-muted); font-size: .85rem; }
    .panel[data-open="true"] .panel-content { display: block; }

    .acq-northstar { margin: 0 0 22px; color: var(--ink-muted); font-size: .84rem; line-height: 1.45; }
    .acq-northstar strong { color: var(--ink); }
    .acq-hub { padding: 18px 16px; border: 1px solid rgba(58, 160, 255, .16); border-radius: var(--radius); background: linear-gradient(160deg, rgba(58, 160, 255, .05), var(--surface-soft)); }
    .acq-hub-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .acq-hub-head h3 { margin: 0; font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; }
    .acq-hub-head a { color: var(--accent); text-decoration: none; }
    .acq-hub-desc { margin: 2px 0 16px; color: var(--ink-muted); font-size: .8rem; line-height: 1.45; }
    .acq-recap { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; }
    .acq-sub { margin-bottom: 12px; color: var(--ink-faint); font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .funnel-note { color: var(--ink-faint); font-weight: 400; font-size: .74rem; }
    .funnel-line { display: flex; align-items: center; gap: 10px; }
    .funnel-line .funnel-bar { flex: 1; }
    .funnel-conv { flex: 0 0 auto; min-width: 78px; color: var(--ink-faint); font-size: .76rem; text-align: right; white-space: nowrap; }
    /* `white-space: normal` volontaire : cette note est plus longue qu'un « 42 % », elle doit pouvoir
       revenir à la ligne à 360px au lieu d'élargir la ligne du funnel (= scroll horizontal). */
    .funnel-conv.over { color: var(--ink-muted); white-space: normal; text-align: right; }
    .acq-detail { margin-top: 11px; color: var(--ink-muted); font-size: .8rem; }
    .acq-detail strong { color: var(--ink); }
    .acq-site { position: relative; overflow: hidden; margin-bottom: 14px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .acq-site::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--product-color); content: ""; }
    .acq-site-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 13px; padding-left: 8px; }
    .acq-site-head a { color: var(--product-color); font-size: 1.02rem; font-weight: 800; text-decoration: none; }
    .acq-rate { color: var(--ink-muted); font-size: .77rem; white-space: nowrap; }
    .acq-rate strong { color: var(--ink); font-size: .92rem; }
    .acq-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 12px; padding-left: 8px; }
    .acq-mlabel { display: block; color: var(--ink-faint); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .acq-mvalue { display: block; margin-top: 3px; color: var(--product-color); font-size: 1.32rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .acq-mvalue.acq-out { color: var(--warn); }
    .acq-mnote { display: block; margin-top: 2px; color: var(--ink-muted); font-size: .72rem; }
    .acq-progress { height: 12px; margin-left: 8px; overflow: hidden; border-radius: 6px; background: rgba(58, 160, 255, .09); }
    .acq-progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--product-color), #7cc0ff); }
    .acq-when { margin-top: 12px; color: var(--ink-faint); font-size: .78rem; }

    /* P3 — produits payants */
    .muted { color: var(--ink-faint); }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .78rem; }
    .empty { padding: 18px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--ink-muted); text-align: center; }
    .badge { display: inline-block; padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--ink-muted); font-size: .66rem; font-weight: 750; }
    .badge.pro { border-color: rgba(58,160,255,.4); background: rgba(58,160,255,.12); color: #9fd0ff; }
    .badge.trial { border-color: rgba(245,181,46,.4); background: rgba(245,181,46,.12); color: #f3ce7d; }
    .badge.rev { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.12); color: #f5a3a3; }
    .health { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: .76rem; }
    .health .hdot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
    .health.h-risk .hdot { background: var(--crit); box-shadow: 0 0 6px var(--crit); }
    .health.h-warn .hdot { background: var(--warn); }
    .health.h-ok .hdot { background: var(--good); }
    .health.h-trial .hdot { background: var(--warn); opacity: .6; }
    .health.h-rev .hdot, .health.h-test .hdot { background: var(--ink-faint); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .data-table { width: 100%; border-collapse: collapse; font-size: .8rem; white-space: nowrap; }
    .data-table th { padding: 10px 12px; border-bottom: 1px solid var(--line-strong); color: var(--ink-faint); text-align: left; font-size: .66rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table tr.row-risk td { background: rgba(239, 68, 68, .06); }
    .data-table tr.row-rev td, .data-table tr.row-test td { color: var(--ink-muted); }
    .sv-row { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .sv-row + .sv-row { margin-top: 9px; }
    .sv-row-main { display: flex; align-items: center; gap: 9px; }
    .sv-email { font-weight: 700; }
    .sv-row-meta { margin-top: 5px; color: var(--ink-muted); font-size: .77rem; }
    .token-form { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .token-form input { min-width: 0; flex: 1 1 240px; max-width: 320px; min-height: 40px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: .85rem; }
    .token-form input:focus { border-color: var(--accent); outline: none; }

    /* P3b1 — DictoKey */
    .kpi-value { color: var(--ink); }
    .trend-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .trend-item { display: flex; align-items: baseline; gap: 8px; flex: 1 1 190px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .trend-label { color: var(--ink-faint); font-size: .68rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .trend-val { margin-left: auto; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .change { font-size: .74rem; font-weight: 750; }
    .change.up, .churn-info .up { color: var(--good); }
    .change.down, .churn-info .down { color: var(--crit); }
    .change.neutral { color: var(--ink-faint); }
    .churn-info { font-size: .9rem; }
    .dk-stale { margin-bottom: 14px; }
    .dk-sub2 { margin-top: 20px; }
    .cost-list { display: grid; gap: 9px; }
    .cost-row { display: flex; align-items: center; gap: 12px; }
    .cost-label { flex: 0 0 110px; color: var(--ink-muted); font-size: .8rem; }
    .cost-bar-bg { flex: 1; height: 11px; overflow: hidden; border-radius: 6px; background: rgba(255, 255, 255, .06); }
    .cost-bar-bg i { display: block; height: 100%; border-radius: inherit; }
    .cost-bar-bg i.c0 { background: linear-gradient(90deg, #7c5cff, #a68bff); }
    .cost-bar-bg i.c1 { background: linear-gradient(90deg, var(--accent), #7cc0ff); }
    .cost-bar-bg i.c2 { background: linear-gradient(90deg, var(--good), #6ee7a8); }
    .cost-amount { flex: 0 0 62px; color: var(--ink); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
    .cost-total { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 750; font-size: .84rem; }
    .panel-content .acq-sub:first-child { margin-top: 0; }

    /* P3b3 — Charts & jauges */
    .chart-title { margin-bottom: 10px; color: var(--ink-faint); font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .chart-box { position: relative; height: 260px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .chart-box.donut { height: 230px; }
    .no-data { display: grid; min-height: 90px; place-items: center; color: var(--ink-faint); font-size: .82rem; }
    .donut-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .gauge-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .gauge { padding: 13px 14px; border: 1px solid var(--line); border-left: 3px solid var(--g-color); border-radius: var(--radius-sm); background: var(--surface); }
    .gauge.g-good { --g-color: var(--good); }
    .gauge.g-warn { --g-color: var(--warn); }
    .gauge.g-crit { --g-color: var(--crit); }
    .gauge-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .gauge-label { color: var(--ink-faint); font-size: .68rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .gauge-state { color: var(--g-color); font-size: .66rem; font-weight: 800; }
    .gauge-value { margin: 6px 0 8px; font-size: 1.32rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .gauge-bar { height: 7px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, .07); }
    .gauge-bar i { display: block; height: 100%; border-radius: inherit; background: var(--g-color); }
    .gauge-sub { margin-top: 7px; color: var(--ink-faint); font-size: .68rem; }

    /* P3b5 — Rétention / usage / mouvements de tier */
    .ret-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi-value.r-good { color: var(--good); }
    .kpi-value.r-warn { color: var(--warn); }
    .kpi-value.r-crit { color: var(--crit); }
    .kpi-value.ret-na { color: var(--ink-faint); font-size: .84rem; font-weight: 600; }
    .seg-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .seg { padding: 6px 11px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-muted); font-size: .76rem; }
    .seg b { color: var(--ink); }
    .adopt-list { display: grid; gap: 10px; }
    .adopt-row { display: flex; align-items: center; gap: 12px; }
    .adopt-label { flex: 0 0 92px; color: var(--ink-muted); font-size: .8rem; }
    .adopt-bg { flex: 1; height: 9px; overflow: hidden; border-radius: 5px; background: rgba(255, 255, 255, .06); }
    .adopt-bg i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #7cc0ff); }
    .adopt-info { flex: 0 0 auto; color: var(--ink-faint); font-size: .74rem; font-variant-numeric: tabular-nums; }
    .churn-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; color: var(--ink-muted); font-size: .86rem; line-height: 1.7; }
    .churn-sum b { color: var(--ink); }
    .churn-sum b.up, .up { color: var(--good); }
    .churn-sum b.down, .down { color: var(--crit); }
    .churn-kv { margin-top: 7px; color: var(--ink-faint); font-size: .72rem; }

    /* P3b4 — Firebase / Adoption / Attribution */
    .fb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .fb-card { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .fb-card .chart-title { margin-bottom: 8px; }
    .fb-funnel { padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: .84rem; line-height: 1.85; }
    .fb-funnel .ind { margin-left: 1.2em; }
    .fb-funnel b { color: var(--ink); }
    .badge-row { margin-bottom: 12px; }
    .st-badge { display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: .7rem; font-weight: 800; }
    .st-badge.st-ok { background: rgba(34, 197, 94, .12); color: var(--good); }
    .st-badge.st-wait { background: rgba(245, 181, 46, .12); color: var(--warn); }
    .ai-banner { margin-bottom: 9px; padding: 7px 11px; border-radius: 7px; font-size: .8rem; }
    .ai-banner.on { border: 1px solid rgba(144, 133, 233, .38); background: linear-gradient(135deg, rgba(144, 133, 233, .18), rgba(25, 158, 112, .10)); color: #cfc8ff; font-weight: 650; }
    .ai-banner.off { border: 1px dashed var(--line-strong); background: rgba(255, 255, 255, .03); color: var(--ink-faint); font-size: .75rem; }
    .src-row { padding: 3px 0; color: var(--ink-muted); font-size: .8rem; }
    .src-row b { color: var(--ink); }
    .src-row.is-ai { padding-left: 7px; border-left: 2px solid var(--accent); border-radius: 0 4px 4px 0; background: rgba(58, 160, 255, .08); }
    .big { margin-bottom: 7px; font-size: 1.4rem; font-weight: 800; }
    .big span { color: var(--ink-faint); font-size: .74rem; font-weight: 500; }
    .big.warn { color: var(--warn); }
    .sm { margin-top: 4px; color: var(--ink-muted); font-size: .78rem; }
    .sm b, .lg-row b { color: var(--ink); }
    .sm code { padding: 1px 5px; border-radius: 3px; background: rgba(255, 255, 255, .06); font-size: .9em; }
    .lg-row { margin-top: 5px; color: var(--ink-muted); font-size: .8rem; }
    .sw { display: inline-block; width: 11px; height: 11px; margin-right: 6px; border-radius: 3px; vertical-align: middle; }
    .sw.s1, .split-bar i.s1 { background: #3987e5; }
    .sw.s2, .split-bar i.s2 { background: var(--ink-faint); }
    .sw.s3 { background: #c98500; }
    .split-bar { display: flex; height: 13px; margin-top: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: rgba(255, 255, 255, .05); }
    .split-bar i { display: block; height: 100%; }
    .step { margin-top: 7px; }
    .step-head { display: flex; justify-content: space-between; margin-bottom: 3px; color: var(--ink-muted); font-size: .78rem; }
    .step-head b { color: var(--ink); }
    .step-bar { height: 8px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, .06); }
    .step-bar i { display: block; height: 100%; border-radius: inherit; background: #199e70; }
    .good-note { color: var(--good); font-size: .8rem; }

    /* P3b2 — Appareils */
    .dev-summary { margin-bottom: 13px; color: var(--ink); font-size: .84rem; font-weight: 650; }
    .dev-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 13px; }
    .dev-controls input { flex: 1 1 210px; min-width: 0; min-height: 38px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: .82rem; }
    .dev-controls input:focus { border-color: var(--accent); outline: none; }
    .tier-pills { display: flex; gap: 7px; }
    .tier-pill { min-height: 38px; padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; color: var(--ink-faint); font-size: .75rem; font-weight: 700; cursor: pointer; text-transform: capitalize; }
    .tier-pill.active { border-color: rgba(58,160,255,.45); background: rgba(58,160,255,.13); color: #cfe8ff; }
    .tier-pill b { font-variant-numeric: tabular-nums; }
    .dev-table td { vertical-align: top; }
    .dev-table tr.is-phantom td { opacity: .35; }
    .phantom-tag { color: var(--crit); font-size: .68rem; font-weight: 750; }
    .id-sub, .time-sub { margin-top: 2px; color: var(--ink-faint); font-size: .7rem; }
    .flag { vertical-align: middle; margin-right: 3px; border-radius: 2px; }
    .tier-kv-sub { margin-top: 3px; color: var(--ink-faint); font-size: .66rem; }
    .badge.b-pro { border-color: rgba(58,160,255,.4); background: rgba(58,160,255,.12); color: #9fd0ff; }
    .badge.b-prem { border-color: rgba(199,125,10,.5); background: rgba(199,125,10,.15); color: #e9b866; }
    .badge.b-prem-rt { border-style: dashed; }
    .badge.b-free { border-color: var(--line-strong); background: transparent; color: var(--ink-faint); }
    .devices-empty-row td { padding: 22px 12px; color: var(--ink-muted); text-align: center; }
    .devices-empty-row a { color: var(--accent); cursor: pointer; }
    .dev-pagi { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 13px; }
    .dev-pagi[hidden] { display: none; }
    .dev-pagi .button:disabled { opacity: .4; cursor: not-allowed; }
    .dev-page-info { color: var(--ink-muted); font-size: .78rem; font-variant-numeric: tabular-nums; }

    @media (max-width: 900px) {
      .fb-grid { grid-template-columns: 1fr; }
      .app { display: block; }
      .mobile-bar { display: flex; }
      .sidebar { position: fixed; z-index: 50; top: 0; left: 0; width: 254px; height: 100dvh; transform: translateX(-101%); transition: transform .22s ease; }
      .app.drawer-open .sidebar { transform: translateX(0); }
      .app.drawer-open .scrim { position: fixed; z-index: 40; inset: 0; display: block; background: rgba(0, 0, 0, .58); }
      main { padding: 20px 16px 56px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .product-grid { grid-template-columns: 1fr; }
      .donut-grid { grid-template-columns: 1fr; }
      .gauge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .page-head { align-items: flex-start; flex-direction: column; }
      .page-head h1 { font-size: 1.42rem; }
      /* Le libellé « ↻ Actualiser » de la fresh-bar était masqué ici alors que le bouton du header, lui,
         restait : exactement l'inverse de ce qu'il fallait. Le bouton du header est désormais supprimé
         (partout, cf renderApp) et la fresh-bar — qui porte le contexte — est le seul point d'actualisation. */
      .freshbar { flex-wrap: wrap; align-items: flex-start; }
      .fresh-action { margin-left: 0; padding-top: 2px; flex-basis: 100%; }
      .kpi-grid { gap: 10px; }
      .kpi-tile { min-height: 110px; padding: 14px; }
      .kpi-value { font-size: 1.45rem; }
    }

    /* ── P3b2b — détail par appareil ─────────────────────────────────────── */
    .dev-bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dev-bulk-btn { min-height: 34px; padding: 6px 11px; font-size: .74rem; }
    .dev-bulk-btn:disabled { opacity: .42; cursor: not-allowed; }
    .dev-bulk-status { color: var(--accent); font-size: .73rem; font-weight: 600; }
    .dev-bulk-hint { margin-left: auto; color: var(--ink-muted); font-size: .71rem; }
    .dev-table tr.dev-row { cursor: pointer; }
    .dev-table tr.dev-row:hover td { background: var(--surface-raised); }
    .dev-table tr.dev-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .dev-table tr.dev-row.dev-expanded td { background: rgba(58, 160, 255, .07); }
    .dev-table tr.dev-expand-row td { padding: 0; background: var(--surface-soft); }
    .dev-panel { padding: 14px 16px; border-left: 3px solid var(--accent); white-space: normal; }
    .dev-panel-loading, .dev-panel-error, .dev-panel-empty { color: var(--ink-muted); font-size: .79rem; }
    .dev-panel-error { color: var(--crit); }
    .dev-panel-empty { font-style: italic; }
    .dev-panel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 13px; }
    .dev-col { padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .dev-col-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; color: var(--ink-muted); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
    .dev-col-total { color: var(--accent); font-size: .68rem; }
    .dev-metric { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: .76rem; }
    .dev-metric-label { display: flex; align-items: center; gap: 6px; color: var(--ink-muted); }
    .dev-metric-val { color: var(--ink); font-weight: 700; }
    .dev-metric-zero .dev-metric-val, .dev-metric-zero .dev-metric-label { opacity: .38; }
    .dev-meta { display: grid; gap: 7px; padding-top: 11px; border-top: 1px solid var(--line); }
    .dev-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; }
    .dev-meta-label { color: var(--ink-faint); font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; }
    .dev-meta-val { color: var(--ink); font-size: .77rem; }
    .dev-none { color: var(--ink-muted); font-size: .72rem; font-weight: 400; opacity: .8; }
    .dev-chip { padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink-muted); font-size: .7rem; }
    .dev-copy-id { padding: 1px 7px; border-radius: 5px; background: var(--surface-raised); color: var(--ink-muted); font-family: ui-monospace, monospace; font-size: .7rem; user-select: all; }
    @media (max-width: 760px) {
      .dev-panel-grid { grid-template-columns: 1fr; gap: 8px; }
      .dev-bulk-hint { flex-basis: 100%; margin-left: 0; }
    }

    /* Bandeau de rôle : neutre (jamais rouge/orange) — un produit au repos n'est pas une anomalie. */
    .role-banner { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 22px; padding: 11px 14px; border: 1px solid var(--line); border-left: 3px solid var(--role-color, var(--accent)); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-muted); font-size: .78rem; line-height: 1.6; }
    .role-banner b { color: var(--ink); }
    .role-badge { flex: none; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--role-color, var(--accent)) 18%, transparent); color: var(--role-color, var(--accent)); font-size: .66rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }

    .ret-since { margin: 0 0 12px; color: var(--ink-muted); font-size: .73rem; line-height: 1.5; }
    .ret-since b { color: var(--ink); }
    .ret-nosig { color: var(--ink-muted); font-size: .62em; font-style: italic; font-weight: 600; }

    /* Métrique non calculable : ni verte ni rouge — l'absence de mesure n'est pas un résultat. */
    .dk-unmeasured { color: var(--ink-muted) !important; font-style: italic; }
    .dk-warnbox { margin-top: 9px; padding: 9px 11px; border: 1px solid rgba(245, 181, 46, .32); border-left: 3px solid var(--warn); border-radius: 8px; background: rgba(245, 181, 46, .06); color: var(--ink-muted); font-size: .73rem; line-height: 1.6; }
    .dk-warnbox code { padding: 1px 4px; border-radius: 3px; background: var(--surface-soft); font-size: .95em; }
    .dk-warnbox b { color: var(--ink); }

    /* ── État de chargement (le prod a un overlay ; sans lui, DictoKey = écran blanc ~20 s) ── */
    .loading-state { display: flex; align-items: center; gap: 14px; padding: 30px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); color: var(--ink-muted); }
    .loading-state strong { display: block; color: var(--ink); font-size: .92rem; }
    .loading-state p { margin: 4px 0 0; font-size: .79rem; }
    .loading-spin { flex: none; width: 20px; height: 20px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: loading-turn .8s linear infinite; }
    @keyframes loading-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loading-spin { animation-duration: 2.4s; } }

    /* ── P4 / Factory ────────────────────────────────────────────────── */
    .fac-note { margin: 0 0 16px; color: var(--ink-muted); font-size: .81rem; line-height: 1.55; }
    .fac-note code { padding: 1px 5px; border-radius: 4px; background: var(--surface-soft); font-size: .95em; }
    .fac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .fac-card { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .fac-card.placeholder { border-style: dashed; opacity: .72; }
    .fac-card-head { display: flex; align-items: flex-start; gap: 11px; }
    .fac-num { display: grid; flex: none; place-items: center; width: 27px; height: 27px; border-radius: 8px; background: var(--surface-raised); color: var(--ink-muted); font-size: .78rem; font-weight: 700; }
    .fac-head-text { min-width: 0; }
    .fac-name { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--ink); font-size: .95rem; font-weight: 700; }
    .fac-badges { display: inline-flex; flex-wrap: wrap; gap: 5px; }
    .fac-badge { padding: 2px 7px; border-radius: 999px; font-size: .66rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
    .fac-badge.post { background: rgba(45, 190, 120, .16); color: var(--good); }
    .fac-badge.warm { background: rgba(245, 181, 46, .16); color: var(--warn); }
    .fac-badge.soon { background: var(--surface-raised); color: var(--ink-muted); }
    .fac-badge.bil { background: rgba(58, 160, 255, .14); color: var(--accent); }
    .fac-handle { margin-top: 3px; font-size: .78rem; }
    .fac-handle a, .fac-domain a { color: var(--ink-muted); text-decoration: none; }
    .fac-handle a:hover, .fac-domain a:hover { color: var(--accent); text-decoration: underline; }
    .fac-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 11px 0 13px; font-size: .76rem; }
    .fac-email { color: var(--ink-muted); }
    .fac-k { opacity: .7; }
    .fac-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fac-metric { padding: 9px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); }
    .fac-metric.muted { opacity: .62; }
    .fac-m-label { color: var(--ink-muted); font-size: .68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fac-m-val { margin-top: 3px; color: var(--ink); font-size: 1.02rem; font-weight: 700; }
    .fac-metric.revenue .fac-m-val { color: var(--good); }
    .fac-m-sub { margin-top: 2px; color: var(--ink-muted); font-size: .64rem; }
    .fac-dash { color: var(--ink-muted); }
    .fac-conv { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-muted); font-size: .74rem; }
    .fac-conv b { color: var(--ink); }
    .fac-conv-warn { color: var(--warn); }
    .fac-conv-warn b { color: var(--warn); }
    .fac-warn-ic { font-size: .66rem; opacity: .85; }
    .fac-health { display: flex; align-items: flex-start; gap: 7px; margin-top: 11px; color: var(--ink-muted); font-size: .72rem; line-height: 1.5; }
    .fac-dot { flex: none; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; }
    .fac-dot.post { background: var(--good); }
    .fac-dot.warm { background: var(--warn); }
    .fac-dot.soon { background: var(--ink-muted); }
    .fac-placeholder-body { margin-top: 11px; color: var(--ink-muted); font-size: .78rem; line-height: 1.55; }
    .fac-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); font-size: .75rem; }
    .fac-warn { color: var(--warn); }
    .fac-tokenbtn { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink-muted); font-size: .74rem; font-weight: 600; cursor: pointer; }
    .fac-tokenbtn:hover { border-color: var(--accent); color: var(--ink); }
    .fac-tokenbtn.accent { border-color: rgba(58, 160, 255, .45); color: var(--accent); }

    /* ── P4 / Studio ─────────────────────────────────────────────────── */
    .st-planning-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 9px 13px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-muted); font-size: .79rem; }
    .st-planning-bar.stale { border-left-color: var(--warn); }
    .st-planning-bar b { color: var(--ink); }
    .st-stats { margin-bottom: 22px; }
    .pf-group { margin-bottom: 14px; }
    .pf-group-h { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-bottom: 8px; }
    .pf-tag { padding: 3px 9px; border-radius: 999px; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
    .pf-tag.organic { background: rgba(45, 190, 120, .16); color: var(--good); }
    .pf-tag.paid { background: rgba(245, 181, 46, .16); color: var(--warn); }
    .pf-group-sum { color: var(--ink-muted); font-size: .76rem; }
    .pf-group-sum b { color: var(--ink); }
    .pf-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .77rem; }
    .pf-row:last-child { border-bottom: 0; }
    .pf-rank { color: var(--ink-muted); font-size: .72rem; text-align: center; }
    .pf-cap { min-width: 0; overflow: hidden; color: var(--ink); text-overflow: ellipsis; white-space: nowrap; }
    .pf-m { color: var(--ink-muted); font-size: .73rem; white-space: nowrap; }
    .pf-delta { color: var(--good); }
    .pf-note { margin: 8px 0 0; color: var(--ink-muted); font-size: .71rem; line-height: 1.5; }
    .pf-foot { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-muted); font-size: .72rem; }
    .st-perf-empty { margin: 0; color: var(--ink-muted); font-size: .79rem; }
    .st-lane { display: grid; gap: 8px; }
    .st-lane-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; font-size: .79rem; }
    .st-lane-row strong { color: var(--ink); }
    .st-lane-row .arrow { color: var(--ink-muted); }
    .st-why { color: var(--ink-muted); font-size: .75rem; }
    .st-filters { display: grid; gap: 8px; margin: 20px 0 16px; }
    .st-filt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .st-filt-lbl { min-width: 54px; color: var(--ink-muted); font-size: .72rem; }
    .st-chip { padding: 4px 11px; border: 1px solid var(--chip, var(--line-strong)); border-radius: 999px; background: color-mix(in srgb, var(--chip, var(--accent)) 14%, transparent); color: var(--chip, var(--ink)); font-size: .73rem; font-weight: 600; cursor: pointer; }
    .st-chip.off { border-color: var(--line); background: transparent; color: var(--ink-muted); opacity: .55; text-decoration: line-through; }
    .st-chip:hover { filter: brightness(1.18); }
    .st-allbtn { margin-left: auto; padding: 4px 9px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink-muted); font-size: .7rem; cursor: pointer; }
    .st-allbtn:hover { border-color: var(--accent); color: var(--ink); }
    .st-section-h { display: flex; align-items: center; gap: 8px; margin: 20px 0 10px; color: var(--ink-muted); font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .st-section-h .cnt { padding: 1px 7px; border-radius: 999px; background: var(--surface-raised); color: var(--ink); font-size: .72rem; }
    .st-card { display: flex; gap: 13px; margin-bottom: 8px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--proj, var(--accent)); border-radius: var(--radius-sm); background: var(--surface); }
    .st-card.posted { opacity: .66; }
    .st-date { flex: none; width: 46px; text-align: center; }
    .st-date .d { color: var(--ink); font-size: 1.15rem; font-weight: 700; line-height: 1; }
    .st-date .m { color: var(--ink-muted); font-size: .62rem; letter-spacing: .04em; }
    .st-date .t { margin-top: 3px; color: var(--ink-muted); font-size: .68rem; }
    .st-body { min-width: 0; flex: 1; }

    /* ─── Mobile étroit : ZÉRO scroll horizontal ────────────────────────────────────
       Référence de conception = 360px CSS (Honor, le tél de Quang — PLUS ÉTROIT que le
       Samsung 384px). Si ça tient à 360, ça tient partout.
       ⚠ Le PC n'est PAS touché : tout est sous media query.
       Pourquoi ces débordements avaient échappé aux contrôles : ils vérifiaient
       `scrollWidth == clientWidth` sur le <html>, ce qui ne voit PAS un conteneur qui
       scrolle en interne (`.table-wrap` a `overflow-x:auto`). L'audit se fait désormais
       élément par élément, panneaux dépliés. */
    @media (max-width: 620px) {
      /* Tableaux étroits (3-4 colonnes) : on relâche `white-space:nowrap` et on resserre
         le padding — ça suffit à les faire tenir sans changer leur forme. */
      .data-table { font-size: .74rem; white-space: normal; }
      .data-table th, .data-table td { padding: 8px 7px; }
      .data-table td { overflow-wrap: anywhere; }

      /* Le tableau clients SubWhisper Pro a 8 COLONNES : aucune compression ne le fera
         tenir dans 360px. Chaque ligne devient donc une CARTE étiquetée (label ← → valeur).
         Les libellés viennent de `data-label` posé sur chaque <td> ; le <thead> est masqué
         de façon accessible (pas `display:none`, qui le retirerait aux lecteurs d'écran). */
      .swp-table thead { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
      .swp-table, .swp-table tbody, .swp-table tr, .swp-table td { display: block; width: 100%; }
      .swp-table tr { border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 10px; padding: 2px 10px; }
      .swp-table tr:last-child { margin-bottom: 0; }
      .swp-table td { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; text-align: right; border-bottom: 1px solid var(--line); padding: 7px 0; }
      .swp-table tr td:last-child { border-bottom: 0; }
      .swp-table td::before { content: attr(data-label); flex: 0 0 auto; text-align: left; color: var(--ink-faint); font-size: .64rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    }

    @media (max-width: 760px) {
      .fac-grid { grid-template-columns: 1fr; }
      .fac-metrics { grid-template-columns: repeat(2, 1fr); }
      .pf-row { grid-template-columns: 20px minmax(0, 1fr); row-gap: 2px; }
      .pf-m { grid-column: span 1; }
      .st-allbtn { margin-left: 0; }
      .st-filt-lbl { flex-basis: 100%; }
    }

    //  • `data/ondine-downloads.json` = les instantanés datés poussés par `ondine/scripts/downloads_snapshot.py`.
    //    C'est lui, et lui seul, qui permet de dire « +N depuis hier ». Absent → on n'invente pas de
    //    delta, on affiche le cumul seul (un delta faux serait pire que pas de delta).
    const ONDINE_RELEASES_API = 'https://api.github.com/repos/quang101182/ondine-releases/releases';
    const ONDINE_DL_HISTORY_URL = 'data/ondine-downloads.json';
    const ONDINE_PUBLIC_TAG = 'v0.98.19';   // version ouverte au public le 02/08 — sert de référence d'affichage
    async function fetchOndineDownloads(signal) {
      const rels = await fetch(ONDINE_RELEASES_API, { signal, headers: { Accept: 'application/vnd.github+json' } })
        .then(r => (r.ok ? r.json() : null)).catch(() => null);

      const isInstaller = name => /\.(exe|zip)$/i.test(name || '');

      rels.forEach(rel => {
        const n = (rel.assets || []).filter(a => isInstaller(a.name))
          .reduce((sum, a) => sum + (parseInt(a.download_count, 10) || 0), 0);
        total += n;

      // juillet : affiche seul, il repond a une question que personne ne pose et noie celle qui compte
      // — « depuis qu'on a ouvert, est-ce que des gens telechargent ? ». Le cumul reste en note.
      const latest = byTag.find(t => t.tag === ONDINE_PUBLIC_TAG) || byTag[0] || null;
      const publicTotal = latest ? latest.n : 0;
      const history = await fetch(`${ONDINE_DL_HISTORY_URL}?t=${Date.now()}`, { signal })
        .then(r => (r.ok ? r.json() : null)).catch(() => null);
      return { ok: true, total, publicTotal, latest, byTag, history: (history && Array.isArray(history.snapshots)) ? history.snapshots : null };
    }

    // l'historique manque ou ne contient que le jour même : sans point de comparaison, il n'y a
    // pas de « depuis hier » — et l'écrire quand même serait une mesure inventée.
    function ondineDlDelta(dlReal) {
      if (!dlReal || !dlReal.ok || !dlReal.history || !dlReal.history.length) return null;
      const today = new Date().toISOString().slice(0, 10);
      // Delta sur la version PUBLIQUE (cf. `publicTotal`) : c'est la seule serie qui parle de l'ouverture.
      const past = dlReal.history.filter(s => s.date && s.date < today && typeof s.public_total === 'number');
      if (!past.length) return null;
      past.sort((a, b) => (a.date < b.date ? 1 : -1));
      return { since: past[0].date, delta: dlReal.publicTotal - past[0].public_total };

        if (tierCounts[tier] !== undefined) tierCounts[tier]++; else tierCounts.free++;
        if (d.effectiveTier === 'premium' && tier === 'free') premiumRuntimeCount++;
        if (dkIsPhantom(d)) phantomCount++;
      });
      const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
      const newDevicesToday = devicesList.filter(d => { if (!d.createdAt) return false; const t = new Date(d.createdAt).getTime(); return !isNaN(t) && t >= startOfToday.getTime(); }).length;
      return { devicesList, tierCounts, phantomCount, premiumRuntimeCount,
               effectiveFree: tierCounts.free - premiumRuntimeCount,
               totalPremium: tierCounts.premium + premiumRuntimeCount, newDevicesToday };
    }

    // === P3b3 — Charts (Chart.js) ===
    // Palette catégorielle = colonne DARK de la palette dataviz validée, dans son ORDRE FIXE (l'ordre EST le
    // mécanisme de sécurité daltonisme, pas de la cosmétique). Validée le 16/07 par `validate_palette.js`
    // contre NOTRE surface (#141a26), pas celle par défaut : 5/5 checks PASS (bande L, chroma, CVD ΔE 8.4,
    // vision normale 19.3, contraste ≥3:1). Ne pas réordonner ni ajouter une 9e teinte : au-delà de 8 on replie
    // sur « Autres » (règle « jamais de hues cyclées » — la prod fait `DONUT_COLORS[i % length]`, d'où 2 langues
    // de même couleur sur son donut à 17 entrées).
    const DK_SERIES = ['#3987e5', '#008300', '#d55181', '#c98500', '#199e70', '#d95926', '#9085e9', '#e66767'];
    const DK_INK_MUTED = '#898781';   // ticks/légendes : encre, JAMAIS la couleur de série
    const DK_GRID = '#2c2c2a';        // grille récessive
    const DK_SURFACE = '#141a26';     // sert de « spacer » 2px entre segments empilés
    const DK_EP_LABELS = { transcribe: 'Dictée', rewrite: 'Réécriture', correct: 'Correction', translate: 'Traduction' };
    const dkCharts = {};
    function dkDestroyCharts() {
      Object.keys(dkCharts).forEach(k => { try { dkCharts[k].destroy(); } catch (e) {} delete dkCharts[k]; });
    }
    const dkAxis = (extra = {}) => ({ ticks: { color: DK_INK_MUTED, ...(extra.ticks || {}) }, grid: { color: DK_GRID }, ...(extra.rest || {}) });
    const dkLegend = show => ({ legend: { display: show, labels: { color: DK_INK_MUTED, boxWidth: 12, boxHeight: 12, usePointStyle: true } },
                                tooltip: { mode: 'index', intersect: false } });
    // Replie la queue sur « Autres » : au-delà de 8 tranches on ne cycle JAMAIS les couleurs.
    function dkFoldTop(entries, n = 7) {
      const sorted = entries.slice().sort((a, b) => b[1] - a[1]);
      if (sorted.length <= n + 1) return sorted;
      const tail = sorted.slice(n).reduce((s, e) => s + e[1], 0);
      return tail > 0 ? sorted.slice(0, n).concat([['Autres', tail]]) : sorted.slice(0, n);
    }
    function dkFlagEmoji(code) {
      if (!code || code === 'Inconnu') return '❓ Inconnu';
      if (code === 'Autres') return 'Autres';
      if (code.length !== 2) return code;
      const RIA = 0x1F1E6, A = 0x41;
      try { return String.fromCodePoint(RIA + code.toUpperCase().charCodeAt(0) - A) + String.fromCodePoint(RIA + code.toUpperCase().charCodeAt(1) - A) + ' ' + code.toUpperCase(); }
      catch (e) { return code; }
    }
    const DK_LANG_MAP = { French: 'Français', English: 'Anglais', Spanish: 'Espagnol', German: 'Allemand', Italian: 'Italien', Portuguese: 'Portugais', Dutch: 'Néerlandais', Russian: 'Russe', Chinese: 'Chinois', Japanese: 'Japonais', Korean: 'Coréen', Arabic: 'Arabe' };
    function dkMapLang(k) { return k === 'Autres' ? 'Autres' : (DK_LANG_MAP[k] || k); }

    function dkDonut(canvasId, entries, labelFn) {
      const el = document.getElementById(canvasId);
      if (!el || typeof Chart === 'undefined') return;
      const folded = dkFoldTop(entries);
      if (!folded.length) { el.closest('.chart-box').innerHTML = '<div class="no-data">Aucune donnée</div>'; return; }
      dkCharts[canvasId] = new Chart(el, {
        type: 'doughnut',
        data: { labels: folded.map(e => labelFn(e[0])), datasets: [{ data: folded.map(e => e[1]),
          backgroundColor: folded.map((_, i) => DK_SERIES[i]), borderColor: DK_SURFACE, borderWidth: 2, hoverOffset: 8 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '58%',
          plugins: { legend: { position: 'right', labels: { color: DK_INK_MUTED, boxWidth: 12, boxHeight: 12, usePointStyle: true, padding: 9 } },
            tooltip: { callbacks: { label: c => { const t = c.dataset.data.reduce((a, b) => a + b, 0); return ` ${c.label} : ${c.parsed} (${t ? Math.round(c.parsed / t * 100) : 0}%)`; } } } } }
      });
    }

    function dkMountCharts(payload) {
      if (!payload || !payload.mon || typeof Chart === 'undefined') return;
      const { mon, dev } = payload;
      const ds = dkDeviceStats(dev);

      // DAU quotidien — série UNIQUE → pas de légende (le titre nomme la série)
      const dau = ((mon.dau && mon.dau.daily) || []).slice().reverse();
      const elDau = document.getElementById('dk-chart-dau');
      if (elDau) dkCharts.dau = new Chart(elDau, {
        type: 'line',
        data: { labels: dau.map(d => d.date.slice(5)), datasets: [{ label: 'Appareils actifs',
          data: dau.map(d => (d.by_platform && d.by_platform.mobile) || 0), borderColor: DK_SERIES[0],
          backgroundColor: 'rgba(57,135,229,.14)', borderWidth: 2, fill: true, tension: .3, pointRadius: 4, pointHoverRadius: 8 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: dkLegend(false),
          scales: { x: dkAxis(), y: { beginAtZero: true, ticks: { color: DK_INK_MUTED, stepSize: 1 }, grid: { color: DK_GRID } } } }
      });

      // Activité quotidienne — 4 séries empilées, spacer 2px couleur surface entre segments
      const act = (mon.daily || []).slice().reverse();
      const elAct = document.getElementById('dk-chart-activity');
      if (elAct) dkCharts.activity = new Chart(elAct, {
        type: 'bar',
        data: { labels: act.map(d => d.date.slice(5)),
          datasets: ['transcribe', 'rewrite', 'correct', 'translate'].map((ep, i) => ({
            label: DK_EP_LABELS[ep], data: act.map(d => (d[ep] && d[ep].count) || 0),
            backgroundColor: DK_SERIES[i], borderColor: DK_SURFACE, borderWidth: 2, borderRadius: 4, borderSkipped: false })) },
        options: { responsive: true, maintainAspectRatio: false, plugins: dkLegend(true),
          scales: { x: { stacked: true, ticks: { color: DK_INK_MUTED }, grid: { color: DK_GRID } },
                    y: { stacked: true, beginAtZero: true, ticks: { color: DK_INK_MUTED }, grid: { color: DK_GRID } } } }
      });

      // Latence P50 quotidienne — spanGaps pour ne pas inventer de continuité sur les trous
      const lat = (mon.latency && mon.latency.daily || []).slice().reverse();
      const elLat = document.getElementById('dk-chart-latency');
      if (elLat && lat.length && lat.some(d => d.transcribe || d.rewrite || d.correct || d.translate)) {
        const eps = ['transcribe', 'rewrite', 'correct', 'translate'].filter(ep => lat.some(d => d[ep]));
        dkCharts.latency = new Chart(elLat, {
          type: 'line',
          data: { labels: lat.map(d => d.date ? d.date.slice(5) : ''),
            datasets: eps.map((ep, i) => ({ label: DK_EP_LABELS[ep] || ep, borderColor: DK_SERIES[i],
              backgroundColor: 'transparent', borderWidth: 2, tension: .3, pointRadius: 4, spanGaps: true,
              data: lat.map(d => d[ep] ? (d[ep].p50 || 0) / 1000 : null) })) },
          options: { responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: DK_INK_MUTED, boxWidth: 12, usePointStyle: true } },
              tooltip: { mode: 'index', intersect: false, callbacks: { label: c => ` ${c.dataset.label} : ${c.parsed.y != null ? c.parsed.y.toFixed(2) + 's' : '—'}` } } },
            scales: { x: dkAxis(), y: { beginAtZero: true, ticks: { color: DK_INK_MUTED, callback: v => v + 's' }, grid: { color: DK_GRID } } } }
        });
      }

      // Nouveaux utilisateurs (P3b5) — série unique → pas de légende
      const nu = ((mon.advanced && mon.advanced.new_users && mon.advanced.new_users.daily) || []).slice().reverse();
      const elNu = document.getElementById('dk-chart-signup');
      if (elNu && nu.length) dkCharts.signup = new Chart(elNu, {
        type: 'bar',
        data: { labels: nu.map(d => d.date.slice(5)), datasets: [{ label: 'Nouveaux utilisateurs',
          data: nu.map(d => d.count), backgroundColor: DK_SERIES[0], borderRadius: 4, borderSkipped: false }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: dkLegend(false),
          scales: { x: dkAxis(), y: { beginAtZero: true, ticks: { color: DK_INK_MUTED, stepSize: 1 }, grid: { color: DK_GRID } } } }
      });

      // Donut langues dictées
      dkDonut('dk-chart-lang', Object.entries((mon.summary && mon.summary.transcribe && mon.summary.transcribe.top_langs) || {}), dkMapLang);
      // Donut Top pays actifs — fantômes EXCLUS via le helper unifié (surtout pas une 4e variante du test)
      const agg = {};
      ds.devicesList.forEach(d => { if (dkIsPhantom(d)) return; const c = d.country || 'Inconnu'; agg[c] = (agg[c] || 0) + 1; });
      dkDonut('dk-chart-country', Object.entries(agg), dkFlagEmoji);
    }

    // === P3b4 — Firebase / Adoption v2.61 / Attribution v2.61.7 (parité stricte, index.html l.3073-3440) ===
    // ⚠ Fraîcheur : Firebase = J-1 (cache KV 1h), à ne pas mélanger avec Play (snapshot J-2..J-7) ni le KV (live).
    const DK_AI_REGEX = /ai[\s\-_]*assistant|chatgpt|perplexity|claude|gemini|copilot/i;
    const dkPct = (n, d) => d > 0 ? Math.round(n / d * 100) : 0;
    const dkNum = v => typeof v === 'number' ? v.toLocaleString('fr-FR') : (v || '—');
    function dkBadge(totalEvents) {
      return totalEvents > 0
        ? `<span class="st-badge st-ok">✅ ${dkNum(totalEvents)} events 7j</span>`
        : `<span class="st-badge st-wait">⏳ En attente</span>`;
    }

    function renderDkFirebase(fb) {
      const a = fb && fb.aggregated;
      if (!a || !a.d7) return `<div class="no-data">⏳ En attente data Firebase…</div>`;
      const d7 = a.d7, ev = a.events || {};
      const v = n => (ev[n] && ev[n].count) || 0;
      // NB : « Sessions 7j » existe côté prod mais est MASQUÉ (HTML l.1056) → non porté, comme le reste du code mort.
      const kpis = `<div class="kpi-grid">`

        + KpiTile('✨ Nouveaux 7j', dkNum(d7.new_users), 'first_open')
        + KpiTile('📤 Désinstalls 7j', dkNum((ev.app_remove && ev.app_remove.count) || 0), `${(ev.app_remove && ev.app_remove.users) || 0} users distincts`)
        + `</div>`;
      const fo = v('first_open'), bf = v('bubble_first_use'), imef = v('ime_first_use');
      const fd = v('first_dictation'), dd = v('daily_dictation'), pp = v('premium_purchase'), qe = v('quota_exceeded');
      const p = (n, d) => d > 0 ? ` <span class="muted">(${Math.round(n / d * 100)}%)</span>` : '';
      const funnel = `<div class="fb-funnel">`
        + `<div>📲 first_open : <b>${dkNum(fo)}</b></div>`
        + `<div class="ind">↳ 🫧 bulle : <b>${bf}</b>${p(bf, fo)}</div>`
        + `<div class="ind">↳ ⌨ IME : <b>${imef}</b>${p(imef, fo)}</div>`
        + `<div>🎤 first_dictation : <b>${fd}</b>${p(fd, fo)}</div>`
        + `<div>🔁 daily_dictation : <b>${dkNum(dd)}</b></div>`
        + `<div>🚪 quota_exceeded : <b>${qe}</b></div>`
        + `<div>💎 premium_purchase : <b>${pp}</b>${p(pp, fo)}</div></div>`;
      // Sources d'acquisition + bandeau IA (channel « AI Assistant » natif GA4 depuis le 13/05/2026, sinon noyé)
      const ch = a.acquisition_channels || [];
      let sources;
      if (!ch.length) sources = '<div class="no-data">Aucune donnée</div>';
      else {
        const totalSessions = ch.reduce((s, c) => s + (c.sessions || 0), 0);
        const aiSessions = ch.filter(c => DK_AI_REGEX.test(c.channel)).reduce((s, c) => s + (c.sessions || 0), 0);
        const aiPct = totalSessions > 0 ? (aiSessions / totalSessions * 100) : 0;
        // Libellés repris À L'IDENTIQUE du prod (ne pas reformuler : « Phase 0/1/2 » renvoie aux phases GEO).
        sources = aiSessions > 0
          ? `<div class="ai-banner on">🤖 Trafic AI Assistant : <b>${aiSessions}</b> sessions (${aiPct.toFixed(1)}% du total)</div>`
          : `<div class="ai-banner off">🤖 Trafic AI Assistant : <b>0</b> sessions 7j (Phase 0/1/2 GEO live 29/05 — à re-mesurer J+30/+60/+90)</div>`;
        sources += ch.slice(0, 8).map(c => {
          const isAi = DK_AI_REGEX.test(c.channel);
          return `<div class="src-row${isAi ? ' is-ai' : ''}">${isAi ? '🤖 ' : ''}${safeText(c.channel)} : <b>${c.new_users}</b> nouveaux · ${c.sessions} sessions</div>`;
        }).join('');
      }
      return kpis + `<div class="fb-grid"><div><div class="chart-title dk-sub2">🎯 Funnel d’activation 7j</div>${funnel}</div>`
        + `<div><div class="chart-title dk-sub2">🌍 Sources d’acquisition 7j</div><div class="fb-sources">${sources}</div></div></div>`;

    function renderDkAdoption(fb) {
      const ad = fb && fb.aggregated && fb.aggregated.adoption_v261;
      if (!ad) return `<div class="no-data">⏳ En attente</div>`;
      let totalEvents = 0;
      ['onboarding_completed', 'onboarding_step_view', 'permission_denied', 'bubble_activation_post_onboarding']
        .forEach(k => (ad[k] || []).forEach(r => { totalEvents += (r.count || 0); }));

      // 1) Choix du flow (ime_only vs with_bubble)
      const flowRows = ad.onboarding_completed || [];
      let flow;
      if (!flowRows.length) flow = '<div class="no-data">⏳ Aucun event <code>onboarding_completed</code> sur 7j</div>';
      else {
        const totalUsers = flowRows.reduce((a2, r) => a2 + (r.users || 0), 0);
        let ime = 0, bub = 0;
        flowRows.forEach(r => { if (r.flow === 'ime_only') ime = r.users || 0; else if (r.flow === 'with_bubble') bub = r.users || 0; });
        flow = `<div class="big">${dkNum(totalUsers)} <span>users ont fini l’onboarding</span></div>`
          + `<div class="lg-row"><i class="sw s1"></i>🫧 with_bubble : <b>${bub}</b> (${dkPct(bub, totalUsers)}%)</div>`
          + `<div class="lg-row"><i class="sw s2"></i>⌨ ime_only : <b>${ime}</b> (${dkPct(ime, totalUsers)}%)</div>`
          + `<div class="split-bar">${totalUsers > 0 ? `<i class="s1" style="width:${dkPct(bub, totalUsers)}%"></i><i class="s2" style="width:${dkPct(ime, totalUsers)}%"></i>` : ''}</div>`;
      }
      // 2) Conversion du bandeau, par déclencheur.
      // ⚠ Ne JAMAIS afficher « 0 % » quand `completed` est absent : un zéro affirmé déclenche des décisions
      // (on a failli refaire un flow d'activation qui marche), un trou déclaré en empêche.
      // Bug app v2.64.1 et antérieures — 3 défauts empilés, vérifiés dans le code le 16/07/2026 :
      //   1. AnalyticsManager.kt:219-220 utilise putBoolean() → Firebase Analytics n'accepte que String/long/double
      //      → `started` et `completed` sont DROPPÉS par le SDK, d'où « (not set) » et jamais « false ».
      //      Preuve croisée : `trigger` (putString, l.221) du MÊME Bundle remonte, lui, parfaitement.
      //   2. Aucun call-site ne passe completed=true (MainActivity.kt:766 et NotificationHelper.kt:610 le
      //      passent en dur à false) → le numérateur n'existe pas dans le code. L'activation réussie
      //      (MegaActivationSlide.kt:322-328, `startService(FloatingBubbleService)`) ne logge que onboarding_completed.
      //   3. Asymétrie : main_banner = tap (onClick), post_dictation_notif = impression (après nm.notify()).
      // Réalité mesurée par ailleurs : bubble_first_use = 45 users / 106 first_open sur 30 j → la bulle s'active bien.
      const bubRows = ad.bubble_activation_post_onboarding || [];
      let bubble;
      if (!bubRows.length) bubble = '<div class="no-data">⏳ Aucun event 7j (bandeau MainActivity)</div>';
      else {
        let started = 0, completed = 0; const byTrigger = {};
        bubRows.forEach(r => {
          const c = r.count || 0; started += c;
          if (r.completed === 'true') completed += c;
          const t = r.trigger || '(unknown)';
          byTrigger[t] = byTrigger[t] || { started: 0, completed: 0 };
          byTrigger[t].started += c;
          if (r.completed === 'true') byTrigger[t].completed += c;
        });
        // Aucune ligne ne porte completed=true/false → le paramètre n'est pas envoyé : on ne mesure RIEN.
        const measurable = bubRows.some(r => r.completed === 'true' || r.completed === 'false');
        bubble = measurable
          ? `<div class="big">${dkPct(completed, started)}% <span>conversion (started → completed)</span></div>`
            + `<div class="sm"><b>${completed}</b> activations sur <b>${started}</b> taps</div>`
            + (Object.keys(byTrigger).length ? `<div class="chart-title dk-sub2">Par déclencheur</div>`
              + Object.keys(byTrigger).map(t => `<div class="sm">• ${safeText(t)} : <b>${byTrigger[t].completed}</b>/${byTrigger[t].started} (${dkPct(byTrigger[t].completed, byTrigger[t].started)}%)</div>`).join('') : '')
          : `<div class="big dk-unmeasured">non mesuré <span>le taux n’est pas calculable</span></div>`
            + `<div class="sm"><b>${started}</b> déclenchements enregistrés, mais l’app n’envoie pas le paramètre <code>completed</code> (il ressort <code>(not set)</code>).</div>`
            + `<div class="dk-warnbox">⚠ <b>Bug de tracking, pas d’échec produit.</b> <code>AnalyticsManager.kt:219-220</code> passe <code>completed</code> en <code>putBoolean</code> — un type que Firebase Analytics ignore ; et aucun call-site ne le passe à <code>true</code>. <b>Ce bloc affichait « 0 % de conversion » — c’était faux.</b> La réalité : <b>bubble_first_use = 45 users sur 106 first_open (30 j)</b> → la bulle s’active bel et bien. À corriger côté app (<code>putString</code> + logger l’activation aboutie).</div>`
            + (Object.keys(byTrigger).length ? `<div class="chart-title dk-sub2">Déclenchements par origine</div>`
              + Object.keys(byTrigger).map(t => `<div class="sm">• ${safeText(t)} : <b>${byTrigger[t].started}</b>${t === 'post_dictation_notif' ? ' <i>(impressions de la notif, pas des taps)</i>' : t === 'main_banner' ? ' <i>(taps)</i>' : ''}</div>`).join('') : '');
      }
      // 3) Drop-off par slide (ordre FIXE de l'onboarding, pas l'ordre reçu)
      const stepRows = ad.onboarding_step_view || [];
      let steps;
      if (!stepRows.length) steps = '<div class="no-data">⏳ Aucun event 7j</div>';
      else {
        const order = ['welcome', 'language', 'three_ways', 'mega_activation', 'demo'];
        const byStep = {}; stepRows.forEach(r => { byStep[r.step] = r; });
        const maxUsers = stepRows.reduce((m, r) => Math.max(m, r.users || 0), 0);
        steps = order.map(step => {
          const users = byStep[step] ? (byStep[step].users || 0) : 0;
          return `<div class="step"><div class="step-head"><span>${safeText(step)}</span><b>${users}</b></div>`
            + `<div class="step-bar"><i style="width:${maxUsers > 0 ? Math.max(2, users / maxUsers * 100) : 2}%"></i></div></div>`;
        }).join('');
      }
      // 4) Refus de permission
      const permRows = ad.permission_denied || [];
      const perms = !permRows.length ? '<div class="good-note">✅ Aucun refus de permission 7j (= bon signal)</div>'
        : permRows.slice().sort((a2, b) => (b.users || 0) - (a2.users || 0))
            .map(r => `<div class="sm">• <b>${safeText(r.permission || '(unknown)')}</b> : ${r.users} users (${r.count} refus)</div>`).join('');

      return `<div class="badge-row">${dkBadge(totalEvents)}</div><div class="fb-grid">`
        + `<div class="fb-card"><div class="chart-title">Choix du flow</div>${flow}</div>`
        + `<div class="fb-card"><div class="chart-title">Conversion bandeau</div>${bubble}</div>`
        + `<div class="fb-card"><div class="chart-title">Drop-off par slide</div>${steps}</div>`
        + `<div class="fb-card"><div class="chart-title">Refus de permission</div>${perms}</div></div>`;
    }

    function renderDkAttribution(fb) {
      const at = fb && fb.aggregated && fb.aggregated.attribution_v2617;
      if (!at) return `<div class="no-data">⏳ En attente</div>`;
      let totalEvents = 0;
      ['install_source', 'install_content', 'oem_kill_brand'].forEach(k => (at[k] || []).forEach(r => { totalEvents += (r.count || 0); }));
