<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Se7en AI — Monitoring v2</title>
  <style>
    :root {
      --bg: #0a0d13;
      --surface: #141a26;
      --surface-raised: #1c2434;
      --surface-soft: #111725;
      --line: rgba(255, 255, 255, .07);
      --line-strong: rgba(255, 255, 255, .15);
      --ink: #e9eef6;
      --ink-muted: #9aa7b8;
      --ink-faint: #68758a;
      --accent: #3aa0ff;
      --dk: #2f80d8;
      --swp: #ec4899;
      --sv: #c77d0a;
      --good: #22c55e;
      --warn: #f5b52e;
      --crit: #ef4444;
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-width: 224px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }

    .sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 18px 12px; overflow-y: auto; background: linear-gradient(180deg, var(--surface-soft), #0e1420); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-size: 1.08rem; font-weight: 800; letter-spacing: .01em; }
    .brand-mark { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #cfe8ff, var(--accent) 55%, #0a2c5c); box-shadow: 0 0 16px rgba(58, 160, 255, .55); }
    .brand-seven { color: var(--accent); }
    .nav-group { margin: 12px 0 4px; padding: 0 12px; color: var(--ink-faint); font-size: .62rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--ink-muted); text-align: left; font-size: .88rem; font-weight: 650; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .nav-item:hover { background: var(--surface-raised); color: var(--ink); }
    .nav-item[aria-current="page"] { border-color: rgba(58, 160, 255, .28); background: rgba(58, 160, 255, .13); color: #d3ebff; }
    .nav-icon { width: 18px; text-align: center; font-size: 1rem; }
    .product-dot { width: 8px; height: 8px; margin-left: auto; border-radius: 50%; background: var(--product-color); box-shadow: 0 0 7px var(--product-color); }
    .side-footer { margin-top: auto; padding: 18px 10px 4px; color: var(--ink-faint); font-size: .67rem; }

    .mobile-bar { position: sticky; top: 0; z-index: 30; display: none; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; background: rgba(20, 26, 38, .96); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    .menu-button, .icon-button { display: inline-grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; }
    .mobile-title { font-weight: 800; }
    .scrim { display: none; }

    main { width: 100%; max-width: 1180px; padding: 26px 30px 64px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .page-head h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.7rem; line-height: 1.15; letter-spacing: -.025em; }
    .page-head p { margin: 4px 0 0; color: var(--ink-muted); font-size: .85rem; }
    .view-badge { padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-muted); font-size: .65rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: .82rem; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .button:hover { border-color: var(--accent); background: var(--surface-raised); }

    .freshbar { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 24px; padding: 9px 13px; border: 1px solid var(--line); border-left: 3px solid var(--fresh-color); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-muted); font-size: .81rem; cursor: pointer; }
    .freshbar:hover { border-color: var(--line-strong); background: var(--surface-raised); }
    .fresh-dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--fresh-color); box-shadow: 0 0 0 0 var(--fresh-color); }
    .freshbar strong { color: var(--ink); }
    .fresh-action { margin-left: auto; color: var(--accent); font-weight: 700; white-space: nowrap; }

    .placeholder { display: grid; min-height: 290px; place-items: center; padding: 32px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: linear-gradient(145deg, var(--surface), rgba(20, 26, 38, .45)); text-align: center; }
    .placeholder-inner { max-width: 470px; }
    .placeholder-icon { display: block; margin-bottom: 13px; color: var(--accent); font-size: 1.8rem; }
    .placeholder h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .placeholder p { margin: 0; color: var(--ink-muted); }

    .section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
    .section-head a { color: var(--accent); font-size: .78rem; font-weight: 700; text-decoration: none; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .kpi-tile, .product-card, .funnel, .alert, .panel { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .kpi-tile { min-height: 126px; padding: 16px 17px; }
    .kpi-label { color: var(--ink-faint); font-size: .67rem; font-weight: 750; letter-spacing: .065em; text-transform: uppercase; }
    .kpi-value { margin-top: 7px; font-size: 1.82rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 3px; color: var(--ink-muted); font-size: .76rem; }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .product-card { position: relative; overflow: hidden; padding: 18px; color: inherit; text-align: left; cursor: pointer; }
    .product-card::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--product-color); content: ""; }
    .product-card::after { position: absolute; inset: 0 0 auto; height: 80px; background: radial-gradient(115% 100% at 0 0, color-mix(in srgb, var(--product-color) 22%, transparent), transparent 70%); content: ""; pointer-events: none; }
    .product-card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
    .product-name { position: relative; padding-left: 8px; font-size: 1rem; font-weight: 800; }
    .product-meta { position: relative; display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; padding-left: 8px; }
    .product-meta span { display: block; color: var(--ink-faint); font-size: .64rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .product-meta strong { font-size: 1.08rem; }
    .product-meta .pm-item > strong { display: block; margin-top: 3px; color: var(--ink); font-size: 1.08rem; font-variant-numeric: tabular-nums; }
    .product-progress { position: relative; height: 6px; margin: 15px 0 0 8px; overflow: hidden; border-radius: 5px; background: rgba(255, 255, 255, .07); }
    .product-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--product-color); }
    .funnel { padding: 18px; }
    .funnel-step + .funnel-step { margin-top: 13px; }
    .funnel-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: .84rem; }
    .funnel-meta span { color: var(--ink-muted); }
    .funnel-bar { height: 12px; overflow: hidden; border-radius: 7px; background: rgba(58, 160, 255, .09); }
    .funnel-bar i { display: block; width: var(--bar-width); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #7cc0ff); box-shadow: 0 0 12px rgba(58, 160, 255, .35); }
    .alert-list { display: grid; gap: 9px; }
    .alert { display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 11px 14px; border-left: 3px solid var(--alert-color); }
    .alert-badge { padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--alert-color) 16%, transparent); color: var(--alert-color); font-size: .64rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .alert-message { color: var(--ink-muted); font-size: .84rem; }
    .alert-message strong { color: var(--ink); }
    .panel { overflow: hidden; }
    .panel-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; padding: 13px 16px; border: 0; background: transparent; color: var(--ink); text-align: left; font-weight: 750; cursor: pointer; }
    .panel-toggle:hover { background: rgba(255, 255, 255, .025); }
    .panel-chevron { color: var(--accent); transition: transform .16s; }
    .panel[data-open="true"] .panel-chevron { transform: rotate(180deg); }
    .panel-content { display: none; padding: 0 16px 16px; color: var(--ink-muted); font-size: .85rem; }
    .panel[data-open="true"] .panel-content { display: block; }

    .acq-northstar { margin: 0 0 22px; color: var(--ink-muted); font-size: .84rem; line-height: 1.45; }
    .acq-northstar strong { color: var(--ink); }
    .acq-hub { padding: 18px 16px; border: 1px solid rgba(58, 160, 255, .16); border-radius: var(--radius); background: linear-gradient(160deg, rgba(58, 160, 255, .05), var(--surface-soft)); }
    .acq-hub-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .acq-hub-head h3 { margin: 0; font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; }
    .acq-hub-head a { color: var(--accent); text-decoration: none; }
    .acq-hub-desc { margin: 2px 0 16px; color: var(--ink-muted); font-size: .8rem; line-height: 1.45; }
    .acq-recap { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; }
    .acq-sub { margin-bottom: 12px; color: var(--ink-faint); font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .funnel-note { color: var(--ink-faint); font-weight: 400; font-size: .74rem; }
    .funnel-line { display: flex; align-items: center; gap: 10px; }
    .funnel-line .funnel-bar { flex: 1; }
    .funnel-conv { flex: 0 0 auto; min-width: 78px; color: var(--ink-faint); font-size: .76rem; text-align: right; white-space: nowrap; }
    .acq-detail { margin-top: 11px; color: var(--ink-muted); font-size: .8rem; }
    .acq-detail strong { color: var(--ink); }
    .acq-site { position: relative; overflow: hidden; margin-bottom: 14px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, var(--surface), #111622); }
    .acq-site::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--product-color); content: ""; }
    .acq-site-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 13px; padding-left: 8px; }
    .acq-site-head a { color: var(--product-color); font-size: 1.02rem; font-weight: 800; text-decoration: none; }
    .acq-rate { color: var(--ink-muted); font-size: .77rem; white-space: nowrap; }
    .acq-rate strong { color: var(--ink); font-size: .92rem; }
    .acq-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 12px; padding-left: 8px; }
    .acq-mlabel { display: block; color: var(--ink-faint); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .acq-mvalue { display: block; margin-top: 3px; color: var(--product-color); font-size: 1.32rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .acq-mvalue.acq-out { color: var(--warn); }
    .acq-mnote { display: block; margin-top: 2px; color: var(--ink-muted); font-size: .72rem; }
    .acq-progress { height: 12px; margin-left: 8px; overflow: hidden; border-radius: 6px; background: rgba(58, 160, 255, .09); }
    .acq-progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--product-color), #7cc0ff); }
    .acq-when { margin-top: 12px; color: var(--ink-faint); font-size: .78rem; }

    /* P3 — produits payants */
    .muted { color: var(--ink-faint); }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .78rem; }
    .empty { padding: 18px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--ink-muted); text-align: center; }
    .badge { display: inline-block; padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--ink-muted); font-size: .66rem; font-weight: 750; }
    .badge.pro { border-color: rgba(58,160,255,.4); background: rgba(58,160,255,.12); color: #9fd0ff; }
    .badge.trial { border-color: rgba(245,181,46,.4); background: rgba(245,181,46,.12); color: #f3ce7d; }
    .badge.rev { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.12); color: #f5a3a3; }
    .health { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: .76rem; }
    .health .hdot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
    .health.h-risk .hdot { background: var(--crit); box-shadow: 0 0 6px var(--crit); }
    .health.h-warn .hdot { background: var(--warn); }
    .health.h-ok .hdot { background: var(--good); }
    .health.h-trial .hdot { background: var(--warn); opacity: .6; }
    .health.h-rev .hdot, .health.h-test .hdot { background: var(--ink-faint); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .data-table { width: 100%; border-collapse: collapse; font-size: .8rem; white-space: nowrap; }
    .data-table th { padding: 10px 12px; border-bottom: 1px solid var(--line-strong); color: var(--ink-faint); text-align: left; font-size: .66rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table tr.row-risk td { background: rgba(239, 68, 68, .06); }
    .data-table tr.row-rev td, .data-table tr.row-test td { color: var(--ink-muted); }
    .sv-row { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .sv-row + .sv-row { margin-top: 9px; }
    .sv-row-main { display: flex; align-items: center; gap: 9px; }
    .sv-email { font-weight: 700; }
    .sv-row-meta { margin-top: 5px; color: var(--ink-muted); font-size: .77rem; }
    .token-form { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .token-form input { min-width: 0; flex: 1 1 240px; max-width: 320px; min-height: 40px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: .85rem; }
    .token-form input:focus { border-color: var(--accent); outline: none; }

    /* P3b1 — DictoKey */
    .kpi-value { color: var(--ink); }
    .trend-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .trend-item { display: flex; align-items: baseline; gap: 8px; flex: 1 1 190px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .trend-label { color: var(--ink-faint); font-size: .68rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
    .trend-val { margin-left: auto; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .change { font-size: .74rem; font-weight: 750; }
    .change.up, .churn-info .up { color: var(--good); }
    .change.down, .churn-info .down { color: var(--crit); }
    .change.neutral { color: var(--ink-faint); }
    .churn-info { font-size: .9rem; }
    .dk-stale { margin-bottom: 14px; }
    .dk-sub2 { margin-top: 20px; }
    .cost-list { display: grid; gap: 9px; }
    .cost-row { display: flex; align-items: center; gap: 12px; }
    .cost-label { flex: 0 0 110px; color: var(--ink-muted); font-size: .8rem; }
    .cost-bar-bg { flex: 1; height: 11px; overflow: hidden; border-radius: 6px; background: rgba(255, 255, 255, .06); }
    .cost-bar-bg i { display: block; height: 100%; border-radius: inherit; }
    .cost-bar-bg i.c0 { background: linear-gradient(90deg, #7c5cff, #a68bff); }
    .cost-bar-bg i.c1 { background: linear-gradient(90deg, var(--accent), #7cc0ff); }
    .cost-bar-bg i.c2 { background: linear-gradient(90deg, var(--good), #6ee7a8); }
    .cost-amount { flex: 0 0 62px; color: var(--ink); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
    .cost-total { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 750; font-size: .84rem; }
    .panel-content .acq-sub:first-child { margin-top: 0; }

    /* P3b2 — Appareils */
    .dev-summary { margin-bottom: 13px; color: var(--ink); font-size: .84rem; font-weight: 650; }
    .dev-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 13px; }
    .dev-controls input { flex: 1 1 210px; min-width: 0; min-height: 38px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: .82rem; }
    .dev-controls input:focus { border-color: var(--accent); outline: none; }
    .tier-pills { display: flex; gap: 7px; }
    .tier-pill { min-height: 38px; padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; color: var(--ink-faint); font-size: .75rem; font-weight: 700; cursor: pointer; text-transform: capitalize; }
    .tier-pill.active { border-color: rgba(58,160,255,.45); background: rgba(58,160,255,.13); color: #cfe8ff; }
    .tier-pill b { font-variant-numeric: tabular-nums; }
    .dev-table td { vertical-align: top; }
    .dev-table tr.is-phantom td { opacity: .35; }
    .phantom-tag { color: var(--crit); font-size: .68rem; font-weight: 750; }
    .id-sub, .time-sub { margin-top: 2px; color: var(--ink-faint); font-size: .7rem; }
    .flag { vertical-align: middle; margin-right: 3px; border-radius: 2px; }
    .tier-kv-sub { margin-top: 3px; color: var(--ink-faint); font-size: .66rem; }
    .badge.b-pro { border-color: rgba(58,160,255,.4); background: rgba(58,160,255,.12); color: #9fd0ff; }
    .badge.b-prem { border-color: rgba(199,125,10,.5); background: rgba(199,125,10,.15); color: #e9b866; }
    .badge.b-prem-rt { border-style: dashed; }
    .badge.b-free { border-color: var(--line-strong); background: transparent; color: var(--ink-faint); }
    .devices-empty-row td { padding: 22px 12px; color: var(--ink-muted); text-align: center; }
    .devices-empty-row a { color: var(--accent); cursor: pointer; }
    .dev-pagi { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 13px; }
    .dev-pagi[hidden] { display: none; }
    .dev-pagi .button:disabled { opacity: .4; cursor: not-allowed; }
    .dev-page-info { color: var(--ink-muted); font-size: .78rem; font-variant-numeric: tabular-nums; }

    @media (max-width: 900px) {
      .app { display: block; }
      .mobile-bar { display: flex; }
      .sidebar { position: fixed; z-index: 50; top: 0; left: 0; width: 254px; height: 100dvh; transform: translateX(-101%); transition: transform .22s ease; }
      .app.drawer-open .sidebar { transform: translateX(0); }
      .app.drawer-open .scrim { position: fixed; z-index: 40; inset: 0; display: block; background: rgba(0, 0, 0, .58); }
      main { padding: 20px 16px 56px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .product-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .page-head { align-items: flex-start; flex-direction: column; }
      .page-head h1 { font-size: 1.42rem; }
      .freshbar { align-items: flex-start; }
      .fresh-action { display: none; }
      .kpi-grid { gap: 10px; }
      .kpi-tile { min-height: 110px; padding: 14px; }
      .kpi-value { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <div class="app" id="app-shell">
    <div class="scrim" id="nav-scrim" aria-hidden="true"></div>
    <aside class="sidebar" aria-label="Navigation principale">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Se<span class="brand-seven">7</span>en&nbsp;AI</span></div>
      <nav id="navigation"></nav>
      <div class="side-footer">Monitoring v2 · P3b2 Appareils</div>
    </aside>
    <div class="content-wrap">
      <header class="mobile-bar"><button class="menu-button" id="menu-button" type="button" aria-label="Ouvrir la navigation" aria-expanded="false">☰</button><strong class="mobile-title">Se<span class="brand-seven">7</span>en&nbsp;AI</strong></header>
      <main id="view-root" tabindex="-1"></main>
    </div>
  </div>

  <script>
    'use strict';

    const VERSION = 'v2.6.0-p3b2';
    const PRODUCT_COLORS = { dk: 'var(--dk)', swp: 'var(--swp)', sv: 'var(--sv)' };
    const APPS = [
      { key: 'home', name: 'Vue d’ensemble', icon: '⌂', family: 'home', auth: 'none', endpoints: {}, subtitle: 'Synthèse inter-produits — agrégats publics ; revenus et actifs au lot P3.', sections: [] },
      { key: 'dk', name: 'DictoKey', icon: '⌨', family: 'products', color: PRODUCT_COLORS.dk, auth: 'token', tokenKey: 'monitoring_admin_token', endpoints: {}, subtitle: 'Adoption, rétention, revenus et infrastructure.', sections: [] },
      { key: 'swp', name: 'SubWhisper Pro', icon: '◉', family: 'products', color: PRODUCT_COLORS.swp, auth: 'token', tokenKey: 'monitoring_swp_token', gateway: 'https://api-gateway-pro.quang101182.workers.dev', endpoints: { overview: '/admin/swp/overview' }, subtitle: 'Abonnements, santé client et revenus.', sections: [] },
      { key: 'sv', name: 'StoryVoice', icon: '◌', family: 'products', color: PRODUCT_COLORS.sv, auth: 'token', tokenKey: 'monitoring_storyvoice_token', gateway: 'https://api-gateway-pro.quang101182.workers.dev', endpoints: { overview: '/admin/sv/overview' }, subtitle: 'Crédits, conversion et revenus.', sections: [] },
      { key: 'acq', name: 'Acquisition', icon: '⌁', family: 'acquisition', auth: 'none', endpoints: {}, subtitle: 'Sites, visites, engagement et clics sortants.', sections: [] },
      { key: 'factory', name: 'Factory', icon: '▦', family: 'ops', auth: 'none', endpoints: {}, subtitle: 'Ebook Funnel Factory — opérations et performance.', sections: [] },
      { key: 'studio', name: 'Studio', icon: '▣', family: 'ops', auth: 'none', endpoints: {}, subtitle: 'Agenda et opérations de publication.', sections: [] }
    ];
    const FAMILY_LABELS = { products: 'Produits', acquisition: 'Acquisition', ops: 'Ops' };
    const state = { activeKey: null, controller: null, loadedAt: new Map(), cache: new Map(), error: new Map() };

    function getApp(key) { return APPS.find(app => app.key === key) || APPS[0]; }
    function safeText(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]); }
    function formatDate(date) { return new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }).format(date); }
    function relativeTime(date) { const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000)); return seconds < 60 ? "à l'instant" : seconds < 3600 ? `il y a ${Math.floor(seconds / 60)} min` : seconds < 86400 ? `il y a ${Math.floor(seconds / 3600)} h` : `il y a ${Math.floor(seconds / 86400)} j`; }
    function freshState(date) { const age = Date.now() - date.getTime(); return age > 86400000 ? ['Périmé', 'var(--crit)'] : age > 21600000 ? ['Vieillit', 'var(--warn)'] : ['Frais', 'var(--good)']; }

    // P1 — Acquisition : 8 compteurs publics cookieless (gateway-pro), SANS token, fallback neutre par compteur.
    const ACQ_GATEWAY = 'https://api-gateway-pro.quang101182.workers.dev';
    async function fetchAcq(signal) {
      const slugs = ['se7', 'dk', 'swp', 'sv'];
      const calls = [];
      slugs.forEach(slug => {
        calls.push(fetch(`${ACQ_GATEWAY}/api/visit?page=${slug}`, { signal }).then(r => r.json()).catch(() => ({ total: 0, today: 0 })));
        calls.push(fetch(`${ACQ_GATEWAY}/api/click?page=${slug}`, { signal }).then(r => r.json()).catch(() => ({ total: 0, today: 0, by_btn_all: {} })));
      });
      const r = await Promise.all(calls);
      return { se7: { visit: r[0], clicks: r[1] }, dk: { visit: r[2], clicks: r[3] }, swp: { visit: r[4], clicks: r[5] }, sv: { visit: r[6], clicks: r[7] }, generatedAt: Date.now() };
    }

    // P2 — Home : fetch léger des agrégats publics (mêmes compteurs que la vue Acquisition).
    // Les données produit (MRR, actifs) restent token-gated → branchées au lot P3 via state.cache.
    async function fetchHome(signal) {
      return { acq: await fetchAcq(signal) };
    }

    // Moteur générique : les endpoints vides ne déclenchent aucun fetch (vues non encore branchées).
    async function fetchApp(cfg, signal) {
      if (cfg.key === 'acq') return fetchAcq(signal);
      if (cfg.key === 'home') return fetchHome(signal);
      if (cfg.key === 'dk') return fetchDk(cfg, signal);
      const payload = {};
      for (const [name, endpoint] of Object.entries(cfg.endpoints || {})) {
        if (!endpoint) continue;
        const url = endpoint.startsWith('http') ? endpoint : `${cfg.gateway || ''}${endpoint}`;
        const response = await fetch(url, { signal, headers: cfg.auth === 'token' ? { Authorization: `Bearer ${getToken(cfg)}` } : {} });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        payload[name] = await response.json();
      }
      return payload;
    }
    // Mêmes clés localStorage que la prod (`index.html` const APPS) : v2 est servi depuis la MÊME origine,
    // donc les tokens déjà collés par Quang dans le dashboard actuel sont hérités tels quels. Rien à recoller à la bascule.
    function getToken(cfg) { return (cfg && cfg.tokenKey && localStorage.getItem(cfg.tokenKey)) || ''; }

    function KpiTile(label, value, note) { return `<article class="kpi-tile"><div class="kpi-label">${safeText(label)}</div><div class="kpi-value">${safeText(value)}</div><div class="kpi-note">${safeText(note)}</div></article>`; }
    function FunnelBar(label, value, width) { return `<div class="funnel-step"><div class="funnel-meta"><strong>${safeText(label)}</strong><span>${safeText(value)}</span></div><div class="funnel-bar"><i style="--bar-width:${Math.max(0, Math.min(100, width))}%"></i></div></div>`; }
    // P2 : les cartes produit affichent les KPI PUBLICS (visites / clics sortants) disponibles dès maintenant.
    // Les KPI payants (MRR, abonnés actifs) s'ajouteront au lot P3 avec les endpoints token-gated.
    function ProductCard(app, acq) {
      const d = acq && acq[app.key];
      const vTot = d ? acqInt((d.visit || {}).total) : null;
      const out = d ? acqSiteOut(acq, app.key) : null;
      const w = (vTot && vTot > 0) ? Math.max(2, Math.min(100, Math.round((out / vTot) * 100))) : 0;
      const meta = d
        ? `<span class="pm-item"><span>Visites</span><strong>${vTot}</strong></span><span class="pm-item"><span>Clics sortants</span><strong>${out}</strong></span>`
        : `<span class="pm-item"><span>Données</span><strong>—</strong></span><span class="pm-item"><span>Lot</span><strong>P3</strong></span>`;
      return `<button class="product-card" type="button" data-route="${app.key}" style="--product-color:${app.color}"><span class="product-name">${safeText(app.name)}</span><span class="product-meta">${meta}</span><span class="product-progress"><i style="width:${w}%"></i></span></button>`;
    }
    function Alert(level, title, message) { const color = level === 'critique' ? 'var(--crit)' : level === 'ok' ? 'var(--good)' : 'var(--warn)'; return `<article class="alert" style="--alert-color:${color}"><span class="alert-badge">${safeText(level)}</span><span class="alert-message"><strong>${safeText(title)}</strong> — ${safeText(message)}</span></article>`; }
    function Panel(id, title, content, open = false) { return `<section class="panel" data-open="${open}" id="${id}"><button class="panel-toggle" type="button" aria-expanded="${open}" aria-controls="${id}-content"><span>${safeText(title)}</span><span class="panel-chevron" aria-hidden="true">⌄</span></button><div class="panel-content" id="${id}-content">${content}</div></section>`; }
    function FreshBar(app) { const at = state.loadedAt.get(app.key) || new Date(); const [label, color] = freshState(at); return `<button class="freshbar" type="button" data-refresh="${app.key}" style="--fresh-color:${color}" title="Actualiser cette vue"><span class="fresh-dot" aria-hidden="true"></span><span><strong>${label}</strong> · données ${app.auth === 'token' ? 'protégées' : 'publiques'} · dernier rafraîchissement le <strong>${formatDate(at)}</strong> (${relativeTime(at)})</span><span class="fresh-action">↻ Actualiser</span></button>`; }

    // === P1 — Acquisition (parité stricte avec index.html v1.23.0, formules identiques) ===
    const ACQ_META = {
      dk:  { name: 'DictoKey',       url: 'https://dictokey.com',                 color: 'var(--dk)',  outMode: 'total', outNote: 'vers Play Store' },
      swp: { name: 'SubWhisper Pro', url: 'https://sub-whisper.com/landing.html', color: 'var(--swp)', outMode: 'out',   outNote: 'vers checkout' },
      sv:  { name: 'StoryVoice',     url: 'https://storiesvoice.org',             color: 'var(--sv)',  outMode: 'out',   outNote: 'vers checkout / app' }
    };
    function acqInt(value) { return parseInt(value) || 0; }
    function acqPct(n, d) { return (!d || d <= 0) ? '—' : `${Math.round((n / d) * 1000) / 10}%`; }

    function renderAcqHub(se7) {
      const visit = (se7 && se7.visit) || { total: 0, today: 0 };
      const bb = (se7 && se7.clicks && se7.clicks.by_btn_all) || {};
      const g = key => acqInt(bb[key]);
      const vTot = acqInt(visit.total), vToday = acqInt(visit.today);
      const demo = g('f:demo'), chat = g('f:chat'), cta = g('f:cta'), wait = g('f:waitlist');
      let outTotal = 0; const outParts = [];
      Object.keys(bb).forEach(key => { if (key.indexOf('out:') === 0) { const v = acqInt(bb[key]); outTotal += v; outParts.push({ name: key.slice(4), v }); } });
      outParts.sort((a, b) => b.v - a.v);
      const steps = [
        { label: '👁 Visites', val: vTot, prev: null, note: vToday > 0 ? `+${vToday} auj.` : 'trafic humain' },
        { label: '🎬 Interaction démo', val: demo, prev: vTot, note: 'capacité jouée' },
        { label: '💬 Engagement chat', val: chat, prev: vTot, note: 'question posée à Halo' },
        { label: '✨ Clic CTA', val: cta, prev: vTot, note: 'accès anticipé / sur-mesure / soutien' },
        { label: '📧 Waitlist envoyée', val: wait, prev: cta, note: 'email laissé' },
        { label: '🔗 Clic sortant', val: outTotal, prev: vTot, note: 'vers store / app' }
      ];
      const max = Math.max(1, vTot, demo, chat, cta, wait, outTotal);
      const rows = steps.map(s => {
        const w = Math.max(2, Math.round((s.val / max) * 100));
        const conv = s.prev == null ? '' : `<span class="funnel-conv">${acqPct(s.val, s.prev)} vs préc.</span>`;
        return `<div class="funnel-step"><div class="funnel-meta"><strong>${safeText(s.label)} <span class="funnel-note">${safeText(s.note)}</span></strong><span>${s.val}</span></div><div class="funnel-line"><div class="funnel-bar"><i style="--bar-width:${w}%"></i></div>${conv}</div></div>`;
      }).join('');
      const detail = outParts.length ? `<div class="acq-detail">Détail sortants : ${outParts.map(o => `${safeText(o.name)} <strong>${o.v}</strong>`).join(' · ')}</div>` : '';
      const recap = `<div class="kpi-grid acq-recap">${KpiTile('Visites', vTot, vToday > 0 ? `+${vToday} auj.` : '—')}${KpiTile('Waitlist', wait, 'emails captés')}${KpiTile('Clics sortants', outTotal, 'vers store/app')}</div>`;
      return `<div class="acq-hub-head"><h3>🌐 Hub — <a href="https://se7enai.com" target="_blank" rel="noopener">se7enai.com ↗</a></h3></div><p class="acq-hub-desc">Tête de pont (lien bio TikTok). Visite → démo → chat → CTA → waitlist → clic sortant.</p>${recap}<div class="acq-sub">Funnel d’acquisition du hub</div><div class="funnel">${rows}</div>${detail}`;
    }
    function renderAcqSites(data) {
      return ['dk', 'swp', 'sv'].map(key => {
        const m = ACQ_META[key], d = data[key] || {};
        const visit = d.visit || { total: 0, today: 0 };
        const clicks = d.clicks || { total: 0, by_btn_all: {} };
        const vTot = acqInt(visit.total), vToday = acqInt(visit.today);
        const bb = clicks.by_btn_all || {};
        let outTotal = 0; const outParts = [];
        if (m.outMode === 'total') { outTotal = acqInt(clicks.total); }
        else { Object.keys(bb).forEach(b => { if (b.indexOf('out:') === 0) { const v = acqInt(bb[b]); outTotal += v; outParts.push({ name: b.slice(4), v }); } }); }
        outParts.sort((a, b) => b.v - a.v);
        const w = vTot > 0 ? Math.max(2, Math.min(100, Math.round((outTotal / vTot) * 100))) : 0;
        const detail = outParts.length ? `<div class="acq-detail">Détail : ${outParts.map(o => `${safeText(o.name)} <strong>${o.v}</strong>`).join(' · ')}</div>` : '';
        return `<article class="acq-site" style="--product-color:${m.color}"><div class="acq-site-head"><a href="${m.url}" target="_blank" rel="noopener">${safeText(m.name)} ↗</a><span class="acq-rate">taux sortant <strong>${acqPct(outTotal, vTot)}</strong></span></div><div class="acq-metrics"><div><span class="acq-mlabel">Visites</span><span class="acq-mvalue">${vTot}</span><span class="acq-mnote">${vToday > 0 ? `+${vToday} auj.` : '—'}</span></div><div><span class="acq-mlabel">Clics sortants</span><span class="acq-mvalue acq-out">${outTotal}</span><span class="acq-mnote">${safeText(m.outNote)}</span></div></div><div class="acq-progress"><i style="width:${w}%"></i></div>${detail}</article>`;
      }).join('');
    }
    function renderAcq(data) {
      data = data || {};
      const when = data.generatedAt ? new Date(data.generatedAt).toLocaleString('fr-FR') : '';
      return `<p class="acq-northstar">North-star : <strong>taux visite → clic sortant</strong>. Le hub se7enai.com (tête de pont TikTok) puis les sites vitrines. Cookieless, gateway-pro.</p><section class="section acq-hub">${renderAcqHub(data.se7)}</section><section class="section"><div class="section-head"><h2>Sites vitrines</h2></div>${renderAcqSites(data)}</section><div class="acq-when">Dernière mesure : ${safeText(when)}</div>`;
    }

    // === P3 — Produits payants : helpers PORTÉS À L'IDENTIQUE de la prod (index.html v1.23.0 l.2244-2298, 2488-2501).
    // Toute divergence ici casse la parité des chiffres. Ne pas « améliorer » les formules.
    const SWP_PRICE_EUR = 9;                 // prix abonnement mensuel — MRR = payants × 9 (aucun montant LS réel n'est lu)
    const SV_PACKS = [{ c: 3000000, e: 64.90 }, { c: 1000000, e: 24.90 }, { c: 300000, e: 7.90 }];
    const SV_CPH = 180000;                   // crédits ≈ 1 h de narration
    function swpIsTest(email) { return /@(test|example)\./i.test(String(email || '')); }
    function svIsInternal(email) { const e = String(email || '').toLowerCase(); return !e || e.endsWith('@local') || e === 'quangapps.dev@gmail.com' || swpIsTest(e); }
    function swpDaysSince(iso) { if (!iso) return null; const d = new Date(iso); if (isNaN(d.getTime())) return null; return Math.floor((Date.now() - d.getTime()) / 86400000); }
    function swpPct(num, den) { if (!den || den <= 0) return '—'; return (Math.round((num / den) * 1000) / 10) + '%'; }
    function swpFmtDate(iso) { if (!iso) return '<span class="muted">—</span>'; const d = new Date(iso); if (isNaN(d.getTime())) return '<span class="muted">—</span>'; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
    function swpFmtRelative(iso) {
      if (!iso) return '<span class="muted">jamais</span>';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      if (days < 0) return 'dans le futur';
      if (days === 0) return "aujourd'hui";
      if (days === 1) return 'hier';
      if (days < 30) return `il y a ${days}j`;
      if (days < 365) return `il y a ${Math.floor(days / 30)} mois`;
      return `il y a ${Math.floor(days / 365)} an(s)`;
    }
    function swpPlanBadge(c) {
      if (c.revoked) return '<span class="badge rev">Revoked</span>';
      if (c.plan === 'trial') return '<span class="badge trial">Trial</span>';
      if (c.plan === 'pro') return '<span class="badge pro">Pro</span>';
      return `<span class="badge">${safeText(c.plan || '?')}</span>`;
    }
    // rank bas = plus urgent (sert au tri par risque). Ordre d'évaluation STRICT — le 1er match gagne.
    function swpHealth(cu) {
      if (swpIsTest(cu.email)) return { rank: 6, cls: 'test', label: 'Test / démo' };
      if (cu.revoked) return { rank: 5, cls: 'rev', label: 'Révoqué' };
      const days = swpDaysSince(cu.lastUsed);
      if (cu.plan === 'pro') {
        if (cu.lsStatus === 'past_due' || cu.lsStatus === 'unpaid') return { rank: 1, cls: 'warn', label: `Paiement échoué (${cu.lsStatus})` };
        if (cu.lsStatus === 'not_found') return { rank: 5, cls: 'rev', label: 'Clé orpheline (pas un abonnement)' };
        if (cu.lsStatus && cu.lsStatus !== 'active' && cu.lsStatus !== 'on_trial') return { rank: 1, cls: 'warn', label: `Sub ${cu.lsStatus}` };
        if (days === null) return { rank: 0, cls: 'risk', label: 'Payé · jamais utilisé' };
        if (days > 14) return { rank: 1, cls: 'warn', label: `Payé · inactif ${days}j` };
        return { rank: 3, cls: 'ok', label: 'Actif' };
      }
      if (days === null) return { rank: 2, cls: 'trial', label: 'Trial · 0 usage' };
      return { rank: 4, cls: 'ok', label: 'Trial actif' };
    }
    // Revenu SV ESTIMÉ par décomposition greedy des crédits en packs (miroir du gateway), pas une somme de transactions.
    function svRevenue(granted) {
      let g = Number(granted || 0), eur = 0;
      SV_PACKS.forEach(p => { while (g >= p.c) { g -= p.c; eur += p.e; } });
      if (g > 0) eur += (g / 300000) * 7.90;
      return eur;
    }
    function svHours(credits) { return Math.round((Number(credits || 0) / SV_CPH) * 10) / 10; }
    function svFmt(n) { return Number(n || 0).toLocaleString('fr-FR'); }

    // === P3b1 — DictoKey : données + helpers (parité stricte avec render(), index.html v1.23.0) ===
    const DK_GATEWAY = 'https://api-gateway-dictokey.quang101182.workers.dev';
    const DK_PERIOD = '7d';
    const TRACKING_BASELINE_VISITS = 1874;   // visites au 14/04/2026, démarrage du tracking clics sendBeacon (l.2728)

    async function fetchDk(cfg, signal) {
      const headers = { Authorization: `Bearer ${getToken(cfg)}` };
      const j = async url => { const r = await fetch(url, { signal, headers }); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); };
      const pub = (url, fallback) => fetch(url, { signal }).then(r => r.json()).catch(() => fallback);
      const [mon, stats, dev, visit, click, play] = await Promise.all([
        j(`${DK_GATEWAY}/admin/monitoring?period=${DK_PERIOD}&advanced=1`),
        j(`${DK_GATEWAY}/admin/stats`),
        j(`${DK_GATEWAY}/admin/devices`),
        pub(`${ACQ_GATEWAY}/api/visit?page=dk`, { total: 0, today: 0 }),
        pub(`${ACQ_GATEWAY}/api/click?page=dk`, { total: 0, today: 0, by_btn: {} }),
        // Play Store toléré (403 possible pendant la propagation Google). AWAITÉ ici, contrairement au prod qui le
        // lance en fire-and-forget depuis render() → la race condition du prod (window._kpiDevicesCtx + re-render
        // via updateKpiDevices) disparaît. Chiffres finaux identiques, un seul rendu.
        j(`${DK_GATEWAY}/admin/playstore-stats`).catch(() => null)
      ]);
      return { mon, stats, dev, visit, click, play };
    }

    function dkPctChange(today, yesterday) {
      if (yesterday === 0 && today === 0) return { text: '—', cls: 'neutral' };
      if (yesterday === 0) return { text: '+∞', cls: 'up' };
      const p = Math.round(((today - yesterday) / yesterday) * 100);
      if (p > 0) return { text: `+${p}%`, cls: 'up' };
      if (p < 0) return { text: `${p}%`, cls: 'down' };
      return { text: '0%', cls: 'neutral' };
    }
    function dkFmtDateTime(s) { const d = new Date(s); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    // UTC forcé : last_data_date / window_* viennent du Worker qui parse les CSV Google en UTC (l.2957-2971).
    function dkPlayDate(iso) { return iso ? new Date(iso + 'T00:00:00Z').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', timeZone: 'UTC' }) : '?'; }
    function dkDaysSinceUtc(iso) {
      if (!iso) return null;
      const now = new Date();
      const todayUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      return Math.floor((todayUtc - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    }
    // Fantôme = free jamais utilisé (et pas premium runtime, sinon ce n'est pas un fantôme).
    // ⚠ UNIFICATION v2 : la prod définit ce test 3 fois (render l.2606, renderDevicesPage l.4008 = ms + tier
    // minusculé ; donut pays l.2811 = comparaison de strings ISO + `d.tier` BRUT sans minuscules). Vérifié le
    // 16/07 sur les 464 devices réels : les 2 variantes donnent 65, ZÉRO écart (tiers déjà en minuscules,
    // aucune date manquante) → unifiées ici sans changer un seul chiffre. Le donut de P3b3 doit utiliser CE helper.
    function dkIsPhantom(d) {
      if ((d.tier || 'free').toLowerCase() !== 'free') return false;
      if (d.effectiveTier) return false;
      const created = new Date(d.createdAt).getTime();
      const seen = new Date(d.lastSeen).getTime();
      return seen <= created;   // NaN si date absente/invalide → false (non-fantôme), comme la prod
    }

    // Cohortes devices — PC exclus (préfixe `pc_`). premiumRuntime = KV free + effective premium UNIQUEMENT
    // (v1.7.21 : `tier !== 'pro'` incluait à tort les KV premium → ne pas réintroduire).
    function dkDeviceStats(dev) {
      const devicesList = ((dev && dev.devices) || []).filter(d => !(d.deviceId || '').toLowerCase().startsWith('pc_'));
      const tierCounts = { pro: 0, premium: 0, free: 0 };
      let phantomCount = 0, premiumRuntimeCount = 0;
      devicesList.forEach(d => {
        const tier = (d.tier || 'free').toLowerCase();
        if (tierCounts[tier] !== undefined) tierCounts[tier]++; else tierCounts.free++;
        if (d.effectiveTier === 'premium' && tier === 'free') premiumRuntimeCount++;
        if (dkIsPhantom(d)) phantomCount++;
      });
      const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
      const newDevicesToday = devicesList.filter(d => { if (!d.createdAt) return false; const t = new Date(d.createdAt).getTime(); return !isNaN(t) && t >= startOfToday.getTime(); }).length;
      return { devicesList, tierCounts, phantomCount, premiumRuntimeCount,
               effectiveFree: tierCounts.free - premiumRuntimeCount,
               totalPremium: tierCounts.premium + premiumRuntimeCount, newDevicesToday };
    }

    // === P3b2 — Appareils DictoKey : état + helpers (parité stricte, index.html l.3786-4061) ===
    // 30/page — ÉCART ASSUMÉ vs prod (50/page), demande explicite Quang le 16/07 : pages plus courtes,
    // surtout lisible en mobile. N'affecte AUCUN chiffre (total, KPI, filtres) — seulement le nb de pages.
    const DK_PER_PAGE = 30;
    const LS_TIER_FILTERS = 'monitoring_tier_filters';   // même clé que la prod → filtres hérités
    const dkDevState = { page: 0, search: '', filters: dkLoadTierFilters(), all: [], filtered: [] };
    function dkLoadTierFilters() {
      try {
        const stored = localStorage.getItem(LS_TIER_FILTERS);
        if (stored) { const p = JSON.parse(stored); return { pro: p.pro !== false, premium: p.premium !== false, free: p.free !== false }; }
      } catch (e) {}
      return { pro: true, premium: true, free: true };
    }
    function dkSaveTierFilters() { try { localStorage.setItem(LS_TIER_FILTERS, JSON.stringify(dkDevState.filters)); } catch (e) {} }
    // Catégorie EFFECTIVE. Les 2 sources de premium sont disjointes par construction :
    //   - `tier === 'premium'` en KV  → écrit par l'APP (`/device/restore` ou `/device/update-tier`), pas à la main
    //   - `effectiveTier === 'premium'` avec KV free → premium runtime (app < v2.61.4 qui n'a jamais syncé le KV)
    // ⚠ Seul `pro` est admin-set (cadeau à vie). NE PAS décrire les premium comme « manuels » — ce sont des achats Google Play.
    // 🐛 CORRIGE UN BUG DE LA PROD (divergence assumée, feu vert Quang 16/07) : `getDeviceCategory()` (l.3813-3822)
    // teste `pro` puis `effectiveTier === 'premium'`, et OUBLIE le cas `tier === 'premium'` en KV → ces appareils
    // retombaient dans « free ». Sur les données réelles : 12 KV premium + 6 runtime = 18, dont 2 KV premium sans
    // aucun signal runtime → pills premium 16 au lieu de 18, et ces 2 disparaissaient dès qu'on décochait « free ».
    // Le summary, lui, les comptait bien (totalPremium = 18) → les 2 sources se contredisaient.
    function dkDeviceCategory(d) {
      const kvTier = (d.tier || 'free').toLowerCase();
      if (kvTier === 'pro') return 'pro';
      if (kvTier === 'premium' || d.effectiveTier === 'premium') return 'premium';
      return 'free';
    }
    function dkDetectPlatform(deviceId) { return (deviceId || '').toLowerCase().startsWith('pc_') ? 'PC' : 'Mobile'; }
    function dkRelativeTime(s) {
      const mins = Math.floor((Date.now() - new Date(s).getTime()) / 60000);
      if (mins < 1) return "À l'instant";
      if (mins < 60) return `Il y a ${mins}min`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `Il y a ${hours}h`;
      return `Il y a ${Math.floor(hours / 24)}j`;
    }
    function dkTimeOnly(s) { if (!s) return ''; const d = new Date(s); return isNaN(d.getTime()) ? '' : `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    function dkDateStack(s) {
      if (!s) return '—';
      const d = new Date(s);
      if (isNaN(d.getTime())) return '—';
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}<div class="time-sub">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div>`;
    }
    function dkCountryFlag(code) { return (!code || code === '—') ? '' : `<img src="https://flagcdn.com/20x15/${String(code).toLowerCase()}.png" width="20" height="15" alt="${safeText(code)}" class="flag">`; }
    function dkApplyDeviceFilters(resetPage) {
      const q = (dkDevState.search || '').toLowerCase();
      dkDevState.filtered = (dkDevState.all || []).filter(d => {
        const cat = dkDeviceCategory(d);
        if (!dkDevState.filters[cat]) return false;
        if (!q) return true;
        return (d.deviceId || '').toLowerCase().includes(q) || cat.includes(q)
          || dkDetectPlatform(d.deviceId || '').toLowerCase().includes(q) || (d.country || '').toLowerCase().includes(q);
      });
      const totalPages = Math.ceil(dkDevState.filtered.length / DK_PER_PAGE);
      dkDevState.page = (resetPage === false) ? Math.min(dkDevState.page, Math.max(totalPages - 1, 0)) : 0;
    }

    // === P2 — Agrégats Home (dérivés des mêmes compteurs publics que la vue Acquisition) ===
    // Somme cohérente avec la vue acq : hub/swp/sv comptent les `out:*`, DictoKey compte `clicks.total` (outMode).
    function acqSiteOut(acq, key) {
      const d = acq[key] || {};
      const clicks = d.clicks || {};
      if ((ACQ_META[key] || {}).outMode === 'total') return acqInt(clicks.total);
      const bb = clicks.by_btn_all || {};
      return Object.keys(bb).reduce((sum, b) => b.indexOf('out:') === 0 ? sum + acqInt(bb[b]) : sum, 0);
    }
    function acqTotals(acq) {
      if (!acq) return null;
      let visites = 0, today = 0;
      ['se7', 'dk', 'swp', 'sv'].forEach(k => { const v = (acq[k] && acq[k].visit) || {}; visites += acqInt(v.total); today += acqInt(v.today); });
      const hb = (acq.se7 && acq.se7.clicks && acq.se7.clicks.by_btn_all) || {};
      const engagement = acqInt(hb['f:demo']) + acqInt(hb['f:chat']) + acqInt(hb['f:cta']);
      const hubOut = Object.keys(hb).reduce((sum, k) => k.indexOf('out:') === 0 ? sum + acqInt(hb[k]) : sum, 0);
      const sortants = hubOut + ['dk', 'swp', 'sv'].reduce((sum, k) => sum + acqSiteOut(acq, k), 0);
      return { visites, today, engagement, sortants };
    }
    // Alertes RÉELLES calculables sur les données publiques. Les alertes produit (churn SWP,
    // snapshot figé DictoKey, backend absent) exigent les données token-gated → lot P3.
    function homeAlerts(acq) {
      if (!acq) return [];
      const list = [];
      ['dk', 'swp', 'sv'].forEach(k => {
        const vTot = acqInt(((acq[k] || {}).visit || {}).total);
        const out = acqSiteOut(acq, k);
        if (vTot >= 50 && out === 0) list.push({ level: 'attention', title: ACQ_META[k].name, message: `${vTot} visites mais aucun clic sortant — le parcours de sortie ne convertit pas.` });
      });
      return list;
    }

    // === P3 — Vue SubWhisper Pro (parité stricte avec renderSwp, index.html l.2300-2424) ===
    function renderSwpView(payload) {
      const data = payload && payload.overview;
      if (!data) return EmptyState('SubWhisper Pro', 'Aucune donnée reçue de /admin/swp/overview.');
      const u = data.usage_this_month || { transcriptions: 0, translations: 0 };
      const visits = data.site_visits || { total: 0, today: 0 };
      const lim = data.limits_per_plan || {};
      const limTrial = lim.trial || { transcriptions: '?', translations: '?' };
      const limPro = lim.pro || { transcriptions: '?', translations: '?' };
      // Cohortes — base de TOUS les chiffres. Les KPI excluent les test/démo ; le TABLEAU les inclut (2 populations).
      const swpList = (data.customers_list || []).map(cu => Object.assign({}, cu, { _h: swpHealth(cu) }));
      swpList.sort((a, b) => (a._h.rank - b._h.rank) || String(b.created || '').localeCompare(String(a.created || '')));
      const real = swpList.filter(c => !swpIsTest(c.email));
      const proNonRevoked = real.filter(c => c.plan === 'pro' && !c.revoked);
      const payants = proNonRevoked.filter(c => c.lsStatus === 'active');   // 'active' STRICT
      const pastDue = proNonRevoked.filter(c => c.lsStatus === 'past_due' || c.lsStatus === 'unpaid');
      const orphanPro = proNonRevoked.filter(c => c.lsStatus === 'not_found');
      const trialsActifs = real.filter(c => c.plan === 'trial' && !c.revoked);
      const revokedReal = real.filter(c => c.revoked);
      const atRisk = real.filter(c => c._h.rank <= 1);
      const jamais = real.filter(c => c._h.rank === 0);
      const nbTest = swpList.length - real.length;
      const mrr = payants.length * SWP_PRICE_EUR;

      // Bandeau d'alerte — 3 états exclusifs
      let alertHtml = '';
      if (atRisk.length > 0) {
        const reasons = [];
        if (jamais.length > 0) reasons.push(`${jamais.length} payé(s) jamais utilisé(s) (risque remboursement)`);
        if (pastDue.length > 0) reasons.push(`${pastDue.length} paiement(s) en échec / past_due`);
        const inactiveOnly = atRisk.length - jamais.length - pastDue.length;
        if (inactiveOnly > 0) reasons.push(`${inactiveOnly} inactif(s) >14j`);
        const who = atRisk.slice(0, 3).map(c => c.email).join(', ') + (atRisk.length > 3 ? ' …' : '');
        alertHtml = Alert('critique', `${atRisk.length} abonné(s) à risque`, `${reasons.join(' · ')} → à relancer : ${who}`);
      } else if (payants.length > 0) {
        alertHtml = Alert('ok', 'Aucun payant à risque', `les ${payants.length} abonnement(s) actif(s) ont une activité récente.`);
      }

      const payantsSub = `${payants.length} abonnement(s) LS « active »`
        + (pastDue.length > 0 ? ` · ${pastDue.length} paiement échoué` : '')
        + (orphanPro.length > 0 ? ` · ${orphanPro.length} clé orpheline` : '');
      const money = `<div class="kpi-grid">`
        + KpiTile('💶 MRR réel', `${mrr} €`, `${payants.length} abonnement(s) LemonSqueezy « active » × ${SWP_PRICE_EUR}€ (prix liste)`)
        + KpiTile('💳 Payants actifs', payants.length, payantsSub)
        + KpiTile('⚠️ À risque', atRisk.length, 'payé jamais utilisé / inactif >14j / paiement en échec')
        + KpiTile('📉 Churn', swpPct(revokedReal.length, real.length), `${revokedReal.length} révoqués / ${real.length} clients réels (cumulé, pas mensuel)`)
        + `</div>`;

      const vTot = visits.total || 0;
      const funnel = `<div class="funnel">`
        + FunnelBar('👁 Visites', vTot, 100)
        + FunnelBar(`👥 Clients réels — ${swpPct(real.length, vTot)}`, real.length, vTot ? Math.max(2, Math.round((real.length / vTot) * 100)) : 0)
        + FunnelBar(`💳 Payants — ${swpPct(payants.length, real.length)} des clients`, payants.length, vTot ? Math.max(2, Math.round((payants.length / vTot) * 100)) : 0)
        + `</div>`;

      const cActive = proNonRevoked.length + trialsActifs.length;
      const clients = `<div class="kpi-grid">`
        + KpiTile('Clients réels SWP', real.length, `${cActive} non révoqués · ${revokedReal.length} révoqués · ${nbTest} test/démo exclus`)
        + KpiTile('Trial', trialsActifs.length, 'en période d’essai')
        + KpiTile('Pro (payant)', payants.length, `${proNonRevoked.length} clé(s) pro non-révoquée(s) · ${payants.length} active(s)`)
        + KpiTile('Revoked', revokedReal.length, 'annulés / expirés')
        + `</div>`;

      const usage = `<div class="kpi-grid">`
        + KpiTile('Transcriptions ce mois', u.transcriptions || 0, `limites : ${limTrial.transcriptions} (trial) / ${limPro.transcriptions} (pro) par client`)
        + KpiTile('Traductions ce mois', u.translations || 0, `limites : ${limTrial.translations} (trial) / ${limPro.translations} (pro) par client`)
        + KpiTile('Visites site', vTot, `+${visits.today || 0} aujourd’hui`)
        + `</div>`;

      const rows = swpList.length ? swpList.map(cu => {
        const h = cu._h;
        const cls = h.rank <= 1 ? 'row-risk' : h.cls === 'test' ? 'row-test' : h.cls === 'rev' ? 'row-rev' : '';
        const um = cu.usageMonth || {}, ut = cu.usageTotal || {};
        return `<tr class="${cls}">`
          + `<td><span class="health h-${h.cls}"><span class="hdot"></span>${safeText(h.label)}</span></td>`
          + `<td>${safeText(cu.email)}</td>`
          + `<td>${swpPlanBadge(cu)}</td>`
          + `<td>${swpFmtDate(cu.created)}</td>`
          + `<td>${swpFmtDate(cu.expiresAt)}</td>`
          + `<td title="${safeText(cu.lastUsed || '')}">${swpFmtRelative(cu.lastUsed)}</td>`
          + `<td class="mono">${um.transcriptions || 0}t / ${um.translations || 0}tr</td>`
          + `<td class="mono muted">${ut.transcriptions || 0}t / ${ut.translations || 0}tr</td>`
          + `</tr>`;
      }).join('') : '';
      const table = swpList.length
        ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Santé</th><th>Email</th><th>Statut</th><th>Créé le</th><th>Expire le</th><th>Dernière activité</th><th>Usage ${safeText(data.month || '')}</th><th>Usage total</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="empty">Aucun client pour le moment.</div>`;

      const when = new Date(data.generatedAt || Date.now()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return (alertHtml ? `<section class="section"><div class="alert-list">${alertHtml}</div></section>` : '')
        + `<section class="section"><div class="section-head"><h2>💶 Revenu &amp; abonnements</h2></div>${money}</section>`
        + `<section class="section"><div class="section-head"><h2>Funnel</h2><a href="#acq">Acquisition →</a></div>${funnel}</section>`
        + `<section class="section"><div class="section-head"><h2>Clients</h2></div>${clients}</section>`
        + `<section class="section"><div class="section-head"><h2>Usage ${safeText(data.month || '')}</h2></div>${usage}</section>`
        + `<section class="section"><div class="section-head"><h2>Détail clients · triés par risque</h2></div>${table}</section>`
        + `<div class="acq-when">Dernière mise à jour : ${safeText(when)}</div>`;
    }

    // === P3 — Vue StoryVoice (parité stricte avec renderSv, index.html l.2506-2552) ===
    function renderSvView(payload) {

      if (!data) return EmptyState('StoryVoice', 'Aucune donnée reçue de /admin/sv/overview.');

    // === P3b1 — Vue DictoKey : Overview + Play Store + Infra (devices/charts/Firebase/advanced = lots suivants) ===
    function renderDkView(payload) {

      const dauDaily = (mon.dau && mon.dau.daily) || [];
      const dauToday = dauDaily.length > 0 ? ((dauDaily[0].by_platform && dauDaily[0].by_platform.mobile) || 0) : 0;

        + `<div class="trend-item"><span class="trend-label">Churn</span><span class="trend-val churn-info"><span class="up">↑ ${mon.churn.upgrades}</span> / <span class="down">↓ ${mon.churn.downgrades}</span></span></div>`
        + `</div>`;

      // --- KPI hero « Appareils réels actifs » : Play Console prioritaire, sinon fallback cumul KV.
      // v1.10.0 : quand la source est Play, le breakdown pro/premium/free n'est PLUS affiché ici — retrancher
      // des cumuls KV d'un stock Play est mathématiquement fallacieux. Le breakdown reste dans « Appareils » (P3b2).
      const psActive = (play && play.aggregated && play.aggregated.active_devices_net) || null;
      let heroVal, heroSub;
      if (psActive && psActive > 0) {
        heroVal = psActive;
        const snapAge = dkDaysSinceUtc(play.aggregated.last_data_date);

          ? `snapshot Google au ${dkPlayDate(play.aggregated.last_data_date)}${snapAge !== null ? ` (J-${snapAge})` : ''}`

        if (ds.totalPremium > 0) parts.push(`💎 ${ds.totalPremium}`);

      const heroTile = `<article class="kpi-tile"><div class="kpi-label">Appareils réels actifs</div><div class="kpi-value">${safeText(heroVal)}</div><div class="kpi-note">${safeText(heroSub)}</div><div class="kpi-note">⚡ +${ds.newDevicesToday} aujourd’hui (KV live)</div></article>`;

      let dauSub = '';

        dauSub = `moy. ${Math.round(sum / dauDaily.length)} / pic ${max}`;
