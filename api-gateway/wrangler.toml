# ─────────────────────────────────────────────────────────────────────────────
# api-gateway — Cloudflare Worker
# URL : https://api-gateway.quang101182.workers.dev
# ─────────────────────────────────────────────────────────────────────────────
name               = "api-gateway"
main               = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─────────────────────────────────────────────────────────────────────────────
# KV Namespace — stockage clés API, rate limiting, audit log
# Créé avec : wrangler kv namespace create "GATEWAY_KV"
# ─────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "GATEWAY_KV"
id         = "3c23ec572c86471cbdce68e3ba4fdd1c"
preview_id = "3c23ec572c86471cbdce68e3ba4fdd1c"

# ─────────────────────────────────────────────────────────────────────────────
# Secrets (NE PAS mettre les valeurs ici — utiliser wrangler secret put)
#
#   wrangler secret put WORKER_SECRET   → token partagé pour les apps /api/*
#   wrangler secret put ADMIN_TOKEN     → token admin pour /admin/*
#
# Les clés API (Gemini, Groq, etc.) sont stockées dans KV via /admin/keys/set
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Cron Triggers — filet de sécurité anti-fuite pod RunPod LTX (Generate Studio)
# Le watchdog local du proxy ne tourne PAS quand le PC dort -> un pod ltx-gs peut
# fuir toute la nuit (incident 28->29/06 : ~11h à 3,29 $/h). Ce cron coupe tout pod
# ltx-gs RUNNING dont le heartbeat (POST /api/ltx_heartbeat) est périmé. Voir scheduled().
# ─────────────────────────────────────────────────────────────────────────────
[triggers]
crons = ["*/2 * * * *"]

# ─────────────────────────────────────────────────────────────────────────────
# Journal des appels — Analytics Engine (P4.1, ajoute le 29/08/2026)
#
# Le 28/08, une cle volee a fait 1200 requetes en 17 min chez Anthropic et ce
# worker n'en gardait AUCUNE trace : il a fallu une heure pour seulement l'ecarter
# des suspects. Analytics Engine encaisse une rafale (16 req/s mesures pendant
# l'attaque) sans toucher au KV, ou le rate limiter ecrit deja ~1900 fois/jour.
#
# Se relit en SQL : voir scripts/gateway_logs.py
# ─────────────────────────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "GATEWAY_LOG"
dataset = "gateway_calls"
