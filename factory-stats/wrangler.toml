# ─────────────────────────────────────────────────────────────────────────────
# factory-stats — Cloudflare Worker (Ebook Funnel Factory monitoring backend)
# URL : https://factory-stats.quang101182.workers.dev
# Read-only. Agrège ventes/revenu LemonSqueezy (par produit) + abonnés MailerLite (par groupe).
# Worker ISOLÉ (ne touche PAS api-gateway-pro = zéro risque régression revenue prod).
# Auth : Bearer ADMIN_TOKEN (wrangler secret). CORS *.
# ─────────────────────────────────────────────────────────────────────────────
name               = "factory-stats"
main               = "src/index.js"
compatibility_date = "2024-09-23"

# PRO_KV (réutilise le namespace du gateway SubWhisper Pro) → clé cfg:lemonsqueezy_api_key
[[kv_namespaces]]
binding = "PRO_KV"
id      = "8addefeaf97040daa0c1b72d19b3ee3f"

# TUC_KV (namespace The Unseen Child) → clé cfg:mailerlite_api_token (compte MailerLite partagé)
[[kv_namespaces]]
binding = "TUC_KV"
id      = "e5d02d75eb554aaf80dffbb9cf722c69"

# Secret à poser : wrangler secret put ADMIN_TOKEN
